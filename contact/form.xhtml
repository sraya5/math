<html xmlns="http://www.w3.org/1999/xhtml" lang="he-IL">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta src="https://www.w3schools.com/howto/howto_css_responsive_form.asp" />
</head>
<body>
<style>
  input, label {
    box-sizing: border-box;
    border-radius: 1em;
  }
  
  input[type=text], textarea {
    width: 100%;
    padding: 0.5em;
    border: 1px solid #555555;
    text-align: right;
  }
  
  label {
    padding: 0.5em 0.2em 0em 0em;
    display: inline-block;
  }
  
  input[type=submit] {
    background-color: #084149;
    color: white;
    padding: 0.2em 0.5em;
    border: none;
    border-radius: 0.5em;
    cursor: pointer;
    float: left;
    font-family: 'Suez One';
    font-size: 1.2em;
  }
  
  input[type=submit]:hover {
    background-color: #555555;
  }
</style>
<div class="container" align="right" style="background-color: #CCCCCC;">
  <form action="https://api.staticforms.xyz/submit" method="post" id="staticform">
    <input type="hidden" name="accessKey" value="7fbb3704-f316-4b2d-96d7-cde1713fa322" />
    <div class="row">
      <div>
        <label>שם מלא*</label>
      </div>
      <div>
        <input type="text" id="name" name="$name" required="required" />
      </div>
    </div>
    <div class="row">
      <div>
        <label>כתובת דוא"ל לתשובה (אופציונלי)</label>
      </div>
      <div>
        <input type="text" id="email" name="$email" style="text-align: left;" />
      </div>
    </div>
    <div class="row">
      <label>כאן המקום לכתוב לי כל מה שתרצו*</label>
      <textarea id="message" name="message" style="height: 7em;" required="required"></textarea>
    </div>
    <div class="row">
      <input type="hidden" name="redirectTo" value="https://math.srayaa.com/contact" />
      <input type="submit" value="שלח" />
    </div>
  </form>
</div>
</body>
</html>
