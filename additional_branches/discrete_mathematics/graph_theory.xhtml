<div class="layout Standard"><span class="inset CommandInset include" data-filename="C:\Users\sraya\AppData\Roaming\LyX2.4\macros\MKmacros.lyx">
        <div class="include body">
          <div class="layout Standard"><span class="inset Note Note"><span class="layout Plain Layout">\(\:\)</span><span class="layout Plain Layout"><b class="series bold"><span class="size larger">עקרונות מנחים לכתיבת פקודות<span class="family roman"><span class="shape up"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span><span class="lang english">Macros</span><span class="lang hebrew"> </span></span></b></span><span class="layout Plain Layout"><span class="inset CommandInset line">LatexCommand ruleoffset "0.5ex"width "100col%"height "1pt"</span></span><ol>
                <li class="layout Enumerate">כל פקודה תתחיל ב-<b class="series bold"><span class="color red"><span class="lang english">MK<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"><span class="lang hebrew"> </span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></b>גדולות ע<span class="inset Quotes erd"/>ש מיכאל קלי (<b class="series bold"><span class="color red"><span class="lang english">M</span></span></b>ichael <b class="series bold"><span class="color red">K</span></b>ali<span class="lang hebrew">), וזאת משתי סיבות:</span><ol>
                    <li class="layout Enumerate">כדי שבטבלת הקיצורים שבתוך \SpecialChar LyX תופענה כל הפקודות זו לצד זו.</li>
                    <li class="layout Enumerate">הבחירה דווקא באותיות גדולות נועדה לוודא שהפקודות אינן מתנגשות עם פקודות \SpecialChar LaTeX מקוריות.</li>
                  </ol>

    <section class="layout Section">
      <h2 class="layout Section" id="Section_1"><span class="label">1 </span>התחלה</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_1.1"><span class="label">1.1 </span>הגדרות</h3>
        <div class="layout Definition"><span class="label">הגדרה 1.1. </span><b class="series bold">גרף לא מכוון</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(V\)</span> קבוצה סופית ולא ריקה ותהא <span class="inset Formula">\(E\subseteq P\left(V\right)\)</span> כך שלכל <span class="inset Formula">\(e\in E\)</span> מתקיים <span class="inset Formula">\(\left|e\right|=2\)</span>, הזוג <span class="inset Formula">\(G:=\left(V,E\right)\)</span> הוא <u class="bar under">גרף לא מכוון</u>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 1.2. </span><b class="series bold">גרף מכוון</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(V\)</span> קבוצה סופית ולא ריקה ותהא <span class="inset Formula">\(E\subseteq V\times V\)</span>, הזוג <span class="inset Formula">\(G:=\left(V,E\right)\)</span> הוא <u class="bar under">גרף מכוון</u>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 1.3. </span>יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> גרף (מכוון/לא מכוון), איברי <span class="inset Formula">\(V\)</span> נקראים <u class="bar under">קודקודים</u> או <u class="bar under">צמתים</u> ואיברי <span class="inset Formula">\(E\)</span> נקראים <u class="bar under">צלעות</u> או <u class="bar under">קשתות</u>.</div>
        <div class="layout Standard">יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> גרף לא מכוון.</div>
        <div class="layout Definition"><span class="label">הגדרה 1.4. </span>נאמר ש-<span class="inset Formula">\(G\)</span> הוא <u class="bar under">גרף שלם</u> אם <span class="inset Formula">\(E=\left\{ e\in P\left(V\right):\left|e\right|=2\right\} \)</span>, הגרף השלם מגודל <span class="inset Formula">\(n\in\MKnatural\)</span> מסומן ב-<span class="inset Formula">\(K_{n}\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 1.5. </span><u class="bar under">הגרף המשלים</u> של <span class="inset Formula">\(G\)</span> הוא <span class="inset Formula">\(\overline{G}:=\left(V,\overline{E}\right)\)</span> כאשר <span class="inset Formula">\(\overline{E}:=\left\{ e\in P\left(V\right):\left|e\right|=2,\ e\notin E\right\} \)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 1.6. </span>נאמר שקודקודים <span class="inset Formula">\(v,u\in V\)</span> הם <u class="bar under">שכנים</u> אם מחברת ביניהם צלע (כלומר <span class="inset Formula">\(\left\{ v,u\right\} \in E\)</span>).</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 1.7. </span>יהי <span class="inset Formula">\(v\in V\)</span>, ה<u class="bar under">דרגה</u> של <span class="inset Formula">\(v\)</span> (מסומנת ב-<span class="inset Formula">\(\deg\left(v\right)\)</span>) היא מספר הקודקודים השכנים שלו (ששווה למספר הצלעות שבהן הוא מופיע).</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 1.8. </span>נאמר שקודקוד <span class="inset Formula">\(v\in V\)</span> הוא <u class="bar under">עלה</u> אם <span class="inset Formula">\(\deg\left(v\right)=1\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 1.9. </span>נאמר ש-<span class="inset Formula">\(G\)</span> הוא <u class="bar under"><span class="inset Formula">\(d\)</span>-רגולרי</u> (וגם באופן כללי <u class="bar under">גרף רגולרי</u>) אם לכל <span class="inset Formula">\(v,u\in V\)</span> מתקיים <span class="inset Formula">\(\deg v=d=\deg u\)</span> (עבור <span class="inset Formula">\(d\in\MKnatural_{0}\)</span> כלשהו).</div>
        <div class="layout Standard">יהי <span class="inset Formula">\(G':=\left(V',E'\right)\)</span> גרף מכוון ויהי <span class="inset Formula">\(v\in V'\)</span>.</div>
        <div class="layout Definition"><span class="label">הגדרה 1.10. </span><u class="bar under">דרגת היציאה</u> של <span class="inset Formula">\(v\)</span> היא מספר הצלעות היוצאות ממנו (מספר הצלעות שבהן הוא מופיע ראשון) ו<u class="bar under">דרגת הכניסה</u> של <span class="inset Formula">\(v\)</span> היא מספר הצלעות הנכנסות אליו (אלה שבהן הוא מופיע שני), דרגת הכניסה מסומנת ב-<span class="inset Formula">\(\text{indegree}\left(v\right)\)</span> ודרגת היציאה מסומנת ב-<span class="inset Formula">\(\text{outdegree}\left(v\right)\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 1.11. </span>ה<u class="bar under">דרגה</u> של <span class="inset Formula">\(v\)</span> היא <span class="inset Formula">\(\deg\left(v\right):=\text{indegree}\left(v\right)+\text{outdegree}\left(v\right)\)</span>.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> לכל <span class="inset Formula">\(n\in\MKnatural\)</span> מספר הצלעות ב-<span class="inset Formula">\(K_{n}\)</span> הוא <span class="inset Formula">\(\sum_{i=1}^{n-1}i=\frac{n^{2}-n}{2}={n \choose 2}\)</span>.</dd>
          </div>
        </dl>
        <div class="layout Standard">יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> גרף.</div>
        <div class="layout Claim"><span class="label">טענה 1.12. </span>נסמן <span class="inset Formula">\(\left\{ v_{1},v_{2},\ldots,v_{n}\right\} :=V\)</span> וא"כ <span class="inset Formula">\(\sum_{i=1}^{n}\deg\left(v_{i}\right)=2\left|E\right|\)</span>, בפרט סכום דרגות הקודקודים של כל גרף הוא זוגי.</div>
        <div class="layout Corollary"><span class="label">מסקנה 1.13. </span>מספר הקודקודים ב-<span class="inset Formula">\(G\)</span> שדרגתם אי-זוגית הוא אי-זוגי.</div>
        <div class="layout Standard">\(\:\)</div>
      </section>
    </section>
    <section class="layout Section">
      <h2 class="layout Section" id="Section_2"><span class="label">2 </span>מסלולים וקשירות</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_2.1"><span class="label">2.1 </span>הגדרות</h3>
        <div class="layout Standard">יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> גרף לא מכוון.</div>
        <div class="layout Definition"><span class="label">הגדרה 2.1. </span>נאמר שסדרת קודקודים <span class="inset Formula">\(\left(v_{1},v_{2},\ldots,v_{n}\right)\)</span> היא <u class="bar under">מסלול</u> אם <span class="inset Formula">\(\left\{ v_{i},v_{i+1}\right\} \in E\)</span> לכל <span class="inset Formula">\(n-1\geq i\in\MKnatural\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 2.2. </span>נאמר ש-<span class="inset Formula">\(G\)</span> הוא <u class="bar under">גרף קשיר</u> אם לכל שני קודקודים <span class="inset Formula">\(v,u\in V\)</span> קיים מסלול המחבר ביניהם<span class="inset Foot"><span class="label">1</span><span class="layout Plain Layout">כלומר קיים מסלול שהם נמצאים בקצותיו.</span></span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 2.3. </span><u class="bar under">יחס הקשירות</u> הוא יחס שקילות על <span class="inset Formula">\(V\)</span> שבו כל שני קודקודים <i class="shape italic">שונים</i> שקולים זה לזה אם קיים מסלול המחבר ביניהם (וכל קודקוד שקול לעצמו).</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 2.4. </span>מחלקות השקילות של יחס הקשירות נקראות <u class="bar under">רכיבי קשירות</u>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 2.5. </span><u class="bar under">מסלול פשוט</u> הוא מסלול שאין בו חזרה על קודקוד פעמיים.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 2.6. </span>מסלול שבו אין חזרה על צלע אחת פעמיים נקרא <u class="bar under">מסילה</u>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 2.7. </span><u class="bar under">מסילה פשוטה</u> היא מסילה שבה אין חזרה על קודקוד פעמיים.</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> מסלול פשוט ומסילה פשוטה הם מושגים שקולים מפני שגם מסלול פשוט אינו יכול לחזור על צלע פעמיים.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> בכל מעגל יש מעגל פשוט.</dd>
          </div>
        </dl>
        <div class="layout Definition"><span class="label">הגדרה 2.8. </span>מסלול <span class="inset Formula">\(\left(v_{0},v_{2},\ldots,v_{n}\right)\)</span> יקרא <u class="bar under">מעגל</u> אם <span class="inset Formula">\(v_{0}=v_{n}\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 2.9. </span>מעגל יקרא <u class="bar under">מעגל פשוט</u> אם אין בו חזרה על קודקוד פעמיים (מלבד החזרה המובנית של הקודקוד הראשון והאחרון).</div>
        <div class="layout Standard">\(\:\)</div>
        <div class="layout Standard">יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> גרף לא מכוון.</div>
        <div class="layout Claim"><span class="label">טענה 2.10. </span>\(\:\)<ol>
            <li class="layout Enumerate"><span class="inset Formula">\(G\)</span> קשיר אם"ם ל-<span class="inset Formula">\(G\)</span> יש רכיב קשירות יחיד.</li>
            <li class="layout Enumerate">החיתוך של שני רכיבי קשירות שונים ריק.</li>
            <li class="layout Enumerate">לכל שני קודקודים ברכיבי קשירות שונים <span class="inset Formula">\(v,u\)</span> אין צלע המחברת ביניהם<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span>(<span class="inset Formula">\(\left\{ v,u\right\} \notin E\)</span>).</li>
          </ol>
        </div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 2.11. </span>נסמן ב-<span class="inset Formula">\(r\)</span> את מספר רכיבי הקשירות של <span class="inset Formula">\(G\)</span>, מתקיים <span class="inset Formula">\(r\geq\left|V\right|-\left|E\right|\)</span>.</div>
        <div class="layout Standard">\(\:\)</div>
      </section>
    </section>
    <section class="layout Section">
      <h2 class="layout Section" id="Section_3"><span class="label">3 </span>מסלולים מיוחדים</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_3.1"><span class="label">3.1 </span>הגדרות</h3>
        <div class="layout Standard">יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> גרף לא מכוון.</div>
        <div class="layout Definition"><span class="label">הגדרה 3.1. </span>מסלול פשוט העובר על כל הקודקודים ב-<span class="inset Formula">\(V\)</span> יקרא <u class="bar under">מסלול המילטון</u><span class="inset Foot"><span class="label">2</span><span class="layout Plain Layout">ערך בוויקיפדיה: <a href="https://he.wikipedia.org/wiki/%D7%95%D7%99%D7%9C%D7%99%D7%90%D7%9D_%D7%A8%D7%95%D7%90%D7%9F_%D7%94%D7%9E%D7%99%D7%9C%D7%98%D7%95%D7%9F" class="inset CommandInset href">ויליאם ריאן המילטון</a>.</span></span> (וגם <u class="bar under">מסילת המילטון</u> מפני שמסלול פשוט ומסילה פשוטה הם מושגים שקולים).</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 3.2. </span>מעגל פשוט העובר על כל הקודקודים ב-<span class="inset Formula">\(V\)</span> יקרא <u class="bar under">מעגל המילטון</u>.</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> נכון להיום אין בנמצא אלגוריתם יעיל הקובע לכל גרף אם יש בו מעגל המילטון, וכנראה שגם לא יהיה, שכן בעיה זו היא בעיית<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="lang english">NP</span><span class="lang hebrew">-<a href="https://he.wikipedia.org/wiki/NP_(%D7%9E%D7%97%D7%9C%D7%A7%D7%AA_%D7%A1%D7%99%D7%91%D7%95%D7%9B%D7%99%D7%95%D7%AA)#%D7%91%D7%A2%D7%99%D7%95%D7%AA_NP-%D7%A7%D7%A9%D7%95%D7%AA_(NP-Hard)_%D7%95%D7%91%D7%A2%D7%99%D7%95%D7%AA_NP-%D7%A9%D7%9C%D7%9E%D7%95%D7%AA_(NPC)" class="inset CommandInset href">שלמה</a> ולכן קיום של פתרון יעיל עבורה (אלגוריתם בעל זמן ריצה פולינומיאלי) יגרור ש-<a href="https://he.wikipedia.org/wiki/%D7%91%D7%A2%D7%99%D7%99%D7%AA_P%3DNP" class="inset CommandInset href">P=NP</a>.</span></dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> אי אפשר לדבר על מעגל אוילר מבלי לדבר על <a href="https://he.wikipedia.org/wiki/%D7%94%D7%92%D7%A9%D7%A8%D7%99%D7%9D_%D7%A9%D7%9C_%D7%A7%D7%A0%D7%99%D7%92%D7%A1%D7%91%D7%A8%D7%92" class="inset CommandInset href">בעיית הגשרים של קניגסברג</a>.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> אין גרפים המקיימים <span class="inset Formula">\(\left|E\right|\geq\left|V\right|\)</span> וגם <span class="inset Formula">\(\left|V\right|&lt;3\)</span>, התנאי הראשון מיותר.</dd>
          </div>
        </dl>
        <div class="layout Definition"><span class="label">הגדרה 3.3. </span>מסילה העוברת על כל הצלעות ב-<span class="inset Formula">\(E\)</span> תקרא <u class="bar under">מסילת אוילר</u> (וגם <u class="bar under">מסלול אוילר</u>).</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 3.4. </span>מעגל העובר על כל צלע ב-<span class="inset Formula">\(E\)</span> פעם אחת בדיוק יקרא <u class="bar under">מעגל אוילר</u>.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Standard">יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> גרף לא מכוון.</div>
        <div class="layout Claim"><span class="label">טענה 3.5. </span>אם <span class="inset Formula">\(\left|V\right|\geq3\)</span> ו-<span class="inset Formula">\(\left|E\right|\geq\left|V\right|\)</span> אז יש ב-<span class="inset Formula">\(G\)</span> מעגל פשוט.</div>
        <div class="layout Standard">נניח ש-<span class="inset Formula">\(G\)</span> קשיר.</div>
        <div class="layout Claim"><span class="label">טענה 3.6. </span>אם יש ב-<span class="inset Formula">\(G\)</span> מעגל אוילר אז דרגתו של כל אחד מן הקודקודים זוגית.</div>
        <div class="layout Theorem"><span class="label">משפט 3.7. </span>יש ב-<span class="inset Formula">\(G\)</span> מעגל אוילר אם"ם דרגתו של כל אחד מן הקודקודים זוגית.</div>
        <div class="layout Claim"><span class="label">טענה 3.8. </span>אם יש ב-<span class="inset Formula">\(G\)</span> מסילת אוילר אז דרגתו של כל אחד מן הקודקודים זוגית או שיש בדיוק שני קודקודים שדרגתם אי-זוגית.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
      </section>
    </section>
    <section class="layout Section">
      <h2 class="layout Section" id="Section_4"><span class="label">4 </span>עצים</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_4.1"><span class="label">4.1 </span>הגדרות</h3>
        <div class="layout Definition"><span class="label">הגדרה 4.1. </span>גרף קשיר <span class="inset Formula">\(G\)</span> יקרא <u class="bar under">עץ</u> אם אין בו מעגלים פשוטים.</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> מכיוון שבכל מעגל יש מעגל פשוט וכל מעגל פשוט הוא מעגל הדבר שקול לגרף קשיר שאין בו מעגלים כלל.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> יחד עם טענה<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="numeric on">3.1<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"/>
                      </span></span></span></span></span><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span>נקבל שבגרף קשיר יש מעגל פשוט אם"ם <span class="inset Formula">\(\left|E\right|\geq\left|V\right|\)</span>.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> בפרט אם <span class="inset Formula">\(\left|E\right|=\left|V\right|-1\)</span> ומתקיים אחד משני התנאים האחרים אז <span class="inset Formula">\(G\)</span> הוא עץ.</dd>
          </div>
        </dl>
        <div class="layout Standard">\(\:\)</div>
        <div class="layout Claim"><span class="label">טענה 4.2. </span>בכל עץ יש עלה.</div>
        <div class="layout Corollary"><span class="label">מסקנה 4.3. </span>בכל עץ עם יותר מקודקוד אחד יש שני עלים.</div>
        <div class="layout Claim"><span class="label">טענה 4.4. </span>יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> עץ, מתקיים <span class="inset Formula">\(\left|E\right|=\left|V\right|-1\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 4.5. </span>יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> גרף קשיר כך ש-<span class="inset Formula">\(\left|E\right|=\left|V\right|-1\)</span>, אין ב-<span class="inset Formula">\(G\)</span> מעגל פשוט (כלומר <span class="inset Formula">\(G\)</span> הוא עץ).</div>
        <div class="layout Lemma"><span class="label">למה 4.6. </span>יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> גרף קשיר, אם <span class="inset Formula">\(\left(v_{1},v_{2},\ldots,v_{n}\right)\)</span> הוא מעגל פשוט ב-<span class="inset Formula">\(G\)</span> אז גם הגרף <span class="inset Formula">\(G':=\left(V,E\setminus\left\{ v_{1},v_{2}\right\} \right)\)</span> הוא גרף קשיר.</div>
        <div class="layout Corollary"><span class="label">מסקנה 4.7. </span>יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> גרף, כל שניים מהתנאים הבאים גוררים את השלישי:<ol>
            <li class="layout Enumerate"><span class="inset Formula">\(G\)</span> קשיר.</li>
            <li class="layout Enumerate"><span class="inset Formula">\(G\)</span> חסר מעגלים פשוטים<span class="inset Foot"><span class="label">3</span><span class="layout Plain Layout">שקול לחסר מעגלים.</span></span>.</li>
            <li class="layout Enumerate">מתקיים <span class="inset Formula">\(\left|E\right|=\left|V\right|-1\)</span>.</li>
          </ol>
        </div>
        <div class="layout Standard">\(\:\)</div>
      </section>
    </section>
    <section class="layout Section">
      <h2 class="layout Section" id="Section_5"><span class="label">5 </span>תורת רמזי</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_5.1"><span class="label">5.1 </span>הגדרות</h3>
        <div class="layout Standard">יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> גרף לא מכוון.</div>
        <div class="layout Definition"><span class="label">הגדרה 5.1. </span><u class="bar under">צביעה</u> של <span class="inset Formula">\(G\)</span> היא פונקציה מ-<span class="inset Formula">\(E\)</span> לקבוצת צבעים נתונה <span class="inset Formula">\(\left\{ c_{1},c_{2},\ldots,c_{n}\right\} \)</span>.</div>
        <div class="layout Claim_"><span class="label">טענה. </span>יהיו <span class="inset Formula">\(2\leq n,m\in\MKnatural\)</span>, אם קיימים <span class="inset Formula">\(a,b\in\MKnatural\)</span> כך שמתקיים:<ol>
            <li class="layout Enumerate">ב-<span class="inset Formula">\(K_{a}\)</span> הצבוע באדום וכחול יש בהכרח תת-גרף <span class="inset Formula">\(K_{n}\)</span> הצבוע כולו <span class="color red">אדום</span> ו/או תת-גרף <span class="inset Formula">\(K_{m-1}\)</span> הצבוע כולו <span class="color blue">כחול</span>.</li>
            <li class="layout Enumerate">ב-<span class="inset Formula">\(K_{b}\)</span> הצבוע באדום וכחול יש בהכרח תת-גרף <span class="inset Formula">\(K_{n-1}\)</span> הצבוע כולו <span class="color red">אדום</span> ו/או תת-גרף <span class="inset Formula">\(K_{m}\)</span> הצבוע כולו <span class="color blue">כחול</span>.</li>
          </ol>
          <div class="layout Standard">אז ב-<span class="inset Formula">\(K_{a+b}\)</span> הצבוע באדום וכחול יש בהכרח תת-גרף <span class="inset Formula">\(K_{n}\)</span> הצבוע כולו <span class="color red">אדום</span> ו/או <span class="inset Formula">\(K_{m}\)</span> הצבוע כולו <span class="color blue">כחול</span>.</div>
        </div>
        <div class="layout Theorem_"><span class="label">משפט. </span><b class="series bold">משפט רמזי</b><span class="inset Foot"><span class="label">4</span><span class="layout Plain Layout">ערך בוויקיפדיה: <a href="https://he.wikipedia.org/wiki/%D7%A4%D7%A8%D7%A0%D7%A7_%D7%A8%D7%9E%D7%96%D7%99" class="inset CommandInset href">פרנק רמזי</a>.</span></span><br class="inset Newline newline"/>יהיו <span class="inset Formula">\(2\leq n,m\in\MKnatural\)</span>, נסמן <span class="inset Formula">\(N:={n+m-2 \choose n-1}\)</span> ויהי <span class="inset Formula">\(K_{N}\)</span> כשהוא צבוע באדום וכחול, יש ב-<span class="inset Formula">\(K_{N}\)</span> תת-גרף <span class="inset Formula">\(K_{n}\)</span> שכולו צבוע <span class="color red">אדום</span> ו/או שיש ב-<span class="inset Formula">\(K_{N}\)</span> תת-גרף <span class="inset Formula">\(K_{m}\)</span> שכולו צבוע <span class="color blue">כחול</span>.</div>
        <div class="layout Corollary_"><span class="label">מסקנה. </span>לכל <span class="inset Formula">\(N&lt;M\in\MKnatural\)</span> ובהינתן צביעה של <span class="inset Formula">\(K_{M}\)</span> באדום וכחול יש ב-<span class="inset Formula">\(K_{M}\)</span> תת-גרף <span class="inset Formula">\(K_{n}\)</span> שכולו צבוע <span class="color red">אדום</span> ו/או שיש ב-<span class="inset Formula">\(K_{M}\)</span> תת-גרף <span class="inset Formula">\(K_{m}\)</span> שכולו צבוע <span class="color blue">כחול</span>.</div>
        <div class="layout Definition"><span class="label">הגדרה 5.2. </span><u class="bar under">מספר רמזי</u><span class="inset Formula">\(R\left(n,m\right)\)</span> מוגדר להיות המספר הטבעי המינימלי שעבורו לכל צביעה באדום וכחול של הגרף השלם המתאים יש בו <span class="inset Formula">\(K_{n}\)</span> שכולו צבוע אדום ו/או שיש בו גרף <span class="inset Formula">\(K_{m}\)</span> שכולו צבוע כחול.</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> נכון להיום אין בנמצא אלגוריתם יעיל לחישוב מספרי רמזי (!).</dd>
          </div>
        </dl>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 5.3. </span>יהיו <span class="inset Formula">\(2\leq n,m\in\MKnatural\)</span>, אם קיימים <span class="inset Formula">\(a,b\in\MKnatural\)</span> כך שמתקיים:<ol>
            <li class="layout Enumerate">ב-<span class="inset Formula">\(K_{a}\)</span> הצבוע באדום וכחול יש בהכרח תת-גרף <span class="inset Formula">\(K_{n}\)</span> הצבוע כולו <span class="color red">אדום</span> ו/או תת-גרף <span class="inset Formula">\(K_{m-1}\)</span> הצבוע כולו <span class="color blue">כחול</span>.</li>
            <li class="layout Enumerate">ב-<span class="inset Formula">\(K_{b}\)</span> הצבוע באדום וכחול יש בהכרח תת-גרף <span class="inset Formula">\(K_{n-1}\)</span> הצבוע כולו <span class="color red">אדום</span> ו/או תת-גרף <span class="inset Formula">\(K_{m}\)</span> הצבוע כולו <span class="color blue">כחול</span>.</li>
          </ol>
          <div class="layout Standard">אז ב-<span class="inset Formula">\(K_{a+b}\)</span> הצבוע באדום וכחול יש בהכרח תת-גרף <span class="inset Formula">\(K_{n}\)</span> הצבוע כולו <span class="color red">אדום</span> ו/או <span class="inset Formula">\(K_{m}\)</span> הצבוע כולו <span class="color blue">כחול</span>.</div>
        </div>
        <div class="layout Proof"><span class="label">הוכחה. </span>נניח שקיימים <span class="inset Formula">\(a,b\)</span> כנ"ל ונגדיר <span class="inset Formula">\(\left(V,E\right):=K_{a+b}\)</span>.<div class="layout Standard">יהי <span class="inset Formula">\(v\in V\)</span>, מהגדרת <span class="inset Formula">\(K_{a+b}\)</span> מתקיים <span class="inset Formula">\(\deg\left(v\right)=a+b-1\)</span> ולכן מעקרון שובך היונים נובע שאחד מן השניים מתקיים:</div>
          <ul>
            <li class="layout Itemize">מקרה<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="numeric on">1</span>: יש לפחות <span class="inset Formula">\(a\)</span> צלעות ב-<span class="inset Formula">\(E\)</span> הכוללות את <span class="inset Formula">\(v\)</span> וצבועות כולן ב<span class="color blue">כחול</span>.</li>
            <li class="layout Itemize">מקרה<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="numeric on">2</span>: יש לפחות <span class="inset Formula">\(b\)</span> צלעות ב-<span class="inset Formula">\(E\)</span> הכוללות את <span class="inset Formula">\(v\)</span> וצבועות כולן ב<span class="color red">אדום</span>.</li>
          </ul>
          <div class="layout Standard">במקרה<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="numeric on">1<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"/>
                    </span></span></span></span></span><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span>נתבונן ב-<span class="inset Formula">\(K_{a}\)</span>המורכב מהקודקודים המתאימים, ע"פ הנתון יש בו <span class="inset Formula">\(K_{n}\)</span> הצבוע כולו <span class="color red">אדום</span> (וסיימנו) או שיש בו <span class="inset Formula">\(K_{m-1}\)</span> הצבוע כולו <span class="color blue">כחול</span> (ואז נצרף אליו את <span class="inset Formula">\(v\)</span> ונקבל <span class="inset Formula">\(K_{m}\)</span><span class="color blue">כחול</span> וסיימנו).</div>
          <div class="layout Standard">במקרה<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="numeric on">2<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"/>
                    </span></span></span></span></span><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span>נתבונן ב-<span class="inset Formula">\(K_{b}\)</span>המורכב מהקודקודים המתאימים, ע"פ הנתון יש בו יש בו <span class="inset Formula">\(K_{m}\)</span> הצבוע כולו <span class="color blue">כחול</span> (וסיימנו) או שיש בו <span class="inset Formula">\(K_{n-1}\)</span> הצבוע כולו <span class="color red">אדום</span> (ואז נצרף אליו את <span class="inset Formula">\(v\)</span> ונקבל <span class="inset Formula">\(K_{n}\)</span><span class="color red">אדום</span> וסיימנו).</div>
        </div>
        <div class="layout Theorem"><span class="label">משפט 5.4. </span><b class="series bold">משפט רמזי</b><span class="inset Foot"><span class="label">5</span><span class="layout Plain Layout">ערך בוויקיפדיה: <a href="https://he.wikipedia.org/wiki/%D7%A4%D7%A8%D7%A0%D7%A7_%D7%A8%D7%9E%D7%96%D7%99" class="inset CommandInset href">פרנק רמזי</a>.</span></span><br class="inset Newline newline"/>יהיו <span class="inset Formula">\(2\leq n,m\in\MKnatural\)</span>, נסמן <span class="inset Formula">\(N:={n+m-2 \choose n-1}\)</span> ויהי <span class="inset Formula">\(K_{N}\)</span> כשהוא צבוע באדום וכחול, יש ב-<span class="inset Formula">\(K_{N}\)</span> תת-גרף <span class="inset Formula">\(K_{n}\)</span> שכולו צבוע <span class="color red">אדום</span> ו/או שיש ב-<span class="inset Formula">\(K_{N}\)</span> תת-גרף <span class="inset Formula">\(K_{m}\)</span> שכולו צבוע <span class="color blue">כחול</span>.</div>
        <div class="layout Proof"><span class="label">הוכחה. </span>נוכיח את הטענה באינדוקציה על <span class="inset Formula">\(n+m\)</span>.<ul>
            <li class="layout Itemize"><u class="bar under">בסיס האינדוקציה:</u><span class="inset Formula">\(n+m=4\)</span> ומכאן ש-<span class="inset Formula">\(n=m=2\)</span> ו-<span class="inset Formula">\(N:={2+2-2 \choose 2-1}={2 \choose 1}=2\)</span> ואכן ב-<span class="inset Formula">\(K_{2}\)</span> יש רק צלע אחת וממילא הוא מקיים שיש בו תת-גרף <span class="inset Formula">\(K_{2}\)</span> הצבוע כולו באותו צבע (<span class="color red">אדום</span>/<span class="color blue">כחול</span>).</li>
            <li class="layout Itemize"><u class="bar under">צעד האינדוקציה:</u> יהי <span class="inset Formula">\(4\leq k\in\MKnatural\)</span> ונניח שלכל <span class="inset Formula">\(2\leq a,b\in\MKnatural\)</span> המקיימים <span class="inset Formula">\(k=a+b\)</span> יש ב-<span class="inset Formula">\(K_{N}\)</span><span class="inset Foot"><span class="label">6</span><span class="layout Plain Layout">כאשר <span class="inset Formula">\(N:={a+b-2 \choose a-1}\)</span>.</span></span> (כשהוא צבוע אדום וכחול) תת-גרף <span class="inset Formula">\(K_{a}\)</span>צבוע כולו <span class="color red">אדום</span> ו/או שיש בו תת-גרף <span class="inset Formula">\(K_{b}\)</span> הצבוע כולו <span class="color blue">כחול</span>.<div class="layout Standard">יהיו <span class="inset Formula">\(2\leq n.m\in\MKnatural\)</span> כך ש-<span class="inset Formula">\(k+1=n+m\)</span>, נשים לב שמתקיים <span class="inset Formula">\(k=n+\left(m-1\right)\)</span> ו-<span class="inset Formula">\(k=\left(n-1\right)+m\)</span> ונגדיר:<span class="inset Formula">\[
N:={n+m-2 \choose n-1}={n+m-3 \choose n-1}+{n+m-3 \choose n-2}={n+\left(m-1\right)-2 \choose n-1}+{\left(n-1\right)+m-2 \choose \left(n-1\right)-1}
\]</span>מהנחת האינדוקציה ומהטענה הקודמת נובע שיש ב-<span class="inset Formula">\(K_{N}\)</span> תת-גרף <span class="inset Formula">\(K_{n}\)</span> שכולו צבוע <span class="color red">אדום</span> ו/או שיש ב-<span class="inset Formula">\(K_{N}\)</span> תת-גרף <span class="inset Formula">\(K_{m}\)</span> שכולו צבוע <span class="color blue">כחול</span>.</div>
            </li>
          </ul>
        </div>
        <div class="layout Corollary"><span class="label">מסקנה 5.5. </span>לכל <span class="inset Formula">\(N&lt;M\in\MKnatural\)</span> ובהינתן צביעה של <span class="inset Formula">\(K_{M}\)</span> באדום וכחול יש ב-<span class="inset Formula">\(K_{M}\)</span> תת-גרף <span class="inset Formula">\(K_{n}\)</span> שכולו צבוע <span class="color red">אדום</span> ו/או שיש ב-<span class="inset Formula">\(K_{M}\)</span> תת-גרף <span class="inset Formula">\(K_{m}\)</span> שכולו צבוע <span class="color blue">כחול</span>.</div>
        <div class="layout Claim"><span class="label">טענה 5.6. </span>בהינתן צביעה של <span class="inset Formula">\(K_{6}\)</span> באדום וכחול קיים ב-<span class="inset Formula">\(K_{6}\)</span> תת-גרף <span class="inset Formula">\(K_{3}\)</span> שכל צלעותיו צבועות באותו הצבע.</div>
        <div class="layout Corollary"><span class="label">מסקנה 5.7. </span><span class="inset Formula">\(R\left(3,3\right)=6\)</span>.</div>
        <div class="layout Claim"><span class="label">טענה 5.8. </span>לכל <span class="inset Formula">\(2\leq n\in\MKnatural\)</span> מתקיים <span class="inset Formula">\(R\left(2,n\right)=n\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 5.9. </span>מתקיים <span class="inset Formula">\(R\left(3,4\right)=9\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 5.10. </span>לכל <span class="inset Formula">\(2\leq n,m\in\MKnatural\)</span> מתקיים <span class="inset Formula">\(R\left(n,m\right)=R\left(m,n\right)\)</span>.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
      </section>
    </section>
    <section class="layout Section">
      <h2 class="layout Section" id="Section_6"><span class="label">6 </span>קוביות, גרפים דו-צדדיים וזיווגים</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_6.1"><span class="label">6.1 </span>הגדרות</h3>
        <div class="layout Definition"><span class="label">הגדרה 6.1. </span><u class="bar under">הקוביה ה-<span class="inset Formula">\(n\)</span> מימדית</u> היא הגרף <span class="inset Formula">\(Q_{n}:=\left(V,E\right)\)</span> כאשר <span class="inset Formula">\(V:=\left\{ 0,1\right\} ^{n}\)</span> ובין כל שני קודקודים השונים זה מזה בקואורדינטה אחת בדיוק מחברת צלע.</div>
        <div class="layout Standard">יהי <span class="inset Formula">\(G:=\left(V,E\right)\)</span> גרף לא מכוון.</div>
        <div class="layout Definition"><span class="label">הגדרה 6.2. </span><b class="series bold">גרף דו-צדדי</b><br class="inset Newline newline"/>נאמר ש-<span class="inset Formula">\(G\)</span> הוא <u class="bar under">דו-צדדי</u> אם קיימים <span class="inset Formula">\(V_{1},V_{2}\subseteq V\)</span> כך ש-<span class="inset Formula">\(V_{1}\cup V_{2}=V\)</span> ו-<span class="inset Formula">\(V_{1}\cap V_{2}=\emptyset\)</span> ובנוסף לכל <span class="inset Formula">\(e\in E\)</span> מתקיים <span class="inset Formula">\(\left|V_{1}\cap e\right|=1\)</span> (כלומר כל צלע מכילה בדיוק קודקוד אחד מ-<span class="inset Formula">\(V_{1}\)</span> וקודקוד אחד מ-<span class="inset Formula">\(V_{2}\)</span>), תתי-הקבוצות <span class="inset Formula">\(V_{1}\)</span> ו-<span class="inset Formula">\(V_{2}\)</span> נקראות <u class="bar under">הצדדים</u> של <span class="inset Formula">\(G\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 6.3. </span><b class="series bold">גרף דו-צדדי שלם</b><br class="inset Newline newline"/>נאמר ש-<span class="inset Formula">\(G\)</span> הוא <u class="bar under">דו-צדדי שלם</u> אם הוא דו-צדדי וכל קודקוד בצד אחד של <span class="inset Formula">\(G\)</span> הוא שכן של כל קודקוד בצד האחר, נסמן ב-<span class="inset Formula">\(K_{n,m}\)</span> את הגרף הדו-צדדי השלם שצדדיו בגודל <span class="inset Formula">\(m\)</span> ו-<span class="inset Formula">\(n\)</span> (יש רק אחד כזה).</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> ב-<span class="inset Formula">\(K_{n,m}\)</span> מתקיים <span class="inset Formula">\(\left|V\right|=n+m\)</span> ו-<span class="inset Formula">\(\left|E\right|=n\cdot m\)</span>.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> זיווג מושלם בגרף דו-צדדי מגדיר פונקציה חח"ע ועל מצד אחד לצד השני, מכאן שאם יש בגרף דו-צדדי זיווג מושלם אז צדדיו באותו גודל.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> זוהי הכללה של טענה<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="color blue">
                <a href="#claim 6.4" class="inset CommandInset ref">6.4</a>.</span></dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> בהנחה ש-<span class="inset Formula">\(\left|V_{1}\right|=\left|V_{2}\right|\)</span> מתקיים: יש ב-<span class="inset Formula">\(G\)</span> זיווג מושלם אם"ם <span class="inset Formula">\(\left|N\left(S\right)\right|\geq\left|S\right|\)</span> לכל <span class="inset Formula">\(S\subseteq V_{1}\)</span>.</dd>
          </div>
        </dl>
        <div class="layout Definition"><span class="label">הגדרה 6.4. </span>נאמר ש-<span class="inset Formula">\(M\subseteq E\)</span> הוא <u class="bar under">זיווג</u> אם לכל <span class="inset Formula">\(e_{1},e_{2}\in M\)</span> מתקיים <span class="inset Formula">\(e_{1}\cap e_{2}=\emptyset\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 6.5. </span>נאמר שזיווג <span class="inset Formula">\(M\subseteq E\)</span> הוא <u class="bar under">זיווג מושלם</u> אם לכל <span class="inset Formula">\(v\in V\)</span> קיימת <span class="inset Formula">\(e\in M\)</span> כך ש-<span class="inset Formula">\(v\in e\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 6.6. </span>לכל <span class="inset Formula">\(S\subseteq V\)</span> נגדיר את <span class="inset Formula">\(N\left(S\right)\)</span> להיות קבוצת השכנים של איברי <span class="inset Formula">\(S\)</span> (יש המסמנים אותה ב-<span class="inset Formula">\(\Gamma\left(S\right)\)</span>).</div>
        <div class="layout Claim"><span class="label">טענה 6.7. </span>ב-<span class="inset Formula">\(Q_{n}=\left(V,E\right)\)</span> מתקיים:<ol>
            <li class="layout Enumerate"><span class="inset Formula">\(\left|V\right|=2^{n}\)</span>.</li>
            <li class="layout Enumerate"><span class="inset Formula">\(\deg\left(v\right)=n\)</span> לכל <span class="inset Formula">\(v\in V\)</span>.</li>
            <li class="layout Enumerate"><span class="inset Formula">\(\left|E\right|=n\cdot2^{n-1}\)</span>.</li>
          </ol>
        </div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 6.8. </span>לכל <span class="inset Formula">\(2\leq n\in\MKnatural\)</span> יש ב-<span class="inset Formula">\(Q_{n}\)</span> מעגל המילטון.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Standard">יהי <span class="inset Formula">\(G:=\left(V_{1}\cup V_{2},E\right)\)</span> גרף דו-צדדי כאשר <span class="inset Formula">\(V_{1}\)</span> ו-<span class="inset Formula">\(V_{2}\)</span> הם צדדיו.</div>
        <div class="layout Claim"><span class="label">טענה 6.9. </span>לכל מעגל <span class="inset Formula">\(\left(v_{0},v_{1},v_{2},\ldots,v_{n}\right)\)</span> ב-<span class="inset Formula">\(G\)</span> מתקיים <span class="inset Formula">\(n\in\MKeven\)</span>.</div>
        <div class="layout Claim"><span class="label">טענה 6.10. </span><span id="claim 6.4" class="inset CommandInset label"/>אם קיימים <span class="inset Formula">\(v,u\in V_{1}\)</span> שדרגתם היא <span class="inset Formula">\(1\)</span> וקיים <span class="inset Formula">\(w\in V_{2}\)</span> כך ש-<span class="inset Formula">\(\left\{ w,v\right\} ,\left\{ w,u\right\} \in E\)</span> אז אין ב-<span class="inset Formula">\(G\)</span> זיווג מושלם.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 6.11. </span>לכל <span class="inset Formula">\(S\subseteq V_{1}\)</span> מתקיים <span class="inset Formula">\(N\left(S\right)\subseteq V_{2}\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 6.12. </span>אם יש ב-<span class="inset Formula">\(G\)</span> זיווג מושלם אז לכל <span class="inset Formula">\(S\subseteq V_{1}\)</span> מתקיים <span class="inset Formula">\(\left|N\left(S\right)\right|\geq\left|S\right|\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 6.13. </span><b class="series bold">משפט החתונה - משפט הול</b><span class="inset Foot"><span class="label">7</span><span class="layout Plain Layout">ערך בוויקיפדיה: <a href="https://he.wikipedia.org/wiki/%D7%A4%D7%99%D7%9C%D7%99%D7%A4_%D7%94%D7%95%D7%9C" class="inset CommandInset href">פיליפ הול</a>.</span></span><div class="layout Standard">אם <span class="inset Formula">\(\left|V_{1}\right|=\left|V_{2}\right|\)</span> וגם לכל <span class="inset Formula">\(S\subseteq V_{1}\)</span> מתקיים <span class="inset Formula">\(\left|N\left(S\right)\right|\geq\left|S\right|\)</span> אז יש ב-<span class="inset Formula">\(G\)</span> זיווג מושלם.</div>
        </div>
        <div class="layout Claim"><span class="label">טענה 6.14. </span>אם <span class="inset Formula">\(G\)</span> הוא גם <span class="inset Formula">\(d\)</span>-רגולרי (עבור <span class="inset Formula">\(d\in\MKnatural\)</span> כלשהו<span class="inset Foot"><span class="label">8</span><span class="layout Plain Layout"><span class="inset Formula">\(d\)</span> בהכרח שונה מ-<span class="inset Formula">\(0\)</span>.</span></span>) אז יש ב-<span class="inset Formula">\(G\)</span> זיווג מושלם.</div>
      </section>
