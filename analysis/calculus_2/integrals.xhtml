        <div class="layout Theorem"><span class="label">משפט 5.14. </span><span id="theorem 4.5" class="inset CommandInset label"/><b class="series bold">מבחן דיריכלה לאינטגרלים לא אמיתיים</b><ul>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(f\)</span> רציפה ב-<span class="inset Formula">\(\left[a,\infty\right)\)</span> והפונקציה הצוברת שלה חסומה בקרן זו, אם <span class="inset Formula">\(g\)</span> גזירה ומונוטונית המקיימת <span class="inset Formula">\(\lim_{x\rightarrow\infty}g\left(x\right)=0\)</span> (כלומר <span class="inset Formula">\(g\)</span> אי-שלילית/אי-חיובית) ובנוסף <span class="inset Formula">\(g'\)</span> אינטגרבילית רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left[a,\infty\right)\)</span> אז האינטגרל <span class="inset Formula">\(\intop_{a}^{\infty}f\left(x\right)\cdot g\left(x\right)dx\)</span> מתכנס.</li>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(f\)</span> רציפה ב-<span class="inset Formula">\(\left(-\infty,a\right]\)</span> והפונקציה הצוברת שלה חסומה בקרן זו, אם <span class="inset Formula">\(g\)</span> גזירה ומונוטונית המקיימת <span class="inset Formula">\(\lim_{x\rightarrow-\infty}g\left(x\right)=0\)</span> (כלומר <span class="inset Formula">\(g\)</span> אי-שלילית/אי-חיובית) ובנוסף <span class="inset Formula">\(g'\)</span> אינטגרבילית רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left(-\infty,a\right]\)</span> אז האינטגרל <span class="inset Formula">\(\intop_{-\infty}^{a}f\left(x\right)\cdot g\left(x\right)dx\)</span> מתכנס.</li>
          </ul>
        </div>
        <div class="layout Proof"><span class="label">הוכחה. </span>נוכיח את הסעיף הראשון ובהג"כ נניח ש-<span class="inset Formula">\(g\)</span> מונוטונית יורדת, ההוכחה עבור פונקציה מונוטונית עולה ועבור קרן שמאלית דומה למדי.<br class="inset Newline newline"/>תהא <span class="inset Formula">\(F\)</span> הפונקציה הצוברת של <span class="inset Formula">\(f\)</span> (מהמשפט היסודי של החשבון האינטגרלי <span class="inset Formula">\(F\)</span> היא פונקציה קדומה של <span class="inset Formula">\(f\)</span>) ויהי <span class="inset Formula">\(M\in\MKreal\)</span> כך ש-<span class="inset Formula">\(\left|F\left(x\right)\leq M\right|\)</span> לכל <span class="inset Formula">\(x\in\left[a,\infty\right)\)</span>.<br class="inset Newline newline"/>מהיותה של <span class="inset Formula">\(g\)</span> מונוטונית יורדת נדע ש-<span class="inset Formula">\(g\)</span> אינטגרבילית רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left[a,\infty\right)\)</span><span class="inset Foot"><span class="label">40</span><span class="layout Plain Layout">ולכן גם מכפלתה ב-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן כל כל תת-קטע סגור של <span class="inset Formula">\(\left[a,\infty\right)\)</span>.</span></span> וש-<span class="inset Formula">\(g'\)</span> אי-חיובית.<br class="inset Newline newline"/>מאינטגרציה בחלקים נובע כי לכל <span class="inset Formula">\(x\in\left[a,\infty\right)\)</span> מתקיים:<span class="inset Formula">\[
\intop_{a}^{x}f\left(t\right)\cdot g\left(t\right)dt=\left.\left(F\cdot g\right)\right|_{a}^{b}-\intop_{a}^{x}F\left(t\right)\cdot g'\left(t\right)\ dt
\]</span>נשים לב לכך ש לכל <span class="inset Formula">\(x\in\left[a,\infty\right)\)</span> מתקיים:<span class="inset Formula">\[\begin{align*}
F\left(x\right)\cdot g\left(x\right)-F\left(a\right)\cdot g\left(a\right) &amp; =F\left(x\right)\cdot g\left(x\right)-0\cdot g\left(a\right)\\
 &amp; =F\left(x\right)\cdot g\left(x\right)\\
 &amp; \leq M\cdot g\left(x\right)\xrightarrow[x\rightarrow\infty]{}0
\end{align*}\]</span>ובנוסף גם:<span class="inset Formula">\[\begin{align*}
\intop_{a}^{x}\left|F\left(t\right)\cdot g'\left(t\right)\right|dt &amp; =\intop_{a}^{x}\left|F\left(t\right)\right|\cdot\left|g'\left(t\right)\right|dt\leq\intop_{a}^{x}M\cdot\left|g'\left(t\right)\right|dt\\
 &amp; =M\cdot\intop_{a}^{x}\left|g'\left(t\right)\right|dt=M\cdot\intop_{a}^{x}-g'\left(t\right)dt=-M\cdot\intop_{a}^{x}g'\left(t\right)dt
\end{align*}\]</span>כעת נזכור ש-<span class="inset Formula">\(g'\)</span> אינטגרבילית רימן כל כל תת-קטע סגור של <span class="inset Formula">\(\left[a,\infty\right)\)</span> ולכן, ע"פ נוסחת לייבניץ-ניוטון, לכל <span class="inset Formula">\(x\in\left[a,\infty\right)\)</span> מתקיים גם:<span class="inset Formula">\[
\intop_{a}^{x}g'\left(t\right)dt=g\left(x\right)-g\left(a\right)\xrightarrow[x\rightarrow\infty]{}-g\left(a\right)
\]</span>כלומר האינטגרל <span class="inset Formula">\(-M\cdot\intop_{a}^{\infty}g'\left(t\right)dt\)</span> מתכנס ולכן ממבחן ההשוואה גם <span class="inset Formula">\(\intop_{a}^{\infty}F\left(t\right)\cdot g'\left(t\right)\)</span> מתכנס בהחלט ובפרט מתכנס, מאריתמטיקה של גבולות נקבל שהאינטגרל המבוקש מתכנס.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Theorem"><span class="label">משפט 5.15. </span><span id="theorem 4.6" class="inset CommandInset label"/>\(\:\)<ul>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן בכל תת-קטע סגור של <span class="inset Formula">\(\left[a,\infty\right)\)</span>,<ul>
                <li class="layout Itemize">אם <span class="inset Formula">\(f\)</span> היא פונקציה <b class="series bold"><span class="color blue">אי-שלילית</span></b> ומונוטונית <b class="series bold"><span class="color green">יורדת</span></b> אז האינטגרל <span class="inset Formula">\(\intop_{a}^{\infty}f\left(x\right)dx\)</span> והטור <span class="inset Formula">\(\sum_{n=0}^{\infty}f\left(a+n\right)\)</span> מתכנסים ומתבדרים ביחד.</li>
                <li class="layout Itemize">אם <span class="inset Formula">\(f\)</span> היא פונקציה <b class="series bold"><span class="color blue">שלילית</span></b> ומונוטונית <b class="series bold"><span class="color green">עולה</span></b> אז האינטגרל <span class="inset Formula">\(\intop_{a}^{\infty}f\left(x\right)dx\)</span> והטור <span class="inset Formula">\(\sum_{n=0}^{\infty}f\left(a+n\right)\)</span> מתכנסים ומתבדרים ביחד.</li>
              </ul>
            </li>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן בכל תת-קטע סגור של <span class="inset Formula">\(\left(-\infty,a\right]\)</span>,<ul>
                <li class="layout Itemize">אם <span class="inset Formula">\(f\)</span> היא פונקציה <b class="series bold"><span class="color blue">אי-חיובית</span></b> ומונוטונית <b class="series bold"><span class="color green">עולה</span></b> אז האינטגרל <span class="inset Formula">\(\intop_{-\infty}^{a}f\left(x\right)dx\)</span> והטור <span class="inset Formula">\(\sum_{n=0}^{\infty}f\left(a-n\right)\)</span> מתכנסים ומתבדרים ביחד.</li>
                <li class="layout Itemize">אם <span class="inset Formula">\(f\)</span> היא פונקציה <b class="series bold"><span class="color blue">אי-שלילית</span></b> ומונוטונית <b class="series bold"><span class="color green">יורדת</span></b> אז האינטגרל <span class="inset Formula">\(\intop_{-\infty}^{a}f\left(x\right)dx\)</span> והטור <span class="inset Formula">\(\sum_{n=0}^{\infty}f\left(a-n\right)\)</span> מתכנסים ומתבדרים ביחד.</li>
              </ul>
            </li>
          </ul>
        </div>
        <div class="layout Proof"><span class="label">הוכחה. </span>נוכיח את הסעיף הראשון, ההוכחה עבור הסעיפים האחרים דומה מאד.<br class="inset Newline newline"/>מהעובדה ש-<span class="inset Formula">\(f\)</span> מונוטונית יורדת ואי-שלילית נובע שלכל <span class="inset Formula">\(n\in\MKnatural_{0}\)</span> ולכל <span class="inset Formula">\(x\in\left[a+n-1,a+n\right]\)</span> מתקיים:<span class="inset Formula">\[
f\left(a+n+1\right)\leq f\left(x\right)\leq f\left(a+n\right)
\]</span>וממילא:<span class="inset Formula">\[
f\left(a+n+1\right)=\intop_{a+n}^{a+n+1}f\left(a+n+1\right)dx\leq\intop_{a+n}^{a+n+1}f\left(x\right)dx\leq\intop_{a+1}^{a+n+1}f\left(a+n\right)dx=f\left(a+n\right)
\]</span>ולכן לכל <span class="inset Formula">\(N\in\MKnatural_{0}\)</span> מתקיים:<span class="inset Formula">\[
\sum_{n=1}^{N+1}f\left(a+n\right)=\sum_{n=0}^{N}f\left(a+n+1\right)\leq\sum_{n=0}^{N}\intop_{a+n}^{a+n+1}f\left(x\right)dx\leq\sum_{n=0}^{N}f\left(a+n\right)
\]</span>מכאן שע"פ מבחן ההשוואה הטור <span class="inset Formula">\(\begin{alignedat}{1}\sum_{n=0}^{\infty}f\left(a+n\right)\end{alignedat}
\)</span> מתכנס אם"ם הטור <span class="inset Formula">\(\begin{alignedat}{1}\sum_{n=0}^{\infty}\intop_{a+n}^{a+n+1}f\left(x\right)dx\end{alignedat}
\)</span> מתכנס.<br class="inset Newline newline"/>נשים לב לכך שלכל <span class="inset Formula">\(N\in\MKnatural_{0}\)</span> מתקיים:<span class="inset Formula">\[
\sum_{n=0}^{N}\intop_{a+n}^{a+n+1}f\left(x\right)dx=\intop_{a}^{a+N+1}f\left(x\right)dx
\]</span>ולכך שמהיות <span class="inset Formula">\(f\)</span> אי-שלילית נובע שלכל <span class="inset Formula">\(x\in\left[a,\infty\right)\)</span> מתקיים קיים <span class="inset Formula">\(N\in\MKnatural_{0}\)</span> כך שמתקיים:<span class="inset Formula">\[
\intop_{a}^{a+N}f\left(x\right)dx\leq\intop_{a}^{x}f\left(t\right)dt\leq\intop_{a}^{a+N+1}f\left(x\right)dx
\]</span>ולכן (מדובר בשוויון פורמלי בלבד):<span class="inset Formula">\[
\lim_{N\rightarrow\infty}\intop_{a}^{a+N}f\left(x\right)dx=\lim_{x\rightarrow\infty}\intop_{a}^{x}f\left(t\right)dt=\intop_{a}^{\infty}f\left(x\right)dx
\]</span>כלומר הגבול שבאגף שמאל קיים אם"ם האינטגרל שבאגף ימין מתכנס ואז הם שווים.</div>
        <div class="layout Corollary"><span class="label">מסקנה 5.16. </span><span id="corollary 4.7" class="inset CommandInset label"/>יהי <span class="inset Formula">\(\alpha\)</span>, האינטגרל <span class="inset Formula">\(\begin{alignedat}{1}\intop_{1}^{\infty}x^{\alpha}\ dx\end{alignedat}
\)</span> מתכנס אם"ם <span class="inset Formula">\(\alpha&lt;-1\)</span>.</div>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_5.3"><span class="label">5.3 </span>אינטגרל של פונקציה לא חסומה</h3>
        <div class="layout Standard">יהיו <span class="inset Formula">\(a,b\in\MKreal\)</span> כך ש-<span class="inset Formula">\(a&lt;b\)</span> ותהא <span class="inset Formula">\(f:\left[a,b\right]\rightarrow\MKreal\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 5.17. </span><span id="theorem 4.8" class="inset CommandInset label"/><b class="series bold">מעבר בין שני סוגי האינטגרלים הלא אמיתיים</b><ul>
            <li class="layout Itemize">אם <span class="inset Formula">\(a\)</span> היא הנקודה המיוחדת היחידה של <span class="inset Formula">\(f\)</span> אז (מדובר בשוויון פורמלי בלבד):<span class="inset Formula">\[
\intop_{a}^{b}f\left(x\right)dx=\intop_{\frac{1}{b-a}}^{\infty}f\left(a+\frac{1}{y}\right)\cdot\frac{1}{y^{2}}\ dy
\]</span>כלומר האינטגרלים מתכנסים ומתבדרים ביחד ובמקרה של התכנסות הם שווים.</li>
            <li class="layout Itemize">אם <span class="inset Formula">\(b\)</span> היא הנקודה המיוחדת היחידה של <span class="inset Formula">\(f\)</span> אז (מדובר בשוויון פורמלי בלבד):<span class="inset Formula">\[
\intop_{a}^{b}f\left(x\right)dx=\intop_{\frac{1}{b-a}}^{\infty}f\left(b-\frac{1}{y}\right)\cdot\frac{1}{y^{2}}\ dy
\]</span>כלומר האינטגרלים מתכנסים ומתבדרים ביחד ובמקרה של התכנסות הם שווים.</li>
          </ul>
        </div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> האינטואיציה למשפט היא שאם ניקח את הגרף של פונקציה לא חסומה בקטע סגור ונשקף אותו סביב האלכסון הראשי נקבל גרף של פונקציה<span class="inset Foot"><span class="label">41</span><span class="layout Plain Layout">למעשה אם הפונקציה אינה הפיכה אנחנו לא נקבל גרף של פונקציה ולכן פה האינטואיציה כושלת מעט אך המשפט עובד למרות בעיה זו מפני שהוא אינו משתמש בהפיכות של <span class="inset Formula">\(f\)</span> אלא בהצבה.</span></span> חסומה המוגדרת על קרן, לדוגמה קל לראות (מבחינה גאומטרית שמתקיים:<span class="inset Formula">\[
\intop_{0}^{1}\ln\left(x\right)dx=\intop_{-\infty}^{1}\exp\left(x\right)dx
\]</span></dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> המשפט מאפשר לנו לעבור בין סוגי האינטגרלים הלא אמיתיים כדי לבדוק את ההתכנסות של אינטגרל נתון וכך נוכל להשתמש במבחני ההתכנסות של שני הסוגים.</dd>
          </div>
        </dl>
        <div class="layout Corollary"><span class="label">מסקנה 5.18. </span>יהי <span class="inset Formula">\(\alpha\in\MKreal\)</span>, האינטגרל <span class="inset Formula">\(\begin{alignedat}{1}\intop_{0}^{1}x^{\alpha}dx\end{alignedat}
\)</span> מתכנס אם"ם <span class="inset Formula">\(\alpha&gt;-1\)</span> ולכן האינטגרל <span class="inset Formula">\(\intop_{0}^{\infty}x^{\beta}\ dx\)</span> אינו מתכנס לכל <span class="inset Formula">\(\beta\in\MKreal\)</span>.</div>
        <div class="layout Proof"><span class="label">הוכחה. </span>מהמשפט הקודם )<a href="#theorem 4.8" class="inset CommandInset ref">4.8</a>( נובע שמתקיים )שוויון פורמלי בלבד(:<span class="inset Formula">\[
\intop_{0}^{1}x^{\alpha}dx=\intop_{\frac{1}{1-0}}^{\infty}\left(0+\frac{1}{y}\right)^{\alpha}\cdot\frac{1}{y^{2}}dy=\intop_{1}^{\infty}y^{-\alpha}\cdot y^{-2}\ dy=\intop_{1}^{\infty}y^{-\alpha-2}\ dy
\]</span>ממסקנה <a href="#corollary 4.7" class="inset CommandInset ref">4.7</a> נובע שהאינטגרלים הנ"ל מתכנסים אם"ם <span class="inset Formula">\(-\alpha-2&lt;-1\)</span> כלומר אם"ם <span class="inset Formula">\(\alpha&gt;-1\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 5.19. </span><span id="theorem 4.10" class="inset CommandInset label"/><b class="series bold">תנאי קושי להתכנסות של אינטגרל לא אמיתי של פונקציה לא חסומה</b><ul>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(a\)</span> היא הנקודה המיוחדת היחידה של <span class="inset Formula">\(f\)</span>, תנאי הכרחי ומספיק לכך ש-<span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\)</span> יתכנס הוא שלכל <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span> קיימת <span class="inset Formula">\(0&lt;\delta\in\MKreal\)</span> כך שלכל <span class="inset Formula">\(\delta_{1},\delta_{2}\in\left(0,\delta\right)\)</span> מתקיים:<span class="inset Formula">\[
\left|\intop_{a+\delta_{1}}^{a+\delta_{2}}f\left(x\right)dx\right|&lt;\varepsilon
\]</span></li>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(b\)</span> היא הנקודה המיוחדת היחידה של <span class="inset Formula">\(f\)</span>, תנאי הכרחי ומספיק לכך ש-<span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\)</span> יתכנס הוא שלכל <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span> קיימת <span class="inset Formula">\(0&lt;\delta\in\MKreal\)</span> כך שלכל <span class="inset Formula">\(\delta_{1},\delta_{2}\in\left(0,\delta\right)\)</span> מתקיים:<span class="inset Formula">\[
\left|\intop_{b-\delta_{1}}^{b-\delta_{2}}f\left(x\right)dx\right|&lt;\varepsilon
\]</span></li>
          </ul>
        </div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Theorem"><span class="label">משפט 5.20. </span><span id="theorem 4.11" class="inset CommandInset label"/><b class="series bold">מבחן ההשוואה</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(g:\left[a,b\right]\rightarrow\MKreal\)</span>, נניח ש-<span class="inset Formula">\(a\)</span> או <span class="inset Formula">\(b\)</span> היא הנקודה המיוחדת היחידה של <span class="inset Formula">\(f\)</span> ו-<span class="inset Formula">\(g\)</span> ושקיים <span class="inset Formula">\(0&lt;c\in\MKreal\)</span> לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> מתקיים <span class="inset Formula">\(0\leq f\left(x\right)\leq c\cdot g\left(x\right)\)</span>,<ol>
            <li class="layout Enumerate">אם <span class="inset Formula">\(\intop_{a}^{b}g\left(x\right)dx\)</span> מתכנס אז גם <span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\)</span> מתכנס.</li>
            <li class="layout Enumerate">אם <span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\)</span> מתבדר אז גם <span class="inset Formula">\(\intop_{a}^{b}g\left(x\right)dx\)</span> מתבדר.</li>
          </ol>
        </div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Theorem"><span class="label">משפט 5.21. </span><span id="theorem 4.12" class="inset CommandInset label"/><b class="series bold">מבחן ההשוואה הגבולי<br class="inset Newline newline"/>
          </b>תהא <span class="inset Formula">\(g:\left[a,b\right]\rightarrow\MKreal\)</span>.<ul>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(a\)</span> היא הנקודה המיוחדת היחידה של <span class="inset Formula">\(f\)</span> ו-<span class="inset Formula">\(g\)</span> ושקיים <span class="inset Formula">\(c\in\left(a,b\right]\)</span> כך שלכל <span class="inset Formula">\(x\in\left(a,c\right]\)</span> מתקיים <span class="inset Formula">\(0&lt;g\left(x\right)\)</span> ו-<span class="inset Formula">\(0\leq f\left(x\right)\)</span>.<br class="inset Newline newline"/>אם הגבול <span class="inset Formula">\(\lim_{x\rightarrow a}\frac{f\left(x\right)}{g\left(x\right)}\)</span> קיים וחיובי אז האינטגרלים <span class="inset Formula">\(\intop_{a}^{\infty}f\left(x\right)dx\)</span> ו-<span class="inset Formula">\(\intop_{a}^{\infty}g\left(x\right)dx\)</span> מתכנסים ומתבדרים ביחד.</li>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(b\)</span> היא הנקודה המיוחדת היחידה של <span class="inset Formula">\(f\)</span> ו-<span class="inset Formula">\(g\)</span> ושקיים <span class="inset Formula">\(c\in\left[a,b\right)\)</span> כך שלכל <span class="inset Formula">\(x\in\left[c,b\right)\)</span> מתקיים <span class="inset Formula">\(0&lt;g\left(x\right)\)</span> ו-<span class="inset Formula">\(0\leq f\left(x\right)\)</span>.<br class="inset Newline newline"/>אם הגבול <span class="inset Formula">\(\lim_{x\rightarrow b}\frac{f\left(x\right)}{g\left(x\right)}\)</span> קיים וחיובי אז האינטגרלים <span class="inset Formula">\(\intop_{a}^{\infty}f\left(x\right)dx\)</span> ו-<span class="inset Formula">\(\intop_{a}^{\infty}g\left(x\right)dx\)</span> מתכנסים ומתבדרים ביחד.</li>
          </ul>
        </div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Theorem"><span class="label">משפט 5.22. </span><span id="theorem 4.13" class="inset CommandInset label"/><b class="series bold">מבחן דיריכלה לאינטגרלים לא אמיתיים</b><ul>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(f\)</span> רציפה ב-<span class="inset Formula">\(\left[a,b\right)\)</span> והפונקציה הצוברת שלה חסומה בקטע זה, אם <span class="inset Formula">\(g\)</span> גזירה ומונוטונית המקיימת <span class="inset Formula">\(\lim_{x\rightarrow b}g\left(x\right)=0\)</span> )כלומר <span class="inset Formula">\(g\)</span> אי-שלילית/אי-חיובית( ובנוסף <span class="inset Formula">\(g'\)</span> אינטגרבילית רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left[a,b\right)\)</span> אז האינטגרל <span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)\cdot g\left(x\right)dx\)</span> מתכנס.</li>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(f\)</span> רציפה ב-<span class="inset Formula">\(\left(a,b\right]\)</span> והפונקציה הצוברת שלה חסומה בקטע זה, אם <span class="inset Formula">\(g\)</span> גזירה ומונוטונית המקיימת <span class="inset Formula">\(\lim_{x\rightarrow a}g\left(x\right)=0\)</span> )כלומר <span class="inset Formula">\(g\)</span> אי-שלילית/אי-חיובית( ובנוסף <span class="inset Formula">\(g'\)</span> אינטגרבילית רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left(a,b\right]\)</span> אז האינטגרל <span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)\cdot g\left(x\right)dx\)</span> מתכנס.</li>
          </ul>
        </div>
        <div class="layout Proof"><span class="label">הוכחה. </span>נוכיח את הסעיף הראשון ובהג"כ נניח ש-<span class="inset Formula">\(g\)</span> מונוטונית יורדת, ההוכחה עבור פונקציה מונוטונית עולה ועבור הקטע <span class="inset Formula">\(\left(a,b\right]\)</span> דומה למדי.<br class="inset Newline newline"/>תהא <span class="inset Formula">\(F\)</span> הפונקציה הצוברת של <span class="inset Formula">\(f\)</span> )מהמשפט היסודי של החשבון האינטגרלי <span class="inset Formula">\(F\)</span> היא פונקציה קדומה של <span class="inset Formula">\(f\)</span>( ויהי <span class="inset Formula">\(M\in\MKreal\)</span> כך ש-<span class="inset Formula">\(\left|F\left(x\right)\leq M\right|\)</span> לכל <span class="inset Formula">\(x\in\left[a,b\right)\)</span>.<br class="inset Newline newline"/>מהיותה של <span class="inset Formula">\(g\)</span> מונוטונית יורדת נדע ש-<span class="inset Formula">\(g\)</span> אינטגרבילית רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left[a,\infty\right)\)</span><span class="inset Foot"><span class="label">42</span><span class="layout Plain Layout">ולכן גם מכפלתה ב-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן כל כל תת-קטע סגור של <span class="inset Formula">\(\left[a,\infty\right)\)</span>.</span></span> וש-<span class="inset Formula">\(g'\)</span> אי-חיובית.<br class="inset Newline newline"/>מאינטגרציה בחלקים נובע כי לכל <span class="inset Formula">\(x\in\left[a,b\right)\)</span> מתקיים:<span class="inset Formula">\[
\intop_{a}^{x}f\left(t\right)\cdot g\left(t\right)dt=\left.\left(F\cdot g\right)\right|_{a}^{b}-\intop_{a}^{x}F\left(t\right)\cdot g'\left(t\right)\ dt
\]</span>נשים לב לכך ש לכל <span class="inset Formula">\(x\in\left[a,b\right)\)</span> מתקיים:<span class="inset Formula">\[\begin{align*}
F\left(x\right)\cdot g\left(x\right)-F\left(a\right)\cdot g\left(a\right) &amp; =F\left(x\right)\cdot g\left(x\right)-0\cdot g\left(a\right)\\
 &amp; =F\left(x\right)\cdot g\left(x\right)\\
 &amp; \leq M\cdot g\left(x\right)\xrightarrow[x\rightarrow b]{}0
\end{align*}\]</span>ובנוסף גם:<span class="inset Formula">\[\begin{align*}
\intop_{a}^{x}\left|F\left(t\right)\cdot g'\left(t\right)\right|dt &amp; =\intop_{a}^{x}\left|F\left(t\right)\right|\cdot\left|g'\left(t\right)\right|dt\leq\intop_{a}^{x}M\cdot\left|g'\left(t\right)\right|dt\\
 &amp; =M\cdot\intop_{a}^{x}\left|g'\left(t\right)\right|dt=M\cdot\intop_{a}^{x}-g'\left(t\right)dt=-M\cdot\intop_{a}^{x}g'\left(t\right)dt
\end{align*}\]</span>כעת נזכור ש-<span class="inset Formula">\(g'\)</span> אינטגרבילית רימן כל כל תת-קטע סגור של <span class="inset Formula">\(\left[a,b\right)\)</span> ולכן, ע"פ נוסחת לייבניץ-ניוטון, לכל <span class="inset Formula">\(x\in\left[a,b\right)\)</span> מתקיים גם:<span class="inset Formula">\[
\intop_{a}^{x}g'\left(t\right)dt=g\left(x\right)-g\left(a\right)\xrightarrow[x\rightarrow b]{}-g\left(a\right)
\]</span>כלומר האינטגרל <span class="inset Formula">\(-M\cdot\intop_{a}^{b}g'\left(t\right)dt\)</span> מתכנס ולכן ממבחן ההשוואה גם <span class="inset Formula">\(\intop_{a}^{b}F\left(t\right)\cdot g'\left(t\right)\)</span> מתכנס בהחלט ובפרט מתכנס, מאריתמטיקה של גבולות נקבל שהאינטגרל המבוקש מתכנס.</div>
      </section>
