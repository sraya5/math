    <section class="layout Section">
      <h2 class="layout Section" id="Section_3"><span class="label">3 </span>האינטגרל המסוים (שטחים)</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_3.1"><span class="label">3.1 </span>הגדרות</h3>
        <div class="layout Standard">יהיו <span class="inset Formula">\(a,b\in\MKreal\)</span> כך ש-<span class="inset Formula">\(a&lt;b\)</span> ותהא <span class="inset Formula">\(f:\left[a,b\right]\rightarrow\MKreal\)</span>.</div>
        <div class="layout Definition"><span class="label">הגדרה 3.1. </span>נאמר שקבוצה סופית <span class="inset Formula">\(P\subseteq\left[a,b\right]\)</span> היא <u class="bar under">חלוקה של הקטע</u><span class="inset Formula">\(\left[a,b\right]\)</span> אם <span class="inset Formula">\(a,b\in P\)</span>.<br class="inset Newline newline"/>לכל חלוקה <span class="inset Formula">\(P=\left\{ x_{0},x_{1},\ldots,x_{n}\right\} \)</span> של <span class="inset Formula">\(\left[a,b\right]\)</span> כך ש-<span class="inset Formula">\(a=x_{0}&lt;x_{1}&lt;\ldots&lt;x_{n}=b\)</span> נסמן <span class="inset Formula">\(\lambda\left(P\right):=\max\left\{ x_{i}-x_{i-1}\mid n\geq i\in\MKnatural\right\} \)</span> ונכנה את <span class="inset Formula">\(\lambda\left(P\right)\)</span> בשם <u class="bar under">פרמטר החלוקה</u> של <span class="inset Formula">\(P\)</span>.<br class="inset Newline newline"/>נאמר שקבוצה <span class="inset Formula">\(P^{*}:=\left\{ t_{1},t_{2},\ldots,t_{n}\right\} \)</span> היא <u class="bar under">בחירת נקודות</u> עבור חלוקה <span class="inset Formula">\(P:=\left\{ x_{0},x_{1},\ldots,x_{n}\right\} \subseteq\left[a,b\right]\)</span> אם <span class="inset Formula">\(t_{i}\in\left[x_{i-1},x_{i}\right]\)</span> לכל <span class="inset Formula">\(n\geq i\in\MKnatural_{0}\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 3.2. </span><b class="series bold">סכום רימן</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(P:=\left\{ x_{0},x_{1},\ldots,x_{n}\right\} \)</span> חלוקה של <span class="inset Formula">\(\left[a,b\right]\)</span>.<br class="inset Newline newline"/><u class="bar under">סכום רימן</u> של <span class="inset Formula">\(f\)</span> עבור החלוקה <span class="inset Formula">\(P\)</span> ובחירת הנקודות<span class="inset Formula">\(P^{*}\)</span> הוא כל סכום מהצורה:<span class="inset Formula">\[
\sum_{i=1}^{n}f\left(t_{i}\right)\cdot\left(x_{i}-x_{i-1}\right)
\]</span>כאשר <span class="inset Formula">\(\left\{ t_{1},t_{2},\ldots,t_{n}\right\} \)</span> היא בחירת נקודות עבור <span class="inset Formula">\(P\)</span>.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 3.3. </span><b class="series bold">אינטגרביליות לפי רימן</b><br class="inset Newline newline"/>נאמר ש-<span class="inset Formula">\(f\)</span><u class="bar under">אינטגרבילית רימן</u> על הקטע <span class="inset Formula">\(\left[a,b\right]\)</span> אם קיים <span class="inset Formula">\(I\in\MKreal\)</span> כך שלכל <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span> קיימת <span class="inset Formula">\(0&lt;\delta\in\MKreal\)</span> כך שלכל חלוקה <span class="inset Formula">\(P\)</span> של <span class="inset Formula">\(\left[a,b\right]\)</span> המקיימת <span class="inset Formula">\(\lambda\left(P\right)&lt;\delta\)</span> ולכל סכום רימן <span class="inset Formula">\(S\)</span> של <span class="inset Formula">\(f\)</span> עבור <span class="inset Formula">\(P\)</span> מתקיים <span class="inset Formula">\(\left|S-I\right|&lt;\varepsilon\)</span>.</div>
        <div class="layout Claim"><span class="label">טענה 3.4. </span>אם <span class="inset Formula">\(f\)</span> אינטגרבילית רימן על <span class="inset Formula">\(\left[a,b\right]\)</span> אז קיים <span class="inset Formula">\(I\in\MKreal\)</span> יחיד המקיים את ההגדרה.</div>
        <div class="layout Standard">בגלל טענה זו יש משמעות לסימון (עבור אותו <span class="inset Formula">\(I\)</span>):<span class="inset Formula">\[
\intop_{a}^{b}f\left(x\right)dx:=I
\]</span></div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> נשים לב כיצד ההגדרות הללו מפרמלות את מה שראינו בהקדמה האינטואיטיבית: סכום רימן הוא בעצם סכום של שטחי מלבנים שצלע אחת שלהם מונחת על ציר ה-<span class="inset Formula">\(x\)</span> והצלע המקבילה לה חותכת את הגרף של <span class="inset Formula">\(f\)</span>, הגדרת "אינטגרביליות רימן" אומרת שניתן לחשב את השטח שבין הגרף של <span class="inset Formula">\(f\)</span> לציר ה-<span class="inset Formula">\(x\)</span><span class="inset Foot"><span class="label">25</span><span class="layout Plain Layout">נשים לב לכך שאין מניעה ש-<span class="inset Formula">\(I\)</span> יהיה שלילי.</span></span> אם"ם כשמשאיפים את גדלי המלבנים ל-<span class="inset Formula">\(0\)</span> מתקרבים תמיד לאותו מספר ואז אותו מספר הוא השטח.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> הסימון של האינטגרל מרמז על הגדרת האינטגרל המסוים של רימן: הסימן "<span class="inset Formula">\(\intop\)</span>" הוא כעין <span class="inset Formula">\(s\)</span> (האות הראשונה של<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="lang english">sum</span><span class="lang hebrew">) ואנו סוכמים על מכפלות של ערכי הפונקציה (<span class="inset Formula">\(f\left(x\right)\)</span>) באורכי הקטעים (<span class="inset Formula">\(dx\)</span>); זוהי גם האינטואיציה מאחורי השיטה הלא פורמלית של אינטגרציה ע"י הצבה שראינו בפרק הקודם (בקובץ הטענות), שכן כפי שנראה כשנלמד על המשפט היסודי ישנו קשר הדוק בין האינטגרל המסוים לאינטגרל הלא מסוים.</span></dd>
          </div>
          <div class="layout Description item">
            <dt class="layout Description">סימון:</dt>
            <dd class="layout Description"> נסמן ב-<span class="inset Formula">\(B\left[a,b\right]\)</span> את קבוצת הפונקציות החסומות על קטע <span class="inset Formula">\(\left[a,b\right]\)</span> וב-<span class="inset Formula">\(R\left[a,b\right]\)</span> את קבוצת הפונקציות שאינטגרביליות רימן עליו.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> כמובן שמהגדרה מתקיים <span class="inset Formula">\(L\left(f,P\right)\leq U\left(f,P\right)\)</span>.</dd>
          </div>
          <div class="layout Description item">
            <dt class="layout Description">סימון:</dt>
            <dd class="layout Description"> נסמן ב-<span class="inset Formula">\(\sigma\left(f,P\right)\)</span> את קבוצת סכומי רימן של <span class="inset Formula">\(f\)</span> עבור <span class="inset Formula">\(P\)</span>.</dd>
          </div>
          <div class="layout Description item">
            <dt class="layout Description">סימון:</dt>
            <dd class="layout Description"> נסמן ב-<span class="inset Formula">\(\mathcal{U}\left(f\right)\)</span> את קבוצת סכומי דארבו העליונים של <span class="inset Formula">\(f\)</span> עבור חלוקות של <span class="inset Formula">\(\left[a,b\right]\)</span>, וב-<span class="inset Formula">\(\mathcal{L}\left(f\right)\)</span> את קבוצת סכומי דארבו התחתונים של <span class="inset Formula">\(f\)</span> עבור חלוקות של <span class="inset Formula">\(\left[a,b\right]\)</span>.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> נשים לב לדמיון בין ההגדרות של אינטגרל עליון של פונקציה לבין זו של גבול עליון של סדרה וכמו כן בין ההגדרות של אינטגרל תחתון ושל גבול תחתון; בנוסף, כבר כעת ניתן לראות (אינטואיטיבית) שכמו שסדרה מתכנסת אם"ם הגבול העליון שלה שווה לתחתון גם פונקציה היא אינטגרבילית רימן אם"ם האינטגרל העליון שלה שווה לתחתון (נראה את המשפט הזה בהמשך).</dd>
          </div>
        </dl>
        <div class="layout Standard">יהיו <span class="inset Formula">\(a,b\in\MKreal\)</span> כך ש-<span class="inset Formula">\(a&lt;b\)</span>.</div>
        <div class="layout Standard">תהיינה <span class="inset Formula">\(f\in B\left[a,b\right]\)</span> ו-<span class="inset Formula">\(P:=\left\{ x_{0},x_{1},\ldots,x_{n}\right\} \)</span> חלוקה של <span class="inset Formula">\(\left[a,b\right]\)</span>.</div>
        <div class="layout Definition"><span class="label">הגדרה 3.5. </span><b class="series bold">סכומי דארבו</b><span class="inset Foot"><span class="label">26</span><span class="layout Plain Layout">ערך בוויקיפדיה: <a href="https://he.wikipedia.org/wiki/%D7%96%27%D7%90%D7%9F_%D7%92%D7%A1%D7%98%D7%95%D7%9F_%D7%93%D7%90%D7%A8%D7%91%D7%95" class="inset CommandInset href">ז'אן גסטון דארבו</a>.</span></span><br class="inset Newline newline"/>נסמן (לכל <span class="inset Formula">\(n\geq i\in\MKnatural\)</span>):<span class="inset Formula">\[
M_{i}\left(f,P\right):=\sup\left\{ f\left(t\right)\mid t\in\left[x_{i-1},x_{i}\right]\right\} ,\ m_{i}\left(f,P\right):=\inf\left\{ f\left(t\right)\mid t\in\left[x_{i-1},x_{i}\right]\right\} 
\]</span>ונגדיר:<span class="inset Formula">\[\begin{align*}
U\left(f,P\right) &amp; :=\sum_{i=1}^{n}M_{i}\left(f,P\right)\cdot\left(x_{i}-x_{i-1}\right)\\
L\left(f,P\right) &amp; :=\sum_{i=1}^{n}m_{i}\left(f,P\right)\cdot\left(x_{i}-x_{i-1}\right)
\end{align*}\]</span>ל-<span class="inset Formula">\(U\left(f,P\right)\)</span> נקרא <u class="bar under">סכום דארבו העליון</u> של <span class="inset Formula">\(f\)</span> עבור <span class="inset Formula">\(P\)</span> ול-<span class="inset Formula">\(L\left(f,P\right)\)</span> נקרא <u class="bar under">סכום דארבו התחתון</u> של <span class="inset Formula">\(f\)</span> עבור <span class="inset Formula">\(P\)</span>.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Lemma"><span class="label">למה 3.6. </span>מתקיים <span class="inset Formula">\(U\left(f,P\right)=\sup\sigma\left(f,P\right)\)</span> וגם <span class="inset Formula">\(L\left(f,P\right)=\inf\sigma\left(f,P\right)\)</span>.</div>
        <div class="layout Definition"><span class="label">הגדרה 3.7. </span><b class="series bold">אינטגרל עליון ואינטגרל תחתון</b><br class="inset Newline newline"/>לכל <span class="inset Formula">\(f\in B\left[a,b\right]\)</span> נגדיר:<span class="inset Formula">\[\begin{align*}
\overline{I}\left(f\right) &amp; :=\inf\mathcal{U}\left(f\right)\\
\underline{I}\left(f\right) &amp; :=\sup\mathcal{L}\left(f\right)
\end{align*}\]</span>ל-<span class="inset Formula">\(\overline{I}\left(f\right)\)</span> נקרא <u class="bar under">האינטגרל העליון</u> של <span class="inset Formula">\(f\)</span> ול-<span class="inset Formula">\(\underline{I}\left(f\right)\)</span><u class="bar under">האינטגרל התחתון</u> של <span class="inset Formula">\(f\)</span> (בקטע <span class="inset Formula">\(\left[a,b\right]\)</span>).</div>
        <div class="layout Definition"><span class="label">הגדרה 3.8. </span><b class="series bold">אינטגרביליות לפי דארבו</b><br class="inset Newline newline"/>נאמר ש-<span class="inset Formula">\(f\)</span><u class="bar under">אינטגרבילית לפי דארבו</u> על הקטע <span class="inset Formula">\(\left[a,b\right]\)</span> אם מתקיים <span class="inset Formula">\(\overline{I}\left(f\right)=\underline{I}\left(f\right)\)</span>, כלומר אם האינטגרל העליון שלה בקטע זה שווה לאינטגרל התחתון בקטע.</div>
        <div class="layout Standard">\(\:\)</div>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_3.2"><span class="label">3.2 </span>אינטגרביליות לפי רימן</h3>
        <div class="layout Theorem"><span class="label">משפט 3.9. </span><b class="series bold"><i class="shape italic">תנאי קושי לאינטגרביליות רימן</i></b><br class="inset Newline newline"/>יהיו <span class="inset Formula">\(a,b\in\MKreal\)</span> כך ש-<span class="inset Formula">\(a&lt;b\)</span> ותהא <span class="inset Formula">\(f:\left[a,b\right]\rightarrow\MKreal\)</span>, תנאי הכרחי ומספיק לכך ש-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן על <span class="inset Formula">\(\left[a,b\right]\)</span> הוא שלכל <span class="inset Formula">\(0&lt;\varepsilon\)</span> קיימת <span class="inset Formula">\(0&lt;\delta\in\MKreal\)</span> כך שלכל שני סכומי רימן <span class="inset Formula">\(S\)</span> ו-<span class="inset Formula">\(S'\)</span> של <span class="inset Formula">\(f\)</span> עבור חלוקות <span class="inset Formula">\(P\)</span> ו-<span class="inset Formula">\(P'\)</span> (בהתאמה) המקיימות <span class="inset Formula">\(\lambda\left(P\right),\lambda\left(P'\right)&lt;\delta\)</span> מתקיים <span class="inset Formula">\(\left|S-S'\right|&lt;\varepsilon\)</span>.</div>
        <div class="layout Proof"><span class="label">הוכחה. </span>זה לא תנאי קושי האחרון שנפגוש בקורס זה, כמעט לכל גבול קיים תנאי קושי מתאים ולכן בשלב כלשהו (לקראת סוף הקורס) נמאס לי להוכיח את אותו הדבר בכל פעם מחדש וכתבתי את הקובץ "<a href="https://drive.google.com/file/d/1U4EIUhknFXcQ89SEEHx8crvH2xU2gli9/view?usp=drive_link" class="inset CommandInset href">גבול לקיום קושי תנאי</a>" כדי לשים לדבר סוף: משה רוזנשטיין ואני הגדרנו הגדרת גבול כללית ותנאי קושי כללי והראנו שהם שקולים זה לזה; לפיכך מכאן והלאה לא אטרח להוכיח את תנאי קושי השונים שבהם ניתקל.</div>
        <div class="layout Theorem"><span class="label">משפט 3.10. </span>יהיו <span class="inset Formula">\(a,b\in\MKreal\)</span> כך ש-<span class="inset Formula">\(a&lt;b\)</span> ותהא <span class="inset Formula">\(f:\left[a,b\right]\rightarrow\MKreal\)</span>, אם <span class="inset Formula">\(f\)</span> אינטגרבילית רימן על <span class="inset Formula">\(\left[a,b\right]\)</span> אז <span class="inset Formula">\(f\)</span> חסומה על <span class="inset Formula">\(\left[a,b\right]\)</span>.</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> מבחינה אינטואיטיבית ברור למה המשפט נכון: אם <span class="inset Formula">\(f\)</span> לא הייתה חסומה על <span class="inset Formula">\(\left[a,b\right]\)</span> זה היה אומר שלא משנה כמה נקטין את גדלי המלבנים תמיד ימצא אחד מהם שיכול לחתוך את גרף הפונקציה בכל נקודה שהיא (גדולה ככל שנרצה ו/או קטנה ככל שנרצה, תלוי אם הפונקציה אינה חסומה מלעיל ו/או מלרע) ובכך להביא לסכומי רימן גדולים ו/או קטנים ככל שנרצה; כלומר לכל חלוקה, לא משנה מהו פרמטר החלוקה, ניתן יהיה למצוא שני סכומי רימן הרחוקים זה מזה כמה שנרצה. הוכחת המשפט מפרמלת בדיוק את האמירה הזו ע"י תנאי קושי.</dd>
          </div>
        </dl>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_3.3"><span class="label">3.3 </span>אינטגרביליות לפי דארבו</h3>
        <div class="layout Standard">יהיו <span class="inset Formula">\(a,b\in\MKreal\)</span> כך ש-<span class="inset Formula">\(a&lt;b\)</span>.</div>
        <div class="layout Standard">תהיינה <span class="inset Formula">\(f\in B\left[a,b\right]\)</span> ו-<span class="inset Formula">\(P:=\left\{ x_{0},x_{1},\ldots,x_{n}\right\} \)</span> חלוקה של <span class="inset Formula">\(\left[a,b\right]\)</span>.</div>
        <div class="layout Lemma"><span class="label">למה 3.11. </span>תהא <span class="inset Formula">\(P'\)</span> חלוקה של <span class="inset Formula">\(\left[a,b\right]\)</span> המתקבלת מ-<span class="inset Formula">\(P\)</span> ע"י הוספת נקודות (כלומר <span class="inset Formula">\(P\subseteq P'\)</span>), מתקיים:<span class="inset Formula">\[
L\left(f,P\right)\leq L\left(f,P'\right)\leq U\left(f,P'\right)\leq U\left(f,P\right)
\]</span></div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Lemma"><span class="label">למה 3.12. </span>תהא <span class="inset Formula">\(P'\)</span> חלוקה של <span class="inset Formula">\(\left[a,b\right]\)</span> המתקבלת מ-<span class="inset Formula">\(P\)</span> ע"י הוספת <span class="inset Formula">\(k\)</span> נקודות (כלומר <span class="inset Formula">\(P\subseteq P'\)</span> ו-<span class="inset Formula">\(\left|P'\right|-\left|P\right|=k\in\MKnatural_{0}\)</span>), מתקיים:<span class="inset Formula">\[
L\left(f,P'\right)-k\cdot\lambda\left(P\right)\cdot\varOmega\leq L\left(f,P\right)\leq U\left(f,P\right)\leq U\left(f,P'\right)+k\cdot\lambda\left(P\right)\cdot\varOmega
\]</span>כאשר<span class="inset Formula">\[\begin{align*}
\varOmega &amp; :=\sup\left\{ f\left(x\right):x\in\left[a,b\right]\right\} -\inf\left\{ f\left(x\right):x\in\left[a,b\right]\right\} \\
 &amp; =\sup\left\{ f\left(x_{1}\right)-f\left(x_{2}\right)\mid x_{1},x_{2}\in\left[a,b\right]\right\} 
\end{align*}\]</span></div>
        <div class="layout Corollary"><span class="label">מסקנה 3.13. </span>מתקיים <span class="inset Formula">\(\underline{I}\left(f\right)\leq\overline{I}\left(f\right)\)</span>.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Theorem"><span class="label">משפט 3.14. </span><b class="series bold"><i class="shape italic">משפט דארבו</i></b><span class="inset Foot"><span class="label">27</span><span class="layout Plain Layout">ערך בוויקיפדיה: <a href="https://he.wikipedia.org/wiki/%D7%96%27%D7%90%D7%9F_%D7%92%D7%A1%D7%98%D7%95%D7%9F_%D7%93%D7%90%D7%A8%D7%91%D7%95" class="inset CommandInset href">דארבו גסטון ז'אן</a>.</span></span><br class="inset Newline newline"/>מתקיים:<span class="inset Formula">\[
\overline{I}\left(f\right)=\lim_{\lambda\left(P\right)\rightarrow0}U\left(f,P\right),\ \underline{I}\left(f\right)=\lim_{\lambda\left(P\right)\rightarrow0}L\left(f,P\right)
\]</span>כלומר לכל <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span> קיימת <span class="inset Formula">\(0&lt;\delta\in\MKreal\)</span> כך שלכל חלוקה <span class="inset Formula">\(P\)</span> של <span class="inset Formula">\(\left[a,b\right]\)</span> המקיימת <span class="inset Formula">\(\lambda\left(P\right)&lt;\delta\)</span> מתקיים <span class="inset Formula">\(\left|U\left(f,P\right)-\overline{I}\right|&lt;\varepsilon\)</span>,<br class="inset Newline newline"/>ולכל <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span> קיימת <span class="inset Formula">\(0&lt;\delta\in\MKreal\)</span> כך שלכל חלוקה <span class="inset Formula">\(P\)</span> של <span class="inset Formula">\(\left[a,b\right]\)</span> המקיימת <span class="inset Formula">\(\lambda\left(P\right)&lt;\delta\)</span> מתקיים <span class="inset Formula">\(\left|L\left(f,P\right)-\underline{I}\right|&lt;\varepsilon\)</span>.</div>
        <div class="layout Proof"><span class="label">הוכחה. </span>יהי <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span>, מהגדרת <span class="inset Formula">\(\underline{I}\)</span> קיימת חלוקה <span class="inset Formula">\(P'\)</span> של <span class="inset Formula">\(\left[a,b\right]\)</span> המקיימת <span class="inset Formula">\(\underline{I}-\frac{\varepsilon}{2}&lt;L\left(P'\right)\leq\underline{I}\)</span>, נגדיר <span class="inset Formula">\(\delta:=\frac{\varepsilon}{2m'\varOmega}\)</span> כאשר <span class="inset Formula">\(m'\)</span> הוא מס' נקודות החלוקה ב-<span class="inset Formula">\(P'\)</span> ו-<span class="inset Formula">\(\varOmega\)</span> מוגדרת כדלעיל<span class="inset Foot"><span class="label">28</span><span class="layout Plain Layout">נשים לב שאם <span class="inset Formula">\(\varOmega=0\)</span> אז <span class="inset Formula">\(f\)</span> היא פונקציה קבועה ואז הטענה טריוויאלית.</span></span>.<br class="inset Newline newline"/>תהא <span class="inset Formula">\(P''\)</span> חלוקה של <span class="inset Formula">\(\left[a,b\right]\)</span> המקיימת <span class="inset Formula">\(\lambda\left(P''\right)&lt;\delta\)</span>, נגדיר <span class="inset Formula">\(P^{*}:=P'\cup P''\)</span> ונסמן ב-<span class="inset Formula">\(k\)</span> את ההפרש בין מס' הנקודות של <span class="inset Formula">\(P^{*}\)</span> לאלו של <span class="inset Formula">\(P''\)</span> (כלומר <span class="inset Formula">\(k:=\left|P^{*}\right|-\left|P''\right|\leq\left|P'\right|=m'\)</span>), מהלמות הנ"ל נובע שמתקיים:<span class="inset Formula">\[\begin{align*}
\underline{I} &amp; \geq L\left(P''\right)\\
 &amp; \geq L\left(P^{*}\right)-k\cdot\lambda\left(P''\right)\cdot\varOmega\\
 &amp; \geq L\left(P'\right)-k\cdot\lambda\left(P''\right)\cdot\varOmega\\
 &amp; \geq L\left(P'\right)-m'\cdot\lambda\left(P''\right)\cdot\varOmega\\
 &amp; &gt;L\left(P'\right)-m'\cdot\delta\cdot\varOmega\\
 &amp; =L\left(P'\right)-m'\cdot\frac{\varepsilon}{2m'\varOmega}\cdot\varOmega\\
 &amp; &gt;L\left(P'\right)-\frac{\varepsilon}{2}\\
 &amp; &gt;\underline{I}-\varepsilon
\end{align*}\]</span><span class="inset Formula">\[
\Rightarrow\varepsilon&gt;\underline{I}-L\left(P''\right)=\left|\underline{I}-L\left(P''\right)\right|
\]</span>ההוכחה עבור <span class="inset Formula">\(\overline{I}\)</span> זהה לחלוטין (כמובן שיש להפוך את כיווני האי-שוויונות).</div>
        <div class="layout Theorem"><span class="label">משפט 3.15. </span><span id="theorem 2.7" class="inset CommandInset label"/><span class="inset Formula">\(f\)</span> אינטגרבילית לפי רימן על <span class="inset Formula">\(\left[a,b\right]\)</span> אם"ם <span class="inset Formula">\(f\)</span> אינטגרבילית גם לפי דארבו על קטע זה, כלומר אם"ם <span class="inset Formula">\(\overline{I}\left(f\right)=\underline{I}\left(f\right)\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Theorem"><span class="label">משפט 3.16. </span><b class="series bold"><i class="shape italic">תנאי רימן לאינטגרביליות</i></b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(f\in B\left[a,b\right]\)</span>, תנאי הכרחי ומספיק לכך ש-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן על <span class="inset Formula">\(\left[a,b\right]\)</span> הוא שמתקיים<span class="inset Foot"><span class="label">29</span><span class="layout Plain Layout">קיום הגבול הוא באותו מובן שראינו לעיל.</span></span>:<span class="inset Formula">\[
\lim_{\lambda\left(P\right)\rightarrow0}\sum_{i=1}^{n}W_{i}\left(f,P\right)\cdot\left(x_{i}-x_{i-1}\right)=0
\]</span>כאשר לכל חלוקה <span class="inset Formula">\(P:=\left\{ x_{0},x_{1},\ldots,x_{n}\right\} \)</span> של <span class="inset Formula">\(\left[a,b\right]\)</span> נסמן:<span class="inset Formula">\[\begin{align*}
W_{i}\left(f,P\right) &amp; :=M_{i}\left(f,P\right)-m_{i}\left(f,P\right)\\
 &amp; =\sup\left\{ f\left(t\right):t\in\left[x_{i-1},x_{i}\right]\right\} -\inf\left\{ f\left(t\right):t\in\left[x_{i-1},x_{i}\right]\right\} \\
 &amp; =\sup\left\{ f\left(t_{1}\right)-f\left(t_{2}\right):t_{1},t_{2}\in\left[x_{i-1},x_{i}\right]\right\} 
\end{align*}\]</span>ונקרא ל-<span class="inset Formula">\(W_{i}\left(f,P\right)\)</span><u class="bar under">התנודה</u> של <span class="inset Formula">\(f\)</span><u class="bar under">בקטע</u><span class="inset Formula">\(\left[x_{i-1},x_{i}\right]\)</span>.</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> יש לשים לב לכך ש-<span class="inset Formula">\(n\)</span> אינו מספר קבוע, למען האמת השאיפה של <span class="inset Formula">\(\lambda\left(P\right)\)</span> ל-<span class="inset Formula">\(0\)</span> גוררת את השאיפה של <span class="inset Formula">\(n\)</span> לאינסוף (אך ההפך אינו נכון).</dd>
          </div>
        </dl>
        <div class="layout Proof"><span class="label">הוכחה. </span>המשפט נובע ישירות ממשפט דארבו וממשפט <a href="#theorem 2.7" class="inset CommandInset ref">2.7</a>.</div>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_3.4"><span class="label">3.4 </span>תכונות האינטגרל המסוים</h3>
        <div class="layout Theorem"><span class="label">משפט 3.17. </span>תהא <span class="inset Formula">\(f:\left[a,b\right]\rightarrow\MKreal\)</span>, אם <span class="inset Formula">\(f\)</span> רציפה אז היא אינטגרבילית רימן על <span class="inset Formula">\(\left[a,b\right]\)</span>.</div>
        <div class="layout Proof"><span class="label">הוכחה. </span>נניח ש-<span class="inset Formula">\(f\)</span> רציפה על <span class="inset Formula">\(\left[a,b\right]\)</span>, מכאן שהיא חסומה עליו וכן רציפה עליו במידה שווה.<br class="inset Newline newline"/>יהי <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span>, מרציפות במ"ש של <span class="inset Formula">\(f\)</span> נובע שקיימת <span class="inset Formula">\(0&lt;\delta\in\MKreal\)</span> כך שלכל <span class="inset Formula">\(x_{1},x_{2}\in\left[a,b\right]\)</span> המקיימים <span class="inset Formula">\(\left|x_{1}-x_{2}\right|&lt;\delta\)</span> מתקיים <span class="inset Formula">\(\left|f\left(x_{1}\right)-f\left(x_{2}\right)\right|&lt;\frac{\varepsilon}{b-a}\)</span>.<br class="inset Newline newline"/>מכאן שלכל חלוקה <span class="inset Formula">\(P:=\left\{ x_{0},x_{1},\ldots,x_{n}\right\} \)</span> המקיימת <span class="inset Formula">\(\lambda\left(P\right)&lt;\delta\)</span> מתקיים:<span class="inset Formula">\[\begin{align*}
\sum_{i=1}^{n}W_{i}\left(f,P\right)\cdot\left(x_{i}-x_{i-1}\right) &amp; &lt;\sum_{i=1}^{n}\frac{\varepsilon}{b-a}\cdot\left(x_{i}-x_{i-1}\right)\\
 &amp; =\frac{\varepsilon}{b-a}\cdot\sum_{i=1}^{n}\left(x_{i}-x_{i-1}\right)\\
 &amp; =\frac{\varepsilon}{b-a}\cdot\left(b-a\right)=\varepsilon
\end{align*}\]</span>ולכן מתנאי רימן לאינטגרביליות נובע ש-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן על <span class="inset Formula">\(\left[a,b\right]\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 3.18. </span>תהא <span class="inset Formula">\(f:\left[a,b\right]\rightarrow\MKreal\)</span>, אם <span class="inset Formula">\(f\)</span> מונוטונית אז היא אינטגרבילית רימן על <span class="inset Formula">\(\left[a,b\right]\)</span>.</div>
        <div class="layout Proof"><span class="label">הוכחה. </span>נניח ש-<span class="inset Formula">\(f\)</span> מונוטונית, אם <span class="inset Formula">\(f\)</span> קבועה אז המשפט טריוויאלי, לכן נניח בהג"כ ש-<span class="inset Formula">\(f\)</span> עולה ממש.<br class="inset Newline newline"/>יהי <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span> ונגדיר <span class="inset Formula">\(\delta:=\frac{\varepsilon}{f\left(b\right)-f\left(a\right)}\)</span>, מכאן שלכל חלוקה <span class="inset Formula">\(P:=\left\{ x_{0},x_{1},\ldots,x_{n}\right\} \)</span> של <span class="inset Formula">\(\left[a,b\right]\)</span> המקיימת <span class="inset Formula">\(\lambda\left(P\right)&lt;\delta\)</span> מתקיים:<span class="inset Formula">\[\begin{align*}
\sum_{i=1}^{n}W_{i}\left(f,P\right)\cdot\left(x_{i}-x_{i-1}\right) &amp; =\sum_{i=1}^{n}\left(f\left(x_{i}\right)-f\left(x_{i-1}\right)\right)\cdot\left(x_{i}-x_{i-1}\right)\\
 &amp; &lt;\sum_{i=1}^{n}\left(f\left(x_{i}\right)-f\left(x_{i-1}\right)\right)\cdot\delta\\
 &amp; =\frac{\varepsilon}{f\left(b\right)-f\left(a\right)}\cdot\sum_{i=1}^{n}\left(f\left(x_{i}\right)-f\left(x_{i-1}\right)\right)\\
 &amp; =\frac{\varepsilon}{f\left(b\right)-f\left(a\right)}\cdot\left(f\left(b\right)-f\left(a\right)\right)=\varepsilon
\end{align*}\]</span>ולכן מתנאי רימן לאינטגרביליות נובע ש-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן על <span class="inset Formula">\(\left[a,b\right]\)</span>.</div>
        <div class="layout Claim"><span class="label">טענה 3.19. </span>תהיינה <span class="inset Formula">\(f,g\in R\left[a,b\right]\)</span> ו-<span class="inset Formula">\(c\in\MKreal\)</span>, מתקיימים הפסוקים הבאים:<ol>
            <li class="layout Enumerate">אם <span class="inset Formula">\(f\)</span> אי-שלילית ב-<span class="inset Formula">\(\left[a,b\right]\)</span> אז <span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\geq0\)</span>.</li>
            <li class="layout Enumerate">אם לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> מתקיים <span class="inset Formula">\(f\left(x\right)\geq g\left(x\right)\)</span> אז <span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\geq\intop_{a}^{b}g\left(x\right)dx\)</span>.</li>
          </ol>
        </div>
        <div class="layout Theorem"><span class="label">משפט 3.20. </span><b class="series bold">ליניאריות האינטגרל המסוים</b><br class="inset Newline newline"/>תהיינה <span class="inset Formula">\(f,g\in R\left[a,b\right]\)</span> ו-<span class="inset Formula">\(c\in\MKreal\)</span>, מתקיימים הפסוקים הבאים:<ol>
            <li class="layout Enumerate"><span class="inset Formula">\(c\cdot f\in R\left[a,b\right]\)</span> ומתקיים <span class="inset Formula">\(\intop_{a}^{b}\left(c\cdot f\right)\left(x\right)dx=c\cdot\intop_{a}^{b}f\left(x\right)dx\)</span>.</li>
            <li class="layout Enumerate"><span class="inset Formula">\(f\pm g\in R\left[a,b\right]\)</span> ומתקיים <span class="inset Formula">\(\intop_{a}^{b}\left(f\pm g\right)\left(x\right)dx=\intop_{a}^{b}f\left(x\right)dx\pm\intop_{a}^{b}g\left(x\right)dx\)</span>.</li>
          </ol>
        </div>
        <dl>
          <div class="layout Labeling item">

            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> מהמשפט האחרון נובע ש-<span class="inset Formula">\(R\left[a,b\right]\)</span> מהווה מרחב וקטורי מעל <span class="inset Formula">\(\MKreal\)</span> והאינטגרציה (של רימן) היא פונקציונל ליניארי<span class="inset Foot"><span class="label">30</span><span class="layout Plain Layout">פונקציונל ליניארי על מ"ו הוא העתקה ליניארית מהמרחב לשדה, במקרה זה מ-<span class="inset Formula">\(R\left[a,b\right]\)</span> ל-<span class="inset Formula">\(\MKreal\)</span>.</span></span> על <span class="inset Formula">\(R\left[a,b\right]\)</span>.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> למעשה הטענה הזו לא כל כך מעניינת מנקודת המבט של הקורס שלנו, היא מובאת כאן מפני שבלינארית<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="numeric on">2</span><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span>אנחנו נשתמש בה כדי להראות ש-<span class="inset Formula">\(C\left[a,b\right]\)</span> - מרחב הפונקציות הרציפות על <span class="inset Formula">\(\left[a,b\right]\)</span> (שהוא תמ"ו של <span class="inset Formula">\(R\left[a,b\right]\)</span>) הוא מרחב מכפלה פנימית מעל <span class="inset Formula">\(\MKreal\)</span> כאשר המכפלה הפנימית מוגדרת ע"י <span class="inset Formula">\(\left\langle f\mid g\right\rangle :=\intop_{a}^{b}f\left(x\right)\cdot g\left(x\right)dx\)</span> (לכל <span class="inset Formula">\(f,g\in C\left[a,b\right]\)</span>).</dd>
