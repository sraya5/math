<div class="layout Standard"><span class="inset CommandInset include" data-filename="C:\Users\sraya\AppData\Roaming\LyX2.4\macros\MKmacros.lyx">
        <div class="include body">
          <div class="layout Standard"><span class="inset Note Note"><span class="layout Plain Layout">\(\:\)</span><span class="layout Plain Layout"><b class="series bold"><span class="size larger">עקרונות מנחים לכתיבת פקודות<span class="family roman"><span class="shape up"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span><span class="lang english">Macros</span><span class="lang hebrew"> </span></span></b></span><span class="layout Plain Layout"><span class="inset CommandInset line">LatexCommand ruleoffset "0.5ex"width "100col%"height "1pt"</span></span><ol>
                <li class="layout Enumerate">כל פקודה תתחיל ב-<b class="series bold"><span class="color red"><span class="lang english">MK<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"><span class="lang hebrew"> </span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></b>גדולות ע<span class="inset Quotes erd"/>ש מיכאל קלי (<b class="series bold"><span class="color red"><span class="lang english">M</span></span></b>ichael <b class="series bold"><span class="color red">K</span></b>ali<span class="lang hebrew">), וזאת משתי סיבות:</span><ol>
                    <li class="layout Enumerate">כדי שבטבלת הקיצורים שבתוך \SpecialChar LyX תופענה כל הפקודות זו לצד זו.</li>
                    <li class="layout Enumerate">הבחירה דווקא באותיות גדולות נועדה לוודא שהפקודות אינן מתנגשות עם פקודות \SpecialChar LaTeX מקוריות.</li>
                  </ol>

    <section class="layout Section">
      <h2 class="layout Section" id="Section_1"><span class="label">1 </span>על שטחים ואינטגרלים - הקדמה</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_1.1"><span class="label">1.1 </span>מהו שטח?</h3>
        <div class="layout Standard">מה עובר לכם בראש (מבחינה אינטואיטיבית) כשאנחנו מדברים על "שטח"?</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> לפני שאוכל להמשיך אצטרך להסביר למה אני מתכוון שאני מדבר על "הזחה"<span class="inset Foot"><span class="label">1</span><span class="layout Plain Layout">לא מצאתי שום מקור שמדבר על "הזחה" באופן דומה, קרוב לוודאי שקראתי ספר יחיד שדיבר בשפה זו או שהמצאתי את המושג בעצמי.</span></span>, ולשם כך אתן כמה דוגמאות:<ol>
                <li class="layout Enumerate">ישר הוא <b class="series bold">הזחה</b> של נקודה בשיפוע קבוע</li>
                <li class="layout Enumerate">מלבן הוא <b class="series bold">הזחה</b> של קטע אחד לאורך קטע אחר המאונך לו</li>
                <li class="layout Enumerate">מקבילית היא <b class="series bold">הזחה</b> של ישר אחד לאורך קטע אחר ללא תלות בזווית שביניהם ובלבד שלא יהיו מקבילים</li>
                <li class="layout Enumerate">עיגול הוא <b class="series bold">הזחה</b> של "מחוג" באורך הרדיוס של העיגול כשאחד מקצותיו נותר קבוע במקומו והאחר מסתובב סביבו סיבוב שלם</li>
                <li class="layout Enumerate">תיבה היא <b class="series bold">הזחה</b> של מלבן לאורך קטע המאונך למישורים שבהם עובר המלבן בתהליך ההזחה</li>
                <li class="layout Enumerate">פירמידה היא <b class="series bold">הזחה</b> של מצולע לאורך קטע המאונך לו כאשר המצולע קטן ביחס ישר למרחק שנשאר עד לסיום ההזחה</li>
              </ol>
              <div class="layout Standard">כלומר <b class="series bold">הזחה</b> של צורה (קבוצת נקודות כלשהי) במרחב לאורך עקומה כלשהי היא קבוצת כל הנקודות שהצורה "עוברת" בהן שמזיזים אותה לאורך העקומה.</div>
            </dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> לא מדובר במושג מתמטי מוגדר היטב (למרות שאולי ניתן לפרמל אותו), וכפי שציינתי בהערה לא מצאתי אף אחד אחר שמדבר על הזחה באופן דומה.</dd>
          </div>
        </dl>
        <div class="layout Standard">כשאנחנו מדברים על "שטח" עוברת אצלי מחשבה על מין "סכימה רציפה" של כל הנקודות שבתוך היקף הצורה הנתונה<span class="inset Foot"><span class="label">2</span><span class="layout Plain Layout">וכפי שאתם יכולים לנחש מהדוגמה הראשונה שנתתי, יש לי מחשבה דומה גם כשאנחנו מדברים על "אורך".</span></span>, כמובן שאי אפשר לבצע זאת באמת ובכל זאת יש לזה משמעות:<br class="inset Newline newline"/>זוכרים שביסודי, כשלמדנו על פעולת הכפל, קראנו את <span class="inset Formula">\(7\cdot4\)</span> כ-<span class="inset Formula">\(7\)</span><b class="series bold">פעמים</b><span class="inset Formula">\(4\)</span>? האמירה הזו בעצם מרמזת על כך שאנו חושבים על פעולת הכפל כקיצור לכתיבה של סכום<span class="inset Foot"><span class="label">3</span><span class="layout Plain Layout">ואכן, עבור כפל של שני מספרים שלפחות אחד מהם שלם ניתן להגדיר את הכפל כחיבור כך וכך פעמים (בדומה לצורה שבה הגדרנו את הקשר בין חזקה טבעית לכפל), אולם כבר עבור מכפלה של שני רציונליים א"א לעשות זאת ולכן נזקקו המתמטיקאים להגדיר שתי פעולות על השדה ולא אחת בלבד.</span></span>,<br class="inset Newline newline"/>כשאני רוצה לחשב את שטחו של מלבן שאורכי צלעותיו הם <span class="inset Formula">\(4\)</span> ו-<span class="inset Formula">\(7\)</span> אני בעצם חושב על קטע באורך <span class="inset Formula">\(4\)</span> שאותו אני <b class="series bold">מזיח</b> לאורך קטע באורך <span class="inset Formula">\(7\)</span>;<br class="inset Newline newline"/>כלומר אני מבצע "סכימה רציפה" של קטע באורך <span class="inset Formula">\(4\)</span> שבע "פעמים", כאשר כאן המילה "פעמים" אינה מתייחסת לסכום עם שישה סימני "<span class="inset Formula">\(+\)</span>" אלא למה שכיניתי "סכימה רציפה" - אני "סוכם" את כל הקטעים באורך <span class="inset Formula">\(4\)</span> שמופיעים בתוך המלבן וכאלה ישנם "שבעה". זו הסיבה (האינטואיטיבית) לכך שברור לכולנו ששטח מלבן הוא מכפלת אורכי צלעותיו.<br class="inset Newline newline"/>בעצם ניתן לחשוב על "הסכימה הרציפה" בצורה הבאה: אני "שם" את המלבן במערכת צירים ומעביר ישר על פני המישור מקצה אחד של המלבן עד לקצהו השני ובכל נקודה אני "שומר" את כמות הנקודות בישר שנמצאות בתוך המלבן ו"מוסיף" את ה"מספר" הזה למה ש"סכמתי" עד כה, את האינטואיציה הזו ניתן להכליל עבור כל צורה שהיא (שימו אותה במערכת צירים והעבירו ישר...) ובהמשך אנחנו נראה שההגדרה של אינטגרביליות לפי רימן מפרמלת בדיוק את זה.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_1.2"><span class="label">1.2 </span>איך מחשבים שטח של צורה נתונה?</h3>
        <div class="layout Standard">אנחנו יודעים לחשב שטח של מלבן בצורה ישירה ע"י הכפלת אורכי שתיים מצלעותיו הניצבות זו לזו אך מה בדבר צורות אחרות?<br class="inset Newline newline"/>ע"פ עיקרון הסימטריה ניתן לחשב את השטח של משולש ישר זווית: ניתן להציג שני עותקים של כל משולש ישר זווית ע"י סרטוט מלבן יחיד<span class="inset Foot"><span class="label">4</span><span class="layout Plain Layout">לכל משולש ישר זווית קיים מלבן יחיד כזה.</span></span> ואחד מאלכסוניו, לכן השטח של כל משולש ישר זווית הוא חצי משטחו של המלבן המתאים.<br class="inset Newline newline"/>ניתן להכליל את השיטה הזו גם עבור משולש חד זוויות (מורידים אנך בתוך המשולש...), ואפילו עבור משולש קהה זווית (קצת יותר מסובך ואין זה מענייננו כעת), ומכאן לכל מצולע מפני שניתן לחלק כל מצולע למשולשים.<br class="inset Newline newline"/>עד כאן היה לנו מזל אבל לא לכל צורה ניתן למצוא קשר ישיר למלבן או למשולש, מה נעשה במקרים כאלה?</div>
        <div class="layout Standard">כאן בא לעזרתנו מושג הגבול, נניח שאנו רוצים לחשב שטח של עיגול, ודאי ששטח העיגול קטן משטח הריבוע שחוסם אותו וגדול משטח הריבוע הנחסם על ידו; ניתן להוסיף לריבוע החסום עוד ועוד מלבנים קטנים יותר בתוך שטח העיגול או לחסר מהריבוע החוסם את העיגול עוד ועוד מלבנים קטנים יותר מחוץ לשטח העיגול<span class="inset Foot"><span class="label">5</span><span class="layout Plain Layout">ניתן כמובן לשלב בין שתי השיטות כך שיהיו שטחים שאינם חלק מהעיגול ויכוסו ע"י מלבנים ויהיו במקביל חלקים מהעיגול שלא יכוסו ע"י מלבנים.</span></span>. הנקודה היא שככל שגדלי המלבנים הללו קטנים יותר<span class="inset Foot"><span class="label">6</span><span class="layout Plain Layout">ובהנחה שכאשר אנו מוסיפים מלבנים איננו יכולים להוסיף מלבן שכל שטחו אינו בתוך העיגול, ובהתאמה, כאשר אנו מחסרים מלבנים איננו יכולים לחסר מלבן שכל שטחו בתוך העיגול.</span></span> אנו נתקרב יותר ויותר אל מה שמבחינה אינטואיטיבית הוא "שטח העיגול", לכן ניתן להגדיר את השטח של העיגול כ<b class="series bold">גבול</b> של סכום שטחי המלבנים כאשר גודל כל אחד מהם בנפרד שואף לאפס.</div>
        <div class="layout Standard">\(\:\)</div>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_1.3"><span class="label">1.3 </span>מה הקשר בין שטח לאינטגרלים?</h3>
        <div class="layout Standard">בואו נניח שאני נוסע בקו ישר מנקודה <span class="inset Formula">\(x_{0}\)</span> במהירות קבועה <span class="inset Formula">\(v\)</span>, איפה אהיה בעוד שעה? כולנו מכירים את הנוסחה מהתיכון "מהירות כפול זמן שווה דרך"<span class="inset Foot"><span class="label">7</span><span class="layout Plain Layout">למעשה ההגדרה הבסיסית ביותר של מהירות היא "דרך חלקי זמן".</span></span>, מכאן שלכל <span class="inset Formula">\(t\in\left[0,\infty\right)\)</span> המיקום שלי בזמן <span class="inset Formula">\(t\)</span> יהיה <span class="inset Formula">\(X\left(t\right)=x_{0}+v\cdot t\)</span> לכל <span class="inset Formula">\(t\in\left[0,\infty\right)\)</span>.<br class="inset Newline newline"/>כעת נגדיר את הפונקציה <span class="inset Formula">\(V\)</span> להיות הפונקציה של המהירות כתלות בזמן, במקרה זה מתקיים <span class="inset Formula">\(V\left(t\right)=v\)</span> לכל <span class="inset Formula">\(t\in\left[0,\infty\right)\)</span>; ניזכר שהמהירות היא הנגזרת של המיקום כתלות בזמן ואכן לכל <span class="inset Formula">\(t\in\left[0,\infty\right)\)</span> מתקיים <span class="inset Formula">\(X'\left(t\right)=v=V\left(t\right)\)</span> ומכאן ש-<span class="inset Formula">\(\intop V\left(t\right)dt=X\left(t\right)+C\)</span>.<br class="inset Newline newline"/>נסמן ב-<span class="inset Formula">\(V_{S}\left(t\right)\)</span> את השטח מתחת לגרף הפונקציה <span class="inset Formula">\(V\)</span> על הקטע <span class="inset Formula">\(\left[0,t\right]\)</span> וראו איזה פלא: מתקיים <span class="inset Formula">\(V_{S}\left(t\right)=v\cdot t=X\left(t\right)-x_{0}=\intop V\left(t\right)dt\)</span>.</div>
        <div class="layout Standard">לקחתי מקרה פשוט מדי, נכון? מה קורה אם אני נוסע בתאוצה קבועה <span class="inset Formula">\(a\)</span>? במקרה כזה נקבל שלכל <span class="inset Formula">\(t\in\left[0,\infty\right)\)</span> מתקיים <span class="inset Formula">\(V\left(t\right)=v_{0}+a\cdot t\)</span>, כאשר <span class="inset Formula">\(v_{0}\)</span> היא המהירות ההתחלתית (כאשר <span class="inset Formula">\(t=0\)</span>);<br class="inset Newline newline"/>במקרה כזה השטח מתחת לגרף של פונקציית המהירות הוא שטח המלבן שאורכו <span class="inset Formula">\(t\)</span> ורוחבו <span class="inset Formula">\(v_{0}\)</span> ועוד שטח המשולש ישר הזווית שאורך צלעותיו <span class="inset Formula">\(t\)</span> ו-<span class="inset Formula">\(a\cdot t\)</span>, א"כ השטח שמתחת לגרף הוא <span class="inset Formula">\(v_{0}\cdot t+\frac{a}{2}\cdot t^{2}\)</span>.<br class="inset Newline newline"/>מי שלמד פיזיקה בתיכון אולי ייזכר כעת שבמקרה כזה הנוסחה של המיקום היא<span class="inset Foot"><span class="label">8</span><span class="layout Plain Layout">האמת היא שכאן אני בעצם מרמה, הנוסחה הזו התקבלה ע"י אינטגרציה של <span class="inset Formula">\(V\)</span>: <span class="inset Formula">\(\intop V\left(t\right)dt=v_{0}\cdot t+\frac{a}{2}\cdot t^{2}+C\)</span>.</span></span>:<span class="inset Formula">\[
X\left(t\right)=x_{0}+v_{0}\cdot t+\frac{a}{2}\cdot t^{2}
\]</span>ואכן לכל <span class="inset Formula">\(t\in\left[0,\infty\right)\)</span> מתקיים <span class="inset Formula">\(X'\left(t\right)=v_{0}+at=V\left(t\right)\)</span> ושוב מתקיים גם <span class="inset Formula">\(V_{S}\left(t\right)=v_{0}\cdot t+\frac{1}{2}\cdot at\cdot t=X\left(t\right)-x_{0}=\intop V\left(t\right)dt\)</span>.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Standard">למה זה עובד? נשים לב שלכל פונקציה גזירה, פונקציית הנגזרת שלה עושה בדיוק את מה שתיארתי בפרק הראשון של הקדמה זו: בכל נקודה פונקציית הנגזרת "שומרת" את השינוי בערכה של הפונקציה הקדומה (כמו שהישר שהעברנו על פני הצורה הנתונה "שמר" את תוספת<span class="inset Foot"><span class="label">9</span><span class="layout Plain Layout">במקרה של חישוב שטח צורה כל השינויים הם אי-שליליים ואפילו חיוביים ממש, במקרה של פונקציה השינוי יכול להיות גם שלילי עד כדי כך שאולי אפילו נקבל "שטח שלילי".</span></span> השטח בכל נקודה), כדי לבצע "סכימה רציפה" על כל ה"מספרים" השמורים הללו כל שעלינו לעשות הוא להעביר את את הישר שלנו על פני הגרף של הנגזרת ובכל נקודה "לשמור" את ערך הנגזרת ו"להוסיף" אותו למה ש"נסכם" עד כה - זהו בדיוק השטח שבין גרף הנגזרת לציר ה-<span class="inset Formula">\(x\)</span>!</div>
        <div class="layout Standard">כמובן, כפי שראינו בחלק השני של הקדמה זו, הצורה הפורמלית לחשב את השטח הזה היא לקרב את השטח ע"י מלבנים שגובהם חותך את גרף הפונקציה ואז להשאיף את גודל הצלע השנייה ל-<span class="inset Formula">\(0\)</span> ובכך להשאיף גם את גודל המלבנים ל-<span class="inset Formula">\(0\)</span>, זוהי בדיוק ההגדרה של אינטגרל רימן.</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> לו הייתי יכול להכניס את <a href="https://commons.wikimedia.org/wiki/File:Riemann_integral_irregular.gif" class="inset CommandInset href">האנימציה הזו</a> לקובץ<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="lang english">PDF<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"><span class="lang hebrew"> </span></span></span></span></span></span></span></span></span></span></span></span></span>הייתי מוסיף אותה כאן שכן היא מסכמת את הנאמר בצורה נהדרת.</span></dd>
          </div>
        </dl>
        <div class="layout Standard">\(\:\)</div>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_1.4"><span class="label">1.4 </span>דוגמאות</h3>
        <div class="layout Example"><span class="label">דוגמה 1.1. </span>לאחר שנוכיח את הקשר בין האינטגרל הלא מסוים לבין השטח שמתחת לגרף הפונקציה נוכל לחשב את הנפח של פירמידה ששטח בסיסה הוא <span class="inset Formula">\(S\)</span> וגובהה הוא <span class="inset Formula">\(h\)</span>:<br class="inset Newline newline"/>נשים לב שלכל <span class="inset Formula">\(x\in\left[0,h\right]\)</span> שטח החתך המתאים הוא <span class="inset Formula">\(\left(\frac{x}{h}\right)^{2}\cdot S\)</span> (היקף המלבן<span class="inset Foot"><span class="label">10</span><span class="layout Plain Layout">או כל צורה אחרת של הבסיס, כולל עיגול ואז נקבל נפח של חרוט.</span></span> המהווה את החתך עולה בקצב ליניארי ולכן שטחו גדל בקצב ריבועי),<br class="inset Newline newline"/>כאשר <span class="inset Formula">\(x=h\)</span> פירושו החתך בגובה בסיס הפירמידה ו-<span class="inset Formula">\(x=0\)</span> פירושו החתך בקודקוד הפירמידה.<br class="inset Newline newline"/>נגדיר <span class="inset Formula">\(V:\left[0,h\right]\rightarrow\MKreal\)</span> ע"י <span class="inset Formula">\(V\left(x\right)=\left(\frac{x}{h}\right)^{2}\cdot S\)</span> ומכאן שנפח הפירמידה מתקבל ע"י החישוב הבא:<span class="inset Formula">\[
\intop V\left(x\right)dx=\intop\frac{x^{2}}{h^{2}}\cdot S\ dx=\frac{S}{h^{2}}\cdot\intop x^{2}\ dx=\frac{S}{h^{2}}\cdot\frac{x^{3}}{3}+C=\frac{S}{3h^{2}}\cdot x^{3}+C
\]</span><span class="inset Formula">\[
\Rightarrow V_{\Delta}=\intop_{0}^{h}V\left(x\right)dx=\frac{S}{3h^{2}}\cdot h^{3}-\frac{S}{3h^{2}}\cdot0^{3}=\frac{S\cdot h}{3}
\]</span>וקיבלנו את הנוסחה המוכרת מהתיכון.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Example"><span class="label">דוגמה 1.2. </span>בצורה דומה נוכל לחשב נפח של כדור שרדיוסו הוא <span class="inset Formula">\(r\)</span>:<br class="inset Newline newline"/>נשים לב שלכל <span class="inset Formula">\(x\in\left[-r,r\right]\)</span> שטח החתך המתאים הוא <span class="inset Formula">\(\pi\cdot\left(\sqrt{r^{2}-x^{2}}\right)^{2}\)</span><span class="inset Foot"><span class="label">11</span><span class="layout Plain Layout">הנוסחה של חצי מעגל שמרכזו בנקודה <span class="inset Formula">\(\left(0,0\right)\)</span> ורדיוסו <span class="inset Formula">\(r\)</span> היא <span class="inset Formula">\(\sqrt{r^{2}-x^{2}}\)</span>, כעת, לאחר שקיבלנו את אורך הרדיוס של החתך נעלה אותו בריבוע ונכפיל ב-<span class="inset Formula">\(\pi\)</span> כדי לקבל את שטח החתך.</span></span> נגדיר <span class="inset Formula">\(V:\left[0,r\right]\rightarrow\MKreal\)</span> ע"י <span class="inset Formula">\(V\left(x\right)=\pi\cdot\left(r^{2}-x^{2}\right)\)</span><span class="inset Foot"><span class="label">12</span><span class="layout Plain Layout">אנו מסתכלים רק על החלק שבצד החיובי כדי שלא נקבל שהוא מתאפס יחד עם השלילי, אח"כ נכפיל את התוצאה ב-<span class="inset Formula">\(2\)</span>.</span></span> ומכאן שנפח הכדור מתקבל ע"י החישוב הבא:<span class="inset Formula">\[\begin{align*}
\intop V\left(x\right)dx &amp; =\intop\pi\cdot\left(r^{2}-x^{2}\right)dx\\
 &amp; =\pi\cdot\intop r^{2}-x^{2}dx\\
 &amp; =\pi\cdot\left(r^{2}x-\frac{x^{3}}{3}\right)+C
\end{align*}\]</span><span class="inset Formula">\[\begin{align*}
\Rightarrow V_{\bigodot} &amp; =2\cdot\intop_{0}^{r}V\left(x\right)dx=2\pi\cdot\left(r^{2}\cdot r-\frac{r^{3}}{3}\right)-2\pi\cdot\left(r^{2}\cdot0-\frac{0^{3}}{3}\right)\\
 &amp; =2\pi\left(r^{3}-\frac{r^{3}}{3}\right)=2\pi\cdot\frac{2r^{3}}{3}=\frac{4\pi r^{3}}{3}
\end{align*}\]</span>וקיבלנו עוד נוסחה מדף הנוסחאות של התיכון.</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> אנחנו יודעים גם ששטח עיגול שרדיוסו הוא <span class="inset Formula">\(r\)</span> שווה ל-<span class="inset Formula">\(4\cdot\intop_{0}^{r}\sqrt{r^{2}-x^{2}}\ dx\)</span> אך מכיוון ש-<span class="inset Formula">\(\pi\)</span> הוא מספר טרנסצנדנטי לא נוכל להציג את האינטגרל בצורה טובה יותר לעת עתה, זו הסיבה לכך שהתחלתי לחשב נפחים במקום להראות חישוב "בסיסי יותר" של שטח עיגול או אליפסה.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> הנה ניסיון שלי בילדותי לקשר בין <span class="inset Formula">\(\pi\)</span> של היקף העיגול לבין <span class="inset Formula">\(\pi\)</span> של שטחו: ניקח "מחוג" באורך רדיוס העיגול ו<b class="series bold">נזיח</b> אותו כשאחד מקצותיו נותר קבוע במקומו והאחר מסתובב סביבו סיבוב שלם, א"כ כמו שחישבנו את שטח המלבן נקבל כעת ששטח העיגול הוא <span class="inset Formula">\(2\pi r\)</span> "פעמים" <span class="inset Formula">\(r\)</span>, כלומר <span class="inset Formula">\(2\pi r^{2}\)</span>! למה זה לא עובד? למה האינטואיציה של הוכחת התוספות הצליחה בעוד ששלי נכשלה?<br class="inset Newline newline"/>ובכן התשובה ברורה: למה החלטתי שאורך העקומה שלאורכה אני מזיח את המחוג היא <span class="inset Formula">\(2\pi r\)</span>? הרי בכל נקודה של המחוג אורך העקומה שונה! מכאן אנחנו למדים שהאינטואיציה עובדת באופן פשוט רק כאשר העקומה שלאורכה אנו מזיחים את הצורה המדוברת <b class="series bold">מאונכת</b> לאותה צורה<span class="inset Foot"><span class="label">13</span><span class="layout Plain Layout">מכיוון שהשטחים היחידים שאנחנו באמת יודעים לחשב הם של מלבנים ולפיהם הגדרנו את מושג השטח.</span></span>; אחרת יש לבצע תיקונים, במקרה הזה התיקון הנדרש הוא חישוב ממוצע בין אורכי העקומות השונות שמרכיבות את המסלול של כל נקודה במחוג ומכיוון שאין שום סיבה להעדיף אחת מהן על פני חברתה הממוצע הוא בדיוק <span class="inset Formula">\(\pi r\)</span> אבל זה כבר ממש לא אינטואיטיבי ולא ברור שזה עובד ולכן כדאי להישאר עם האינטואיציה של הזחה במאונך לקטע המוזח.<br class="inset Newline newline"/>אם בכל זאת רוצים לדעת כיצד לבצע תיקון ניתן להיעזר באינטואיציה הבאה: אם ניקח מקבילית שאינה מלבן ו<b class="series bold">נזיח</b> את אחת מצלעותיה לאורך אחת מהצלעות שאינה מקבילה לה נקבל את שטח המקבילית, אבל הכפלת אורכי הצלעות נותנת תשובה שגויה משום שהקטע המוזח אינו מאונך לקטע שלאורכו הוא מוזח; לכן צריך להכפיל את התשובה השגויה ב-<span class="inset Formula">\(\sin\alpha\)</span> כאשר <span class="inset Formula">\(\alpha\)</span> היא אחת הזוויות במקבילית (לא משנה איזו כי <span class="inset Formula">\(\sin\alpha=\sin\left(\pi-\alpha\right)\)</span>) כדי לקבל מהקטע השגוי את הקטע הנכון. באותה דרך ניתן לתקן כל חישוב שבו הקטע השגוי בעל זווית קבועה בינו לבין הקטע הנכון לאורך כל ההזחה, אך לא מצאתי דרך לבצע את התיקון הזה באינטואיציה שלי עם המחוג מפני שלא מצאתי את הישר הנכון.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> למיטיבי לכת: מיד לאחר ההסבר על הקשר בין היקף העיגול לשטחו התוספות עוברים להוכיח שמתקיים <span class="inset Formula">\(1.4&lt;\sqrt{2}\)</span>.</dd>
          </div>
        </dl>
        <div class="layout Example"><span class="label">דוגמה 1.3. </span>תהיתם פעם למה <span class="inset Formula">\(\pi\)</span> של היקף העיגול הוא אותו <span class="inset Formula">\(\pi\)</span> של שטחו? כלומר למה היחס בין שטח עיגול לריבוע הרדיוס שלו שווה ליחס בין היקף העיגול לקוטרו?<br class="inset Newline newline"/>לפני שנמשיך נסכים על כך ש-<span class="inset Formula">\(\pi\)</span> מוגדר להיות היחס בין היקף היקף העיגול לקוטרו, כלומר ההיקף של עיגול שרדיוסו <span class="inset Formula">\(r\)</span> הוא <span class="inset Formula">\(2\pi r\)</span>, זוהי ההגדרה של <span class="inset Formula">\(\pi\)</span> ואנחנו עדיין לא יודעים ששטחו הוא <span class="inset Formula">\(\pi r^{2}\)</span> - זה בדיוק מה שעלינו להוכיח.<br class="inset Newline newline"/>במסכת סוכה דף ח.<span class="inset Foot"><span class="label">14</span><span class="layout Plain Layout">האות חי"ת מתייחסת לדף השמיני של המסכת (כשהדף הראשון הוא השער של הספר ולא הדף הראשון של הטקסט), והנקודה הבודדת אומרת שמדובר בעמוד הראשון של הדף (לדף יש שני צדדים וכל אחד מהם נקרא "עמוד"), אם היינו רוצים לדבר על הדף השני היינו כותבים "ח:".</span></span> דנה הגמרא מה צריך להיות גודלה של סוכה עגולה כדי שתיחשב כשרה וכחלק מהדיון מזכירה ששטח עיגול הוא (בקירוב) <span class="inset Formula">\(\frac{3}{4}\)</span> משטח הריבוע החוסם אותו, ה<a href="https://he.wikipedia.org/wiki/%D7%91%D7%A2%D7%9C%D7%99_%D7%94%D7%AA%D7%95%D7%A1%D7%A4%D7%95%D7%AA" class="inset CommandInset href">תוספות</a> שם<span class="inset Foot"><span class="label">15</span><span class="layout Plain Layout">ב<a href="https://he.wikipedia.org/wiki/%D7%93%D7%99%D7%91%D7%95%D7%A8_%D7%94%D7%9E%D7%AA%D7%97%D7%99%D7%9C" class="inset CommandInset href">דיבור המתחיל</a> "כמה מרובע יתר על העיגול רביע".</span></span> מראים כיצד ניתן להגיע למסקנה זו<span class="inset Foot"><span class="label">16</span><span class="layout Plain Layout">מקור ההוכחה בספר "חיבור המשיחה והתשבורת" שכתב <a href="https://he.wikipedia.org/wiki/%D7%90%D7%91%D7%A8%D7%94%D7%9D_%D7%91%D7%A8_%D7%97%D7%99%D7%99%D7%90#%D7%94%D7%95%D7%9B%D7%97%D7%94_%D7%9C%D7%A7%D7%A9%D7%A8_%D7%91%D7%99%D7%9F_%D7%94%D7%99%D7%A7%D7%A3_%D7%9C%D7%A9%D7%98%D7%97_%D7%A2%D7%99%D7%92%D7%95%D7%9C" class="inset CommandInset href">רבי אברהם בר חייא</a> (המאות ה-<span class="numeric on">11<span class="family roman"><span class="series medium"><span class="shape up"><span class="size small"><span class="emph off"/>
                      </span></span></span></span></span><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span>וה-<span class="numeric on">12</span>) שהיה הראשון להביא את האלגברה הערבית לאירופה הנבערת של תקופתו (בתוך תחומים מדעיים נוספים) ובכך מילא תפקיד חשוב בהתפתחות המתמטיקה (מקור: ויקיפדיה העברית בערך הנ"ל).</span></span>, בעמוד הבא מופיע ציטוט<span class="inset Foot"><span class="label">17</span><span class="layout Plain Layout">הציטוט נלקח מוויקיטקסט (ראו <a href="https://he.wikisource.org/wiki/%D7%A1%D7%95%D7%9B%D7%94_%D7%97_%D7%90#%D7%AA%D7%95%D7%A1%D7%A4%D7%95%D7%AA" class="inset CommandInset href">כאן</a>), ההערות בסוגריים והפיסוק הם משלי.</span></span> סוף דבריהם<span class="inset Foot"><span class="label">18</span><span class="layout Plain Layout">לפני כן הם טורחים לבטל את הסברה שיש קשר ליניארי בין ההיקף של ריבוע לשטחו.</span></span> והסבר שלי.</div>
        <div class="layout Example"><span class="label">דוגמה 1.4. </span><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Example"><span class="label">דוגמה 1.5. </span><div width="40%" class="inset Box Frameless" style="border-color: black; background-color: none"><span class="layout Plain Layout">"...ואם באנו לכוין החשבון דמרובע יתר על העגול נוכל להוכיח בענין זה שתעשה נקודה של משהו (נקודה שאין לה שטח - עיגול קטן לאינסוף) ותקיפנה בחוטין הרבה סביב זה סיבוב אחר סיבוב עד שירחיבו ויגדל רוחב בעוגל טפח על טפח (עד שהקוטר יהיה באורך טפח ולכן הריבוע החוסם יהיה טפח על טפח); ואחר כך תחתך החוטין מן הנקודה ולמטה (ראו חלק מס'<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="numeric on">1<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"/>
                      </span></span></span></span></span><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span>באיור למטה), דהיינו מחצי רוחב עיגול ולמטה, ואחר שיחתכו יתפשטו כל החוטין מימין ומשמאל ונמצא כל חוט הולך ומאריך מחבירו משהו מכאן ומשהו מכאן עד שאתה מגיע לחוט העליון דארכו ג' טפחים שהוא חוט החיצון שהוא מסבב טפח על טפח דכל שיש ברוחבו טפח (כל עיגול שקוטרו באורך טפח) יש בהיקפו שלשה טפחים (היקפו הוא שלושה טפחים - הקירוב של <span class="inset Formula">\(\pi\)</span> שהגמרא והתוספות משתמשים בו הוא <span class="inset Formula">\(3\)</span>). נמצאו החוטין הללו סדורין כענין זה:</span><span class="layout Plain Layout">
              <div class="align center">
                <img src="C:\Users\sraya\Documents\HUJI\summaries\2#analysis\2#calculus_2\figures\the_tosafot_figure.png" class="inset Graphics"/>
              </div>
            </span><span class="layout Plain Layout">כמין רצועה רחבה באמצע חצי טפח, והיינו כנגד הנקודה, מכאן ומכאן כלה והולכת וצרה עד משהו (עד <span class="inset Formula">\(0\)</span>, כלומר מדובר במשולש שווה שוקיים שאורך הבסיס שלו הוא <span class="inset Formula">\(3\)</span> טפחים ואורך הגובה שלו הוא <span class="inset Formula">\(\frac{1}{2}\)</span> טפח, ראו חלק מס'<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="numeric on">2<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"/>
                      </span></span></span></span></span><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span>באיור לעיל). ואם באת לחזור ולחלק אותה באמצע היינו כנגד הנקודה תמצא שתי רצועות שכל אחת ארכה טפח ומחצה ומצד אחת רחבה חצי טפח ומצד אחת כלה עד משהו (כלומר מדובר בשני משולשים ישרי זווית שאורך אחד מניצביו הוא <span class="inset Formula">\(1\frac{1}{2}\)</span> טפחים וארך האחר <span class="inset Formula">\(\frac{1}{2}\)</span> טפח, שוב החלק מס'<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="numeric on">2</span>), ועתה תצטרף אלו שתי הרצועות ושים הארוך כנגד הקצר את תמצא רצועה ארכה טפח ומחצה על רוחב חצי טפח (חבר את שני המשולשים זה לזה כך שייווצר מלבן שאורכי צלעותיו כאורכי הניצבים של שני המשולשים, ראו חלק מס'<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="numeric on">3<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"/>
                      </span></span></span></span></span><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span>באיור); תחלוק אותה לשלש רצועות תמצא בה שלש רצועות מחצי טפח על חצי טפח (נחלק את המלבן לשלושה ריבועים חופפים שאורך צלעותיהם הוא חצי טפח), ואילו רצועה מרובעת של טפח (ריבוע שאורך צלעותיו הוא טפח - שהוא הריבוע אליו אנו משווים את העיגול) כשתחלקנה שתי וערב תמצא בה ארבע רצועות של חצי טפח על חצי טפח הרי לך מרובע יתר על העיגול רביע."</span></div>\(\:\)\(\:\)<span class="inset space \space{}"/><span class="inset space \space{}"/>
          <div width="55%" class="inset Box Boxed" style="border-color: black; background-color: none"><span class="layout Plain Layout"><b class="series bold"><u class="bar under">הסבר של דברי התוספות בשפה אינטואיטיבית</u></b></span><span class="layout Plain Layout">ניקח עיגול שקוטרו <span class="inset Formula">\(2r\)</span> נחתוך בו רדיוס ו"נפתח" את העיגול למשולש שווה שוקיים שאורך בסיסו כאורך היקף העיגול, והמרחק בין כל שתי נקודות הנמצאות באותו הגובה בשוקיים הוא כהיקף העיגול שאורך רדיוסו הוא המרחק בין הקטע שבין שתי הנקודות לבין הקודקוד שבין שתי השוקיים. הסיבה לכך שאכן קיבלנו משולש היא ההנחה שלנו שקיים יחס ישר בין היקף המעגל לקוטרו ולרדיוסו, ולכן הפונקציה המתאימה לכל נקודה על הרדיוס את היקף המעגל המתאים היא פונקציה ליניארית.<br class="inset Newline newline"/>א"כ שטח העיגול הוא כשטח משולש שווה שוקיים שאורך בסיסו הוא <span class="inset Formula">\(2\pi r\)</span> וגובהו <span class="inset Formula">\(r\)</span>, כלומר:<span class="inset Formula">\[
\frac{2\pi r\cdot r}{2}=\pi r^{2}
\]</span></span><span class="layout Plain Layout">\(\:\)</span><span class="layout Plain Layout">\(\:\)</span><span class="layout Plain Layout"><b class="series bold"><u class="bar under">דברי התוספות - "<a href="https://he.wikipedia.org/wiki/%D7%A6%D7%95%D7%A8%D7%AA_%D7%94%D7%93%D7%A3" class="inset CommandInset href">צורת הדף</a>"</u></b></span><span class="layout Plain Layout">
              <div class="align center">
                <img src="C:\Users\sraya\Documents\HUJI\summaries\2#analysis\2#calculus_2\figures\page_form.png" class="inset Graphics">	lyxscale 40</img>
              </div>
            </span><dl>
              <div class="layout Description item">
                <dt class="layout Description">מקור:</dt>
                <dd class="layout Description">
                  <a href="https://daf-yomi.com/Dafyomi_Page.aspx?vt=1&amp;massechet=289&amp;amud=15&amp;fs=0" class="inset CommandInset href">פורטל הדף היומי</a>.</dd>
              </div>
            </dl>
          </div>
          <br class="inset Newline newline"/>\(\:\)<br class="inset Newline newline"/>אם נרצה להמיר את ההוכחה של התוספות לשפה האינטואיטיבית שדיברנו בה קודם אז נאמר שאנו לוקחים "מעגל" ברדיוס <span class="inset Formula">\(0\)</span> ומזיחים אותו לאורך רדיוס העיגול כך שהמעגל גדל בהתאם לרדיוס, הפונקציה המתארת את גודל המעגל כתלות ברדיוס היא הפונקציה <span class="inset Formula">\(f\left(x\right)=2\pi x\)</span> שהשטח מתחת לגרף שלה הוא משולש ישר זווית שאורך ניצבו האחד כאורך רדיוס העיגול ואורך ניצבו האחר הוא כהיקף העיגול ושוב קיבלנו את הנוסחה:<span class="inset Formula">\[
\frac{2\pi r\cdot r}{2}=\pi r^{2}
\]</span>נשים לב לכך ש-<span class="inset Formula">\(\intop f\left(x\right)dx=\intop2\pi x\ dx=\pi x^{2}+C\)</span> ולכן הפירמול של האינטואיציה הזו הוא באמירה ששטח העיגול הוא האינטגרל:<span class="inset Formula">\[
\intop_{0}^{r}2\pi x\ dx=\pi r^{2}-\pi\cdot0^{2}=\pi r^{2}
\]</span></div>

    <section class="layout Section">
      <h2 class="layout Section" id="Section_2"><span class="label">2 </span>האינטגרל הלא מסוים (פונקציות קדומות)</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_2.1"><span class="label">2.1 </span>הגדרות</h3>
        <div class="layout Definition"><span class="label">הגדרה 2.1. </span>נאמר שפונקציה <span class="inset Formula">\(F\)</span> היא <u class="bar under">פונקציה קדומה</u> של הפונקציה <span class="inset Formula">\(f\)</span> על מקטע <span class="inset Formula">\(I\)</span><span class="inset Foot"><span class="label">19</span><span class="layout Plain Layout">אם יש למקטע נקודות שפה אז כוונתנו לגזירות חד-צדדית וכן יש לפרש זאת מכאן והלאה בכל הקבצים.</span></span> אם לכל <span class="inset Formula">\(x\in I\)</span> מתקיים <span class="inset Formula">\(F'\left(x\right)=f\left(x\right)\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 2.2. </span>אוסף כל הפונקציות הקדומות של פונקציה נתונה <span class="inset Formula">\(f\)</span> נקרא <u class="bar under">האינטגרל הלא מסוים</u> של <span class="inset Formula">\(f\)</span> ומסומן ב-<span class="inset Formula">\(\intop f\left(x\right)dx\)</span>.</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> ראינו בקורס הקודם שאם <span class="inset Formula">\(F\)</span> היא פונקציה קדומה של <span class="inset Formula">\(f\)</span> אז <span class="inset Formula">\(\intop f\left(x\right)dx=\left\{ F\left(x\right)+C\mid C\in\MKreal\right\} \)</span> ולכן פעמים רבות נוהגים לקצר ולכתוב:<span class="inset Formula">\[
\intop f\left(x\right)dx=F\left(x\right)+C
\]</span></dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> בפרק שיעסוק במשפט היסודי נראה הוכחה לכך שלכל פונקציה רציפה יש פונקציה קדומה, כדאי לזכור זאת משום שיחד עם משפט דארבו<span class="inset Foot"><span class="label">20</span><span class="layout Plain Layout">כל נגזרת )כלומר כל פונקציה שיש לה קדומה( מקייימת את משפט ערך הביניים גם אם אינה רציפה.</span></span> ניתן לדעת עבור מרבית הפונקציות אם יש להן פונקציה קדומה: אם הפונקציה רציפה אז יש לה ואם אינה מקיימת את משפט דארבו אז אין לה, פונקציות שאינן נופלות באחת מהקטגוריות יכולות להיות נגזרות של פונקציות פתולוגיות (ראו דוגמה לכך בקובץ "<a href="https://drive.google.com/file/d/1911y6AkbARsCv8ZHTWjey4Prmsp8KKV4/view?usp=drive_link" class="inset CommandInset href">פתולוגיות פונקציות מאגר</a>").</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> ההוכחה הכי טובה לכך שמצאנו את האינטגרל הלא מסוים של פונקציה היא לגזור את אחת הפונקציות שאנו טוענים כי היא קדומה, כדאי לעשות זאת גם מחשש לטעות אלגברית בדרך.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> בד"כ לא נקבל אינטגרלים בצורה הזו ונצטרך להביא אותם אליה כדי שנוכל להשתמש במשפט: נניח שאנחנו רוצים למצוא את האינטגרל <span class="inset Formula">\(\intop g\left(x\right)dx\)</span> עבור פונקציה <span class="inset Formula">\(g:I\rightarrow\MKreal\)</span> והצלחנו למצוא שתי פונקציות <span class="inset Formula">\(\varphi:I\rightarrow I_{0}\)</span> ו-<span class="inset Formula">\(\psi:I_{0}\rightarrow\MKreal\)</span> כך של-<span class="inset Formula">\(\psi\)</span> יש קדומה <span class="inset Formula">\(\varPsi\)</span> על <span class="inset Formula">\(I_{0}\)</span> ו-<span class="inset Formula">\(\varphi\)</span> גזירה ב-<span class="inset Formula">\(I\)</span> ובנוסף מתקיים <span class="inset Formula">\(g\left(x\right)=\psi\left(\varphi\left(x\right)\right)\)</span> לכל <span class="inset Formula">\(x\in I\)</span>, במקרה כזה נוכל להשתמש במשפט ולומר שמתקיים <span class="inset Formula">\(\intop g\left(x\right)dx=\varPsi\left(\varphi\left(x\right)\right)+C\)</span>.<ul>
                <li class="layout Itemize">פעמים רבות משתמשים במשפט זה בצורה הלא פורמלית הבאה: מסמנים <span class="inset Formula">\({\color{red}u=\varphi\left(x\right)}\)</span> ואז (נשתמש בסימון של לייבניץ לנגזרות) <span class="inset Formula">\(\frac{du}{dx}=\varphi'\left(x\right)\)</span> ולכן "מתקיים" <span class="inset Formula">\({\color{blue}du=\varphi'\left(x\right)dx}\)</span> ומכאן שגם:<span class="inset Formula">\[
\intop g\left(x\right)dx=\intop\psi\left({\color{red}\varphi\left(x\right)}\right)\cdot{\color{blue}\varphi'\left(x\right)dx}=\intop\psi\left({\color{red}u}\right){\color{blue}du}=\varPsi\left(u\right)+C=\varPsi\left(\varphi\left(x\right)\right)+C
\]</span></li>
                <li class="layout Itemize">אם <span class="inset Formula">\(\varphi\)</span> גם הפיכה נפוצה גם הצורה הלא פורמלית הנוספת: <span class="inset Formula">\({\color{red}\varphi^{-1}\left(u\right)=x}\)</span> ומכאן נובע כי:<span class="inset Formula">\[
\frac{dx}{du}=\varphi^{-1}'\left(u\right)=\frac{1}{\varphi'\left(\varphi^{-1}\left(u\right)\right)}
\]</span>ולכן "מתקיים" <span class="inset Formula">\({\color{blue}dx=\frac{1}{\varphi'\left(\varphi^{-1}\left(u\right)\right)}du}\)</span> ומכאן שגם<span class="inset Formula">\[\begin{align*}
\intop g\left(x\right)dx &amp; =\intop\psi\left(\varphi\left({\color{red}x}\right)\right)\cdot\varphi'\left({\color{red}x}\right){\color{blue}dx}\\
 &amp; =\intop\psi\left(\varphi\left({\color{red}\varphi^{-1}\left(u\right)}\right)\right)\cdot\varphi'\left({\color{red}\varphi^{-1}\left(u\right)}\right)\cdot{\color{blue}\frac{1}{\varphi'\left(\varphi^{-1}\left(u\right)\right)}du}\\
 &amp; =\intop\psi\left(u\right)du=\varPsi\left(u\right)+C=\varPsi\left(\varphi\left(x\right)\right)+C
\end{align*}\]</span></li>
              </ul>
              <div class="layout Standard">זה לא מקרי: הסיבה לכך שלייבניץ סימן את הנגזרת בצורה <span class="inset Formula">\(\frac{du}{dx}\)</span> היא ששיפוע הוא בעצם מנה של הפרש ערכי הפונקציה חלקי הפרש ערכי המקורות, המקור לסימון הזה הוא הסימון הנפוץ בפיזיקה<span class="inset Formula">\[
\frac{\Delta u}{\Delta x}=\frac{u\left(x_{2}\right)-u\left(x_{1}\right)}{x_{2}-x_{1}}
\]</span>כאשר <span class="inset Formula">\(x_{1}\neq x_{2}\)</span>, בעצם הביטוי <span class="inset Formula">\(dx\)</span> רוצה לומר "גודל קטן עד לאינסוף" (<a href="https://he.wikipedia.org/wiki/%D7%90%D7%99%D7%A0%D7%A4%D7%99%D7%A0%D7%99%D7%98%D7%A1%D7%99%D7%9E%D7%9C" class="inset CommandInset href">אינפיניטסימל</a>) מה שפורמל אח"כ בהגדרת הגבול.<br class="inset Newline newline"/>מה שאני רוצה לומר הוא שהנגזרת אמנם אינה מנה מבחינה פורמלית אך מבחינה אינטואיטיבית היא אכן כזו או לפחות "סוג של" ופעמים רבות האינטואיציה שלנו מכוונת היטב למטרה.</div>
            </dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> למרות כל ההסבר היפה הוכחה בצורה הנ"ל <b class="series bold"><span class="color blue">אינה הוכחה פורמלית</span></b> ולכן יש לגזור את הפונקציה כדי להוכיח שאכן מצאנו את האינטגרל הלא מסוים.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> מבחינה אינטואיטיבית זה אכן מה שציפינו לקבל מכיוון שלכל נקודה על הגרף של <span class="inset Formula">\(f\)</span>, שטח המלבן הנוצר מהצירים ומהישרים המקבילים אליהם שנחתכים בנקודה זו מחלק לשני חלקים: החלק התחום בין גרף הפונקציה לציר ה-<span class="inset Formula">\(x\)</span> וזה התחום בינו לבין ציר ה-<span class="inset Formula">\(y\)</span> שעבור <span class="inset Formula">\(f^{-1}\)</span> הוא ציר ה-<span class="inset Formula">\(x\)</span><span class="inset Foot"><span class="label">21</span><span class="layout Plain Layout">הגרפים של <span class="inset Formula">\(f\)</span> ושל <span class="inset Formula">\(f^{-1}\)</span> זהים עד כדי שיקוף וסיבוב שכמובן אינם משנים את השטחים.</span></span>; הביטוי <span class="inset Formula">\(f^{-1}\left(y\right)\cdot y\)</span> מבטא את שטח המלבן כולו והביטוי <span class="inset Formula">\(F\left(f^{-1}\left(y\right)\right)\)</span> מבטא את השטח התחום בין הגרף של <span class="inset Formula">\(f\)</span> לציר ה-<span class="inset Formula">\(x\)</span> "שלה".<br class="inset Newline newline"/>כן, אני יודע, הטיעון הזה מדבר על אינטגרלי רימן (ומשתמש בהוכחה גאומטרית רחמנא ליצלן) ואינו מתייחס לאפשרות שהפונקציה עוברת ביותר מרביע אחד של המישור; אבל הקשר של השטח מתחת לגרף הפונקציה לבין הקדומה שלה הוא אינטואיטיבי מאד וניתן להכליל את הטיעון הזה גם ליותר מרביע אחד, כמובן שכל זה ברמת האינטואיציה ולא מדובר בהוכחה פורמלית אבל זה כל היופי במתמטיקה: האפשרות לפרמל את האינטואיציה.</dd>
          </div>
        </dl>
        <div class="layout Standard">\(\:\)</div>
        <div class="layout Theorem"><span class="label">משפט 2.3. </span><b class="series bold">ליניאריות האינטגרל הלא מסוים</b><br class="inset Newline newline"/>תהיינה <span class="inset Formula">\(f,g:I\rightarrow\MKreal\)</span> פונקציות המוגדרות על מקטע <span class="inset Formula">\(I\)</span> ובעלות פונקציה קדומה על מקטע זה.<ol>
            <li class="layout Enumerate">לכל <span class="inset Formula">\(a\in\MKreal\)</span> מתקיים <span class="inset Formula">\(\intop a\cdot f\left(x\right)dx=a\cdot\intop f\left(x\right)dx\)</span>.</li>
            <li class="layout Enumerate">מתקיים <span class="inset Formula">\(\intop f\left(x\right)\pm g\left(x\right)dx=\intop f\left(x\right)dx\pm\intop g\left(x\right)dx\)</span>.</li>
          </ol>
        </div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Theorem"><span class="label">משפט 2.4. </span><b class="series bold"><i class="shape italic">אינטגרציה בחלקים</i></b><br class="inset Newline newline"/>תהיינה <span class="inset Formula">\(f,g:I\rightarrow\MKreal\)</span> פונקציות המוגדרות על מקטע <span class="inset Formula">\(I\)</span> ובעלות פונקציה קדומה על מקטע זה.<br class="inset Newline newline"/>אם <span class="inset Formula">\(f\)</span> ו-<span class="inset Formula">\(g\)</span> גזירות ב-<span class="inset Formula">\(I\)</span> אז מתקיים <span class="inset Formula">\(\intop f\left(x\right)g'\left(x\right)dx=f\left(x\right)g\left(x\right)-\intop f'\left(x\right)g\left(x\right)dx\)</span>.</div>
        <div class="layout Proof"><span class="label">הוכחה. </span>ע"פ כלל לייבניץ לנגזרת של מכפלת פונקציות.</div>
        <div class="layout Theorem"><span class="label">משפט 2.5. </span><b class="series bold">אינטגרציה ע"י הצבה</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(f:I\rightarrow\MKreal\)</span> פונקציה המוגדרת על מקטע <span class="inset Formula">\(I\)</span> ובעלת פונקציה קדומה מקטע זה, ותהא <span class="inset Formula">\(\varphi:I_{0}\rightarrow I\)</span> פונקציה גזירה על מקטע <span class="inset Formula">\(I_{0}\)</span>; לכל פונקציה קדומה <span class="inset Formula">\(F:I\rightarrow\MKreal\)</span> של <span class="inset Formula">\(f\)</span> מתקיים:<span class="inset Formula">\[
\intop f\left(\varphi\left(x\right)\right)\cdot\varphi'\left(x\right)dx=F\left(\varphi\left(x\right)\right)+C
\]</span></div>
        <div class="layout Proof"><span class="label">הוכחה. </span>ע"פ כלל השרשרת.</div>
        <div class="layout Theorem"><span class="label">משפט 2.6. </span><b class="series bold">אינטגרל של פונקציה הופכית</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(f:I\rightarrow\MKreal\)</span> פונקציה גזירה על מקטע <span class="inset Formula">\(I\)</span>, ותהא <span class="inset Formula">\(F\)</span> פונקציה קדומה של <span class="inset Formula">\(f\)</span> על מקטע זה<span class="inset Foot"><span class="label">22</span><span class="layout Plain Layout">בהמשך נראה שבהכרח יש כזו בגלל ש-<span class="inset Formula">\(f\)</span> רציפה (המשפט היסודי של החשבון האינטגרלי).</span></span>.<br class="inset Newline newline"/>אם <span class="inset Formula">\(f\)</span> הפיכה אז מתקיים:<span class="inset Formula">\[
\intop f^{-1}\left(y\right)dy=y\cdot f^{-1}\left(y\right)-F\left(f^{-1}\left(y\right)\right)+C
\]</span></div>
        <div class="layout Standard"><b class="series bold"><span class="color red">צריך לצרף ציור.</span></b></div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Proof"><span class="label">הוכחה. </span>ראינו בקורס הקודם שהנגזרת של <span class="inset Formula">\(f^{-1}\)</span> היא <span class="inset Formula">\(f^{-1}'\left(y\right)=\frac{1}{f'\left(f^{-1}\left(y\right)\right)}\)</span>.<br class="inset Newline newline"/>נסמן <span class="inset Formula">\(u=f^{-1}\left(y\right)\)</span>.<span class="inset Formula">\[
\Rightarrow\frac{du}{dy}=\frac{1}{f'\left(f^{-1}\left(y\right)\right)}\Rightarrow du=\frac{1}{f'\left(f^{-1}\left(y\right)\right)}\cdot dy
\]</span><span class="inset Formula">\[\begin{align*}
\Rightarrow\intop f^{-1}\left(y\right)dy &amp; =\intop f^{-1}\left(y\right)\cdot\frac{f'\left(f^{-1}\left(y\right)\right)}{f'\left(f^{-1}\left(y\right)\right)}dy=\intop u\cdot f'\left(u\right)du\\
 &amp; =u\cdot f\left(u\right)-\intop1\cdot f\left(u\right)du\\
 &amp; =u\cdot f\left(u\right)-F\left(u\right)+C\\
 &amp; =f^{-1}\left(y\right)\cdot f\left(f^{-1}\left(y\right)\right)-F\left(f^{-1}\left(y\right)\right)+C\\
 &amp; =y\cdot f^{-1}\left(y\right)-F\left(f^{-1}\left(y\right)\right)+C
\end{align*}\]</span>עד כאן השתמשנו בשיטה הלא פורמלית שתוארה לעיל וכעת יש לנו שתי סיבות אינטואיטיביות להאמין שאכן הפונקציה הנ"ל היא קדומה של <span class="inset Formula">\(f^{-1}\)</span> וכעת נעבור להוכחה פורמלית.<br class="inset Newline newline"/>תהא <span class="inset Formula">\(g:\MKim f\rightarrow\MKreal\)</span> פונקציה המוגדרת ע"י (לכל <span class="inset Formula">\(y\in\MKim f\)</span>):<span class="inset Formula">\[
g\left(y\right):=y\cdot f^{-1}\left(y\right)-F\left(f^{-1}\left(y\right)\right)
\]</span>מכאן שלכל <span class="inset Formula">\(y\in\MKim f\)</span> כך ש-<span class="inset Formula">\(f'\left(f^{-1}\left(y\right)\right)\neq0\)</span> מתקיים:<span class="inset Formula">\[\begin{align*}
g'\left(y\right) &amp; =1\cdot f^{-1}\left(y\right)+y\cdot\frac{1}{f'\left(f^{-1}\left(y\right)\right)}-F'\left(f^{-1}\left(y\right)\right)\cdot\frac{1}{f'\left(f^{-1}\left(y\right)\right)}\\
 &amp; =f^{-1}\left(y\right)+y\cdot\frac{1}{f'\left(f^{-1}\left(y\right)\right)}-f\left(f^{-1}\left(y\right)\right)\cdot\frac{1}{f'\left(f^{-1}\left(y\right)\right)}\\
 &amp; =f^{-1}\left(y\right)+y\cdot\frac{1}{f'\left(f^{-1}\left(y\right)\right)}-y\cdot\frac{1}{f'\left(f^{-1}\left(y\right)\right)}=f^{-1}\left(y\right)
\end{align*}\]</span>כדי להוכיח את הטענה עבור נקודות שבהן <span class="inset Formula">\(f'\left(f^{-1}\left(y\right)\right)=0\)</span> נצטרך להשתמש בעובדה ש-<span class="inset Formula">\(f^{-1}\)</span> רציפה<span class="inset Foot"><span class="label">23</span><span class="layout Plain Layout">הגזירות של <span class="inset Formula">\(f\)</span> גוררת את רציפותה ומכאן שגם <span class="inset Formula">\(f^{-1}\)</span> רציפה.</span></span> ולכן ע"פ המשפט היסודי (שעוד לא למדנו) יש לה פונקציה קדומה <span class="inset Formula">\(G\)</span>.<br class="inset Newline newline"/>בהג"כ נניח שקיים <span class="inset Formula">\(y_{0}\in\MKim f\)</span> כך ש-<span class="inset Formula">\(G\left(y_{0}\right)=g\left(y_{0}\right)\)</span> וא"כ לכל <span class="inset Formula">\(y\in\MKim f\)</span> כך ש-<span class="inset Formula">\(f'\left(f^{-1}\left(y\right)\right)\neq0\)</span> מתקיים <span class="inset Formula">\(G\left(y\right)=g\left(y\right)\)</span>,<br class="inset Newline newline"/>נשים לב לכך שקבוצת הנקודות ב-<span class="inset Formula">\(\MKim f\)</span> המקיימת <span class="inset Formula">\(f'\left(f^{-1}\left(y\right)\right)\neq0\)</span> צפופה ב-<span class="inset Formula">\(\MKim f\)</span><span class="inset Foot"><span class="label">24</span><span class="layout Plain Layout">אחרת מהרציפות של <span class="inset Formula">\(f^{-1}\)</span> ומהיותה הפיכה היה נובע שקיים מקטע שבו מתקיים <span class="inset Formula">\(f'\left(x\right)=0\)</span>, כלומר <span class="inset Formula">\(f\)</span> הייתה פונקציה קבועה במקטע זה בסתירה לכך שהיא חח"ע.</span></span> ולכן מהרציפות של שתי הפונקציות נובע שהן מקבלות את אותו ערך גם בנקודות שבהן <span class="inset Formula">\(f'\left(f^{-1}\left(y\right)\right)=0\)</span>.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Corollary"><span class="label">מסקנה 2.7. </span>מתקיים:<span class="inset Formula">\[\begin{align*}
\intop\ln\left(x\right)dx &amp; =x\cdot\ln\left(x\right)-x\\
\intop\arcsin\left(x\right)dx &amp; =x\cdot\arcsin\left(x\right)+\sqrt{1-x^{2}}\\
\intop\arccos\left(x\right)dx &amp; =x\cdot\arccos\left(x\right)-\sqrt{1-x^{2}}\\
\intop\arctan\left(x\right)dx &amp; =x\cdot\arctan\left(x\right)+\frac{1}{2}\cdot\ln\left(1+x^{2}\right)
\end{align*}\]</span></div>
