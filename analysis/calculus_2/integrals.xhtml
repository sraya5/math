        <div class="layout Theorem"><span class="label">משפט 3.21. </span>תהיינה <span class="inset Formula">\(f,g\in R\left[a,b\right]\)</span>, מתקיים גם <span class="inset Formula">\(f\cdot g\in R\left[a,b\right]\)</span>.</div>
        <div class="layout Proof"><span class="label">הוכחה. </span>ראינו לעיל שהיות <span class="inset Formula">\(f\)</span> ו-<span class="inset Formula">\(g\)</span> אינטגרביליות רימן גוררת ש-<span class="inset Formula">\(f\)</span> ו-<span class="inset Formula">\(g\)</span> חסומות על <span class="inset Formula">\(\left[a,b\right]\)</span>, א"כ יהיו <span class="inset Formula">\(M_{1},M_{2}\in\MKreal\)</span> כך שמתקיים <span class="inset Formula">\(\left|f\left(x\right)\right|\leq M_{1}\)</span> ו-<span class="inset Formula">\(\left|g\left(x\right)\right|\leq M_{2}\)</span> לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span>, נשים לב ש-<span class="inset Formula">\(f\cdot g\)</span> חסומה על <span class="inset Formula">\(\left[a,b\right]\)</span> (לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> מתקיים <span class="inset Formula">\(\left|f\left(x\right)\cdot g\left(x\right)\right|=\left|f\left(x\right)\right|\cdot\left|g\left(x\right)\right|\leq M_{1}\cdot M_{2}\)</span>).<br class="inset Newline newline"/>תהא <span class="inset Formula">\(P:=\left\{ x_{0},x_{1},\ldots,x_{n}\right\} \)</span> חלוקה של <span class="inset Formula">\(\left[a,b\right]\)</span>. לכל <span class="inset Formula">\(n\geq i\in\MKnatural\)</span> ולכל <span class="inset Formula">\(s,t\in\left[x_{i}-x_{i-1}\right]\)</span> מתקיים:<span class="inset Formula">\[\begin{align*}
\left|\left(f\cdot g\right)\left(s\right)-\left(f\cdot g\right)\left(t\right)\right| &amp; =\left|f\left(s\right)\cdot g\left(s\right)-f\left(t\right)\cdot g\left(t\right)\right|\\
 &amp; =\left|f\left(s\right)\cdot g\left(s\right)-f\left(t\right)\cdot g\left(s\right)+f\left(t\right)\cdot g\left(s\right)-f\left(t\right)\cdot g\left(t\right)\right|\\
 &amp; =\left|\left[f\left(s\right)-f\left(t\right)\right]\cdot g\left(s\right)+f\left(t\right)\cdot\left[g\left(s\right)-g\left(t\right)\right]\right|\\
 &amp; \leq\left|f\left(s\right)-f\left(t\right)\right|\cdot\left|g\left(s\right)\right|+\left|f\left(t\right)\right|\cdot\left|g\left(s\right)-g\left(t\right)\right|\\
 &amp; \leq W_{i}\left(f,P\right)\cdot\left|g\left(s\right)\right|+\left|f\left(t\right)\right|\cdot W_{i}\left(g,P\right)\\
 &amp; \leq W_{i}\left(f,P\right)\cdot M_{2}+M_{1}\cdot W_{i}\left(g,P\right)
\end{align*}\]</span>ומכאן שמתקיים גם:<span class="inset Formula">\[
W_{i}\left(f\cdot g,P\right)\leq M_{2}\cdot W_{i}\left(f,P\right)+M_{1}\cdot W_{i}\left(g,P\right)
\]</span>ולכן:<span class="inset Formula">\[\begin{align*}
\sum_{i=1}^{n}W_{i}\left(f\cdot g,P\right)\cdot\left(x_{i}-x_{i-1}\right) &amp; \leq\sum_{i=1}^{n}\left(M_{2}\cdot W_{i}\left(f,P\right)+M_{1}\cdot W_{i}\left(g,P\right)\right)\cdot\left(x_{i}-x_{i-1}\right)\\
 &amp; =M_{2}\cdot\sum_{i=1}^{n}W_{i}\left(f,P\right)\cdot\left(x_{i}-x_{i-1}\right)+M_{1}\cdot\sum_{i=1}^{n}W_{i}\left(g,P\right)\cdot\left(x_{i}-x_{i-1}\right)\xrightarrow[\lambda\left(P\right)\rightarrow0]{}0
\end{align*}\]</span>ומכאן שע"פ תנאי רימן לאינטגרביליות מתקיים <span class="inset Formula">\(f\cdot g\in R\left[a,b\right]\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 3.22. </span>תהא <span class="inset Formula">\(g\in R\left[a,b\right]\)</span>, אם קיים <span class="inset Formula">\(0&lt;C\in\MKreal\)</span> כך ש-<span class="inset Formula">\(\left|g\left(x\right)\right|\geq C\)</span> לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> אז גם <span class="inset Formula">\(\frac{1}{g}\in R\left[a,b\right]\)</span>.</div>
        <div class="layout Proof"><span class="label">הוכחה. </span>נניח שקיים <span class="inset Formula">\(C\)</span> כנ"ל, א"כ לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> מתקיים <span class="inset Formula">\(\left|\frac{1}{g\left(x\right)}\right|\leq\frac{1}{C}\)</span> ולכן <span class="inset Formula">\(\frac{1}{g}\in B\left[a,b\right]\)</span>.<br class="inset Newline newline"/>תהא <span class="inset Formula">\(P:=\left\{ x_{0},x_{1},\ldots,x_{n}\right\} \)</span> חלוקה של <span class="inset Formula">\(\left[a,b\right]\)</span>, לכל <span class="inset Formula">\(n\geq i\in\MKnatural\)</span> ולכל <span class="inset Formula">\(s,t\in\left[x_{i-1},x_{i}\right]\)</span> מתקיים:<span class="inset Formula">\[
\left|\frac{1}{g\left(s\right)}-\frac{1}{g\left(t\right)}\right|=\left|\frac{g\left(t\right)-g\left(s\right)}{g\left(s\right)\cdot g\left(t\right)}\right|\leq\frac{W_{i}\left(g,P\right)}{C^{2}}
\]</span>ומכאן שגם:<span class="inset Formula">\[
W_{i}\left(\frac{1}{g},P\right)\leq\frac{W_{i}\left(g,P\right)}{C^{2}}
\]</span><span class="inset Formula">\[
\Rightarrow\sum_{i=1}^{n}W_{i}\left(\frac{1}{g},P\right)\left(x_{i}-x_{i-1}\right)\leq\frac{1}{C^{2}}\cdot\sum_{i=1}^{n}W_{i}\left(g,P\right)\left(x_{i}-x_{i-1}\right)\xrightarrow[\lambda\left(P\right)\rightarrow0]{}0
\]</span>ומכאן שע"פ תנאי רימן לאינטגרביליות מתקיים <span class="inset Formula">\(\frac{1}{g}\in R\left[a,b\right]\)</span>.</div>
        <div class="layout Corollary"><span class="label">מסקנה 3.23. </span>תהיינה <span class="inset Formula">\(f,g\in R\left[a,b\right]\)</span>, אם קיים <span class="inset Formula">\(0&lt;C\in\MKreal\)</span> כך ש-<span class="inset Formula">\(\left|g\left(x\right)\right|\geq C\)</span> לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> אז גם <span class="inset Formula">\(\frac{f}{g}\in R\left[a,b\right]\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 3.24. </span>תהא <span class="inset Formula">\(f\in R\left[a,b\right]\)</span>, מכאן ש-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left[a,b\right]\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Theorem"><span class="label">משפט 3.25. </span>תהא <span class="inset Formula">\(c\in\left(a,b\right)\)</span> ותהא <span class="inset Formula">\(f:\left[a,b\right]\rightarrow\MKreal\)</span> המקיימת <span class="inset Formula">\(f\in R\left[a,c\right]\)</span> וגם <span class="inset Formula">\(f\in R\left[c,b\right]\)</span>, ש-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן על <span class="inset Formula">\(\left[a,b\right]\)</span> ומתקיים השוויון:<span class="inset Formula">\[
\intop_{a}^{b}f\left(x\right)dx=\intop_{a}^{c}f\left(x\right)dx+\intop_{c}^{b}f\left(x\right)dx
\]</span></div>
        <div class="layout Corollary"><span class="label">מסקנה 3.26. </span>תהא <span class="inset Formula">\(f:\left[a,b\right]\rightarrow\MKreal\)</span>, <span class="inset Formula">\(f\)</span> אינטגרבילית רימן על <span class="inset Formula">\(\left[a,b\right]\)</span> אם"ם <span class="inset Formula">\(f\)</span> אינטגרבילית על כל תת-קטע סגור של <span class="inset Formula">\(\left[a,b\right]\)</span>.</div>
        <div class="layout Claim"><span class="label">טענה 3.27. </span>תהא <span class="inset Formula">\(h\in R\left[a,b\right]\)</span> פונקציה רציפה, אם <span class="inset Formula">\(\intop_{a}^{b}\left(h\left(x\right)\right)^{2}dx=0\)</span> אז <span class="inset Formula">\(h\equiv0\)</span> (כלומר <span class="inset Formula">\(h\left(x\right)=0\)</span> לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span>).</div>
        <div class="layout Proof"><span class="label">הוכחה. </span>נניח ש-<span class="inset Formula">\(\intop_{a}^{b}\left(h\left(x\right)\right)^{2}dx=0\)</span> ונניח בשלילה שקיים <span class="inset Formula">\(y\in\left[a,b\right]\)</span> כך ש-<span class="inset Formula">\(h\left(y\right)\neq0\)</span>. מהרציפות של <span class="inset Formula">\(h\)</span> נובע שקיים קטע סגור <span class="inset Formula">\(\left[c,d\right]\subseteq\left[a,b\right]\)</span> כך ש-<span class="inset Formula">\(h\left(x\right)\geq\frac{h\left(y\right)}{2}\)</span> לכל <span class="inset Formula">\(x\in\left[c,d\right]\)</span> ואז <span class="inset Formula">\(\intop_{c}^{d}\left(h\left(x\right)\right)^{2}dx\geq\intop_{c}^{d}\left(\frac{h\left(y\right)}{2}\right)^{2}dx&gt;0\)</span> ומכיוון ש-<span class="inset Formula">\(\left(h\left(x\right)\right)^{2}\geq0\)</span> לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> נובע מזה שמתקיים:<span class="inset Formula">\[
\intop_{a}^{b}\left(h\left(x\right)\right)^{2}dx=\intop_{a}^{c}\left(h\left(x\right)\right)^{2}dx+\intop_{c}^{d}\left(h\left(x\right)\right)^{2}dx+\intop_{d}^{b}\left(h\left(x\right)\right)^{2}dx&gt;0
\]</span>מכאן שהנחת השלילה אינה נכונה - לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> מתקיים <span class="inset Formula">\(h\left(x\right)=0\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 3.28. </span>יהיו <span class="inset Formula">\(c,d\in\MKreal\)</span> כך ש-<span class="inset Formula">\(c&lt;d\)</span>.<br class="inset Newline newline"/>תהיינה <span class="inset Formula">\(f:\left[a,b\right]\rightarrow\left[c,d\right]\)</span> פונקציה אינטגרבילית רימן על <span class="inset Formula">\(\left[a,b\right]\)</span> ו-<span class="inset Formula">\(g:\left[c,d\right]\rightarrow\MKreal\)</span> פונקציה רציפה.<span class="inset Formula">\[
\Rightarrow g\circ f\in R\left[a,b\right]
\]</span></div>
        <div class="layout Proof"><span class="label">הוכחה. </span><span class="inset Formula">\(g\)</span> רציפה על קטע סגור ולכן חסומה ורציפה במידה שווה.<br class="inset Newline newline"/>יהי <span class="inset Formula">\(M\in\MKreal\)</span> כך ש-<span class="inset Formula">\(\left|g\left(x\right)\right|&lt;M\)</span> לכל <span class="inset Formula">\(x\in\left[c,d\right]\)</span>.<br class="inset Newline newline"/>יהי <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span>.<br class="inset Newline newline"/>מרציפות במידה שווה של <span class="inset Formula">\(g\)</span> נובע שקיימת <span class="inset Formula">\(0&lt;\delta_{1}\in\MKreal\)</span> כך שלכל <span class="inset Formula">\(x,y\in\left[c,d\right]\)</span> כך ש-<span class="inset Formula">\(\left|x-y\right|&lt;\delta_{1}\)</span> מתקיים <span class="inset Formula">\(\left|g\left(x\right)-g\left(y\right)\right|&lt;\frac{\varepsilon}{2\left(b-a\right)}\)</span>, תהא <span class="inset Formula">\(\delta_{1}\)</span> כנ"ל.<br class="inset Newline newline"/>היות ש-<span class="inset Formula">\(f\in R\left[a,b\right]\)</span> נדע שקיימת <span class="inset Formula">\(0&lt;\delta_{2}\in\MKreal\)</span> כך שלכל חלוקה <span class="inset Formula">\(P:=\left\{ x_{0},x_{1},\ldots,x_{n}\right\} \)</span> המקיימת <span class="inset Formula">\(\lambda\left(P\right)&lt;\delta_{2}\)</span> מתקיים:<span class="inset Formula">\[
\sum_{i=1}^{n}W_{i}\left(f,P\right)\cdot\left(x_{i}-x_{i-1}\right)&lt;\frac{\varepsilon\cdot\delta_{1}}{4M}
\]</span>תהא <span class="inset Formula">\(\delta_{2}\)</span> כנ"ל ותהא <span class="inset Formula">\(P\)</span> חלוקה כנ"ל.<br class="inset Newline newline"/>נשים לב שלכל <span class="inset Formula">\(n\geq i\in\MKnatural\)</span> המקיים <span class="inset Formula">\(W_{i}\left(f,P\right)&lt;\delta_{1}\)</span> מתקיים <span class="inset Formula">\(W_{i}\left(g\circ f,P\right)&lt;\frac{\varepsilon}{2\left(b-a\right)}\)</span>.<br class="inset Newline newline"/>בנוסף מתקיים:<span class="inset Formula">\[
\delta_{1}\cdot\sum_{W_{i}\left(f\right)\geq\delta_{1}}\left(x_{i}-x_{i-1}\right)\leq\sum_{i=1}^{n}W_{i}\left(f,P\right)\cdot\left(x_{i}-x_{i-1}\right)&lt;\frac{\varepsilon\cdot\delta_{1}}{4M}
\]</span>ומכאן שגם:<span class="inset Formula">\[
\sum_{W_{i}\left(f\right)\geq\delta_{1}}\left(x_{i}-x_{i-1}\right)&lt;\frac{\varepsilon}{4M}
\]</span><span class="inset Formula">\[\begin{align*}
\Rightarrow\sum_{i=1}^{n}W_{i}\left(g\circ f,P\right)\cdot\left(x_{i}-x_{i-1}\right) &amp; =\sum_{W_{i}\left(f\right)\geq\delta_{1}}W_{i}\left(g\circ f,P\right)\cdot\left(x_{i}-x_{i-1}\right)+\sum_{W_{i}\left(f\right)&lt;\delta_{1}}W_{i}\left(g\circ f,P\right)\cdot\left(x_{i}-x_{i-1}\right)\\
 &amp; &lt;2M\cdot\sum_{W_{i}\left(f\right)\geq\delta_{1}}\left(x_{i}-x_{i-1}\right)+\frac{\varepsilon}{2\left(b-a\right)}\cdot\sum_{W_{i}\left(f\right)&lt;\delta_{1}}\left(x_{i}-x_{i-1}\right)\\
 &amp; &lt;2M\cdot\frac{\varepsilon}{4M}+\frac{\varepsilon}{2\left(b-a\right)}\cdot\left(b-a\right)=\frac{\varepsilon}{2}+\frac{\varepsilon}{2}=\varepsilon
\end{align*}\]</span><span class="inset Formula">\(P\)</span> הנ"ל היתה שרירותית ולכן הנ"ל נכון לכל חלוקה <span class="inset Formula">\(P\)</span> של <span class="inset Formula">\(\left[a,b\right]\)</span> המקיימת <span class="inset Formula">\(\lambda\left(P\right)&lt;\delta_{2}\)</span>.<br class="inset Newline newline"/><span class="inset Formula">\(\varepsilon\)</span> הנ"ל היה שרירותי ולכן לכל <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span> קיימת <span class="inset Formula">\(0&lt;\delta\in\MKreal\)</span> כך שלכל חלוקה <span class="inset Formula">\(P\)</span> של <span class="inset Formula">\(\left[a,b\right]\)</span> המקיימת <span class="inset Formula">\(\lambda\left(P\right)&lt;\delta\)</span> מתקיים:<span class="inset Formula">\[
\sum_{i=1}^{n}W_{i}\left(g\circ f,P\right)\cdot\left(x_{i}-x_{i-1}\right)&lt;\varepsilon
\]</span>מתנאי רימן לאינטגרביליות נובע ש-<span class="inset Formula">\(f\circ g\in R\left[a,b\right]\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 3.29. </span>תהא <span class="inset Formula">\(f\in R\left[a,b\right]\)</span>, מתקיים:<span class="inset Formula">\[
\left|\intop_{a}^{b}f\left(x\right)dx\right|\leq\intop_{a}^{b}\left|f\left(x\right)\right|dx
\]</span></div>
        <div class="layout Proof"><span class="label">הוכחה. </span>מתקיים אחד משני מקרים: או ש-<span class="inset Formula">\(\left|\intop_{a}^{b}f\left(x\right)dx\right|=\intop_{a}^{b}f\left(x\right)dx\)</span> או ש-<span class="inset Formula">\(\left|\intop_{a}^{b}f\left(x\right)dx\right|=-\intop_{a}^{b}f\left(x\right)dx=\intop_{a}^{b}-f\left(x\right)dx\)</span>,<br class="inset Newline newline"/>מהעובדה שלכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> מתקיים <span class="inset Formula">\(\pm f\left(x\right)\leq\left|f\left(x\right)\right|\)</span> נובע כי:<span class="inset Formula">\[
\left|\intop_{a}^{b}f\left(x\right)dx\right|=\intop_{a}^{b}\pm f\left(x\right)dx\leq\intop_{a}^{b}\left|f\left(x\right)\right|dx
\]</span></div>
        <div class="layout Theorem"><span class="label">משפט 3.30. </span><b class="series bold">אינווריאנטיות האינטגרל להזזה ולכפל</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(f\in R\left[a,b\right]\)</span>, לכל <span class="inset Formula">\(c\in\MKreal\)</span> ולכל <span class="inset Formula">\(0&lt;q\in\MKreal\)</span> מתקיים:<div class="layout Standard"><span class="inset Formula">\[\begin{align*}
\intop_{a-c}^{b-c}f\left(x+c\right)dx &amp; =\intop_{a}^{b}f\left(x\right)dx\\
\intop_{a}^{b}f\left(q\cdot x\right)dx &amp; =\frac{1}{q}\cdot\intop_{a}^{b}f\left(x\right)dx
\end{align*}\]</span></div>
        </div>
        <div class="layout Corollary"><span class="label">מסקנה 3.31. </span>כדי להוכיח שפונקציה מחזורית אינטגרבילית על כל תת-קטע סגור של תחום הגדרתה מספיק להוכיח שהיא אינטגרבילית על קטע סגור שהמרחק בין קצותיו הוא כאורך מחזור שלה.</div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
      </section>
    </section>
    <section class="layout Section">
      <h2 class="layout Section" id="Section_4"><span class="label">4 </span>המשפט היסודי של החשבון האינטגרלי</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_4.1"><span class="label">4.1 </span>הגדרות</h3>
        <dl>
          <div class="layout Description item">
            <dt class="layout Description">סימון:</dt>
            <dd class="layout Description"> נסמן <span class="inset Formula">\(\intop_{b}^{a}f\left(x\right)dx:=-\intop_{a}^{b}f\left(x\right)dx\)</span>.<br class="inset Newline newline"/>תהא <span class="inset Formula">\(c\in\left(a,b\right)\)</span>, א"כ מתקיים:<span class="inset Formula">\[
\intop_{a}^{b}f\left(x\right)dx+\intop_{b}^{c}f\left(x\right)dx=\intop_{a}^{c}f\left(x\right)dx
\]</span></dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> המוטיבציה לסימון תתברר בהוכחות של כמה מן המשפטים שנלמד.</dd>
          </div>
          <div class="layout Description item">
            <dt class="layout Description">סימון:</dt>
            <dd class="layout Description"> לכל פונקציה ממשית <span class="inset Formula">\(g\)</span> המוגדרת על הקטע <span class="inset Formula">\(\left[a,b\right]\)</span> נסמן:<span class="inset Formula">\[
\left.g\right|_{a}^{b}:=\left.g\left(x\right)\right|_{a}^{b}:=g\left(b\right)-g\left(a\right)
\]</span></dd>
          </div>
        </dl>
        <div class="layout Standard">יהיו <span class="inset Formula">\(a,b\in\MKreal\)</span> כך ש-<span class="inset Formula">\(a&lt;b\)</span> ותהא <span class="inset Formula">\(f\in R\left[a,b\right]\)</span>.</div>
        <div class="layout Definition"><span class="label">הגדרה 4.1. </span>תהא <span class="inset Formula">\(F:\left[a,b\right]\rightarrow\MKreal\)</span> המוגדרת ע"י (לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span><span class="inset Foot"><span class="label">31</span><span class="layout Plain Layout">כאשר <span class="inset Formula">\(\intop_{a}^{a}f\left(x\right)dx:=0\)</span>, למען האמת ניתן היה להגדיר אינטגרל רימן עבור <span class="inset Formula">\(a\leq b\)</span> (כלומר גם כש-<span class="inset Formula">\(a=b\)</span>) ואז מאותה הגדרה נקבל את המבוקש: יש רק חלוקה אחת שפרמטר החלוקה שלה הוא <span class="inset Formula">\(0\)</span> ורק סכום רימן אחד השווה ל-<span class="inset Formula">\(f\left(a\right)\cdot0=0\)</span> ולכן גם האינטגרל שווה ל-<span class="inset Formula">\(0\)</span>.</span></span>):<span class="inset Formula">\[
F\left(x\right):=\intop_{a}^{x}f\left(x\right)dx
\]</span><span class="inset Formula">\(F\)</span> נקראת <u class="bar under">הפונקציה הצוברת</u> של <span class="inset Formula">\(f\)</span> משום שכשמה כן היא: היא "צוברת" את הערכים שמקבלת <span class="inset Formula">\(f\)</span> (ראו בהקדמה האינטואיטיבית את התיאור המפורט).</div>
        <div class="layout Definition"><span class="label">הגדרה 4.2. </span><b class="series bold">קבוצה בעלת מידה <span class="inset Formula">\(0\)</span></b><br class="inset Newline newline"/>נאמר שקבוצה <span class="inset Formula">\(E\subseteq\MKreal\)</span> היא <u class="bar under">בעלת מידה <span class="inset Formula">\(0\)</span></u> אם לכל <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span> קיימת סדרת קטעים המכסה את <span class="inset Formula">\(E\)</span> כך שסכום אורכי הקטעים<span class="inset Foot"><span class="label">32</span><span class="layout Plain Layout">מדובר בסכום אינסופי, בטור.</span></span> קטן מ-<span class="inset Formula">\(\varepsilon\)</span>, כלומר:<span class="inset Formula">\[
E\subseteq\bigcup_{n=1}^{\infty}\left[a_{n},b_{n}\right],\ \sum_{n=1}^{\infty}\left(b_{n}-a_{n}\right)&lt;\varepsilon
\]</span></div>
        <div class="layout Standard">\(\:\)</div>
        <div class="layout Standard">יהיו <span class="inset Formula">\(a,b\in\MKreal\)</span> כך ש-<span class="inset Formula">\(a&lt;b\)</span> ותהא <span class="inset Formula">\(f\in R\left[a,b\right]\)</span> ותהא <span class="inset Formula">\(F\)</span> הפונקציה הצוברת של <span class="inset Formula">\(f\)</span>.</div>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_4.2"><span class="label">4.2 </span>המשפט היסודי</h3>
        <div class="layout Theorem"><span class="label">משפט 4.3. </span><span class="inset Formula">\(F\)</span> רציפה על <span class="inset Formula">\(\left[a,b\right]\)</span>.</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> נשים לב שזה אינטואיטיבי מאד: השינוי בערכי <span class="inset Formula">\(F\)</span> עבור <span class="inset Formula">\(x,y\in\left[a,b\right]\)</span> כך ש-<span class="inset Formula">\(\left|x-y\right|&lt;\delta\)</span> חסום מלעיל ע"י <span class="inset Formula">\(2M\cdot\delta\)</span> כאשר <span class="inset Formula">\(M\)</span> הוא מספר המקיים <span class="inset Formula">\(\left|f\left(x\right)\right|&lt;M\)</span> לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span>, כלומר כשמסתכלים על קטע קטן מאד השטח שמתחת לגרף של <span class="inset Formula">\(f\)</span> קטן מאד גם הוא (האמת שזה מוכיח רציפות במידה שווה ואכן היות <span class="inset Formula">\(F\)</span> רציפה על קטע סגור גורר את היותה רציפה במידה שווה עליו), ההוכחה תפרמל בדיוק את האינטואיציה הזו.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> גם משפט זה אינטואיטיבי מאד: ראינו במבוא האינטואיטיבי שקצב הצבירה של הפונקציה הצוברת הוא בדיוק הפונקציה ה"נצברת", אם זו רציפה בנקודה מסוימת זה אומר שהקצב אינו "קופץ" פתאום בנקודה זו (מה שהיה יוצר "שפיץ" בצוברת) או סתם משתולל ליד נקודה זו ולכן הצוברת גזירה בנקודה זו.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> עד כאן ראינו שכאשר <span class="inset Formula">\(f\)</span> רציפה בנקודה כלשהי אז <span class="inset Formula">\(F\)</span> גזירה באותה נקודה ונגזרתה בנקודה זו שווה לערך שמקבלת <span class="inset Formula">\(f\)</span> באותה נקודה, מה קורה כאשר <span class="inset Formula">\(f\)</span> אינטגרבילית אך אינה רציפה? הדבר תלוי בסוג של אי-הרציפות ונראה זאת בהמשך.</dd>
          </div>
        </dl>
        <div class="layout Proof"><span class="label">הוכחה. </span><span class="inset Formula">\(f\)</span> רציפה על קטע סגור ולכן חסומה, מכאן שקיים <span class="inset Formula">\(M\in\MKreal\)</span> כך שלכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> מתקיים <span class="inset Formula">\(\left|f\left(x\right)\right|&lt;M\)</span>.<br class="inset Newline newline"/>לכל <span class="inset Formula">\(h\in\left[a-b,b-a\right]\setminus\left\{ 0\right\} \)</span> ולכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> ו-<span class="inset Formula">\(h\in\MKreal\)</span> כך ש-<span class="inset Formula">\(x+h\in\left[a,b\right]\)</span> מתקיים:<span class="inset Formula">\[\begin{align*}
\left|F\left(x+h\right)-F\left(x\right)\right| &amp; =\left|\intop_{a}^{x+h}f\left(x\right)dx-\intop_{a}^{x}f\left(x\right)dx\right|=\left|-\intop_{x+h}^{a}f\left(x\right)dx-\intop_{a}^{x}f\left(x\right)dx\right|\\
 &amp; =\left|-\intop_{x+h}^{x}f\left(x\right)dx\right|=\left|\intop_{x}^{x+h}f\left(x\right)dx\right|\leq\left|\intop_{x}^{x+h}\left|f\left(x\right)\right|dx\right|\\
 &amp; \leq\left|\intop_{x}^{x+h}M\ dx\right|=\left|h\cdot M\right|=\left|h\right|\cdot M
\end{align*}\]</span>ומכאן שלכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> מתקיים <span class="inset Formula">\(\lim_{h\rightarrow0}\left|F\left(x+h\right)-F\left(x\right)\right|=0\)</span>, כלומר <span class="inset Formula">\(F\)</span> רציפה על <span class="inset Formula">\(\left[a,b\right]\)</span>.</div>
        <div class="layout Corollary"><span class="label">מסקנה 4.4. </span>מתקיים:<span class="inset Formula">\[
\lim_{\delta\rightarrow0^{+}}\intop_{a+\delta}^{b}f\left(x\right)dx=\intop_{a}^{b}f\left(x\right)dx=\lim_{\delta\rightarrow0^{+}}\intop_{a}^{b-\delta}f\left(x\right)dx
\]</span></div>
        <div class="layout Theorem"><span class="label">משפט 4.5. </span>לכל נקודה <span class="inset Formula">\(x\in\left[a,b\right]\)</span> שבה <span class="inset Formula">\(f\)</span> רציפה מתקיים <span class="inset Formula">\(F'\left(x\right)=f\left(x\right)\)</span>.</div>
        <div class="layout Proof"><span class="label">הוכחה. </span>תהא <span class="inset Formula">\(x_{0}\)</span> נקודת רציפות של <span class="inset Formula">\(f\)</span> ויהי <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span>, מרציפות של <span class="inset Formula">\(f\)</span> ב-<span class="inset Formula">\(x_{0}\)</span> נובע שקיימת <span class="inset Formula">\(0&lt;\delta\in\MKreal\)</span> כך שלכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> המקיים <span class="inset Formula">\(\left|x-x_{0}\right|&lt;\delta\)</span> מתקיים <span class="inset Formula">\(\left|f\left(x\right)-f\left(x_{0}\right)\right|&lt;\varepsilon\)</span>, תהא <span class="inset Formula">\(\delta\)</span> כנ"ל.<br class="inset Newline newline"/>א"כ לכל <span class="inset Formula">\(h\in\MKreal\)</span> כך ש-<span class="inset Formula">\(a\leq x_{0}+h\leq b\)</span> וגם <span class="inset Formula">\(0&lt;\left|h\right|&lt;\delta\)</span> מתקיים:<span class="inset Formula">\[\begin{align*}
\left|\frac{F\left(x_{0}+h\right)-F\left(x_{0}\right)}{h}-f\left(x_{0}\right)\right| &amp; =\left|\frac{1}{h}\cdot\left[\intop_{a}^{x_{0}+h}f\left(x\right)dx-\intop_{a}^{x_{0}}f\left(x\right)dx\right]-f\left(x_{0}\right)\right|\\
 &amp; =\left|\frac{1}{h}\cdot\left[\intop_{a}^{x_{0}+h}f\left(x\right)dx+\intop_{x_{0}}^{a}f\left(x\right)dx\right]-\frac{1}{h}\intop_{x_{0}}^{x_{0}+h}f\left(x_{0}\right)\right|\\
 &amp; =\left|\frac{1}{h}\cdot\intop_{x_{0}}^{x_{0}+h}f\left(x\right)dx-\frac{1}{h}\cdot\intop_{x_{0}}^{x_{0}+h}f\left(x_{0}\right)dx\right|\\
 &amp; =\left|\frac{1}{h}\cdot\intop_{x_{0}}^{x_{0}+h}f\left(x\right)-f\left(x_{0}\right)dx\right|\leq\frac{1}{\left|h\right|}\cdot\left|\intop_{x_{0}}^{x_{0}+h}\left|f\left(x\right)-f\left(x_{0}\right)\right|dx\right|\\
 &amp; &lt;\frac{1}{\left|h\right|}\cdot\left|\intop_{x_{0}}^{x_{0}+h}\varepsilon\ dx\right|=\frac{1}{\left|h\right|}\cdot\left|h\cdot\varepsilon\right|=\frac{1}{\left|h\right|}\cdot\left|h\right|\cdot\varepsilon=\varepsilon
\end{align*}\]</span><span class="inset Formula">\(\varepsilon\)</span> הנ"ל היה שרירותי ולכן הנ"ל נכון לכל <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span>, כלומר<span class="inset Foot"><span class="label">33</span><span class="layout Plain Layout">אם <span class="inset Formula">\(x_{0}=a\)</span> או <span class="inset Formula">\(x_{0}=b\)</span> אז מדובר בגבול חד-צדדי וממילא בנגזרת חד-צדדית.</span></span>:<span class="inset Formula">\[
F'\left(x_{0}\right)=\lim_{h\rightarrow0}\frac{F\left(x_{0}+h\right)-F\left(x_{0}\right)}{h}=f\left(x_{0}\right)
\]</span></div>
        <div class="layout Corollary"><span class="label">מסקנה 4.6. </span><b class="series bold"><i class="shape italic">המשפט היסודי של החשבון האינטגרלי</i></b><br class="inset Newline newline"/>לכל פונקציה רציפה קיימת פונקציה קדומה, בפרט אם <span class="inset Formula">\(f\)</span> רציפה אזי <span class="inset Formula">\(F\)</span> היא פונקציה קדומה שלה.</div>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_4.3"><span class="label">4.3 </span>מסקנות מהמשפט היסודי</h3>
        <dl>
          <div class="layout Description item">
            <dt class="layout Description">תזכורת:</dt>
            <dd class="layout Description"> לכל פונקציה ממשית <span class="inset Formula">\(g\)</span> המוגדרת על הקטע <span class="inset Formula">\(\left[a,b\right]\)</span> הגדרנו <span class="inset Formula">\(\left.g\right|_{a}^{b}:=\left.g\left(x\right)\right|_{a}^{b}=g\left(b\right)-g\left(a\right)\)</span>.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> מסקנה זו מובילה אותנו להבנה שהצוברת גזירה בנקודות אי-רציפות סליקות של הפונקציה ה"נצברת" אולם נגזרתה שווה לגבול של הנצברת בנקודה זו ולא לערך שהיא מקבלת, כמו כן בנקודות אי-רציפות מסדר ראשון הצוברת אינה גזירה (נקבל "שפיץ" בצוברת), עבור נקודות אי-רציפות מסדר שני א"א לקבוע אם הצוברת גזירה בהן ואם הנגזרת שלה שווה לערך שמקבלת ה"נצברת".</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> לאחר מסקנה זו נסכים שפונקציה יכולה להיות אינטגרבילית רימן על קטע סגור אפילו אם היא לא מוגדרת בכולו ובתנאי שמספר הנקודות בקטע שבהן היא אינה מוגדרת סופי, האינטגרל של פונקציה כזו יהיה האינטגרל של פונקציה זהה המוגדרת באתן נקודות בכל דרך שהיא.<br class="inset Newline newline"/>הסכמה זו תקפה גם באינטגרלים לא אמיתיים (להלן).</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> נשים לב שמהעובדה שהנוסחה היסודית נכונה עבור כל פונקציה אינטגרבילית רימן נובע שאם לפונקציה אינטגרבילית רימן יש קדומה אז הצוברת היא קדומה.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> למעשה, ניתן לומר הרבה יותר מזה, הזכרנו בקורס (ללא כל הוכחה) את המשפט הבא:<div class="layout Theorem_"><span class="label">משפט. </span><b class="series bold">משפט לבג</b><span class="inset Foot"><span class="label">34</span><span class="layout Plain Layout">ערך בוויקיפדיה: <a href="https://he.wikipedia.org/wiki/%D7%90%D7%A0%D7%A8%D7%99_%D7%9C%D7%91%D7%92" class="inset CommandInset href">לבג אנרי</a>.</span></span><br class="inset Newline newline"/>תהא <span class="inset Formula">\(f\in B\left[a,b\right]\)</span>, <span class="inset Formula">\(f\)</span> אינטגרבילית רימן אם"ם קבוצת נקודות אי-הרציפות של <span class="inset Formula">\(f\)</span> ב-<span class="inset Formula">\(\left[a,b\right]\)</span> היא ממידה <span class="inset Formula">\(0\)</span>.</div>
            </dd>
          </div>
        </dl>
        <div class="layout Theorem"><span class="label">משפט 4.7. </span><b class="series bold"><i class="shape italic">נוסחת לייבניץ-ניוטון - הנוסחה היסודית של החשבון האינטגרלי</i></b><br class="inset Newline newline"/>נניח ש-<span class="inset Formula">\(f\)</span> רציפה על <span class="inset Formula">\(\left[a,b\right]\)</span> ותהא <span class="inset Formula">\(\phi:\left[a,b\right]\rightarrow\MKreal\)</span> פונקציה קדומה של <span class="inset Formula">\(f\)</span>, מתקיים:<span class="inset Formula">\[
\intop_{a}^{b}f\left(x\right)dx=\phi\left(b\right)-\phi\left(a\right)=\phi\left(x\right)\mid_{a}^{b}
\]</span></div>
        <div class="layout Proof"><span class="label">הוכחה. </span>מהיות <span class="inset Formula">\(f\)</span> רציפה נובע ש-<span class="inset Formula">\(F\)</span> היא פונקציה קדומה של <span class="inset Formula">\(f\)</span> (ע"פ המשפט היסודי) ולכן קיים <span class="inset Formula">\(C\in\MKreal\)</span> כך שלכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> מתקיים <span class="inset Formula">\(F\left(x\right)+C=\phi\left(x\right)\)</span> (יהי <span class="inset Formula">\(C\)</span> כנ"ל).<span class="inset Formula">\[
\Rightarrow\intop_{a}^{b}f\left(x\right)dx=F\left(b\right)=F\left(b\right)-F\left(a\right)=\left(F\left(b\right)+C\right)-\left(F\left(a\right)+C\right)=\phi\left(b\right)-\phi\left(a\right)=\left.\phi\left(x\right)\right|_{a}^{b}
\]</span></div>
        <div class="layout Theorem"><span class="label">משפט 4.8. </span><b class="series bold">משפט הערך הממוצע האינטגרלי</b><br class="inset Newline newline"/>אם <span class="inset Formula">\(f\)</span> רציפה ב-<span class="inset Formula">\(\left[a,b\right]\)</span> אז קיים <span class="inset Formula">\(c\in\left(a,b\right)\)</span> כך שמתקיים:<span class="inset Formula">\[
f\left(c\right)=\frac{F\left(b\right)-F\left(a\right)}{b-a}=\frac{\intop_{a}^{b}f\left(x\right)dx}{b-a}
\]</span></div>
        <div class="layout Claim"><span class="label">טענה 4.9. </span>תהיינה <span class="inset Formula">\(g,h:\left[a,b\right]\rightarrow\MKreal\)</span>, אם <span class="inset Formula">\(g\in R\left[a,b\right]\)</span> ולכל <span class="inset Formula">\(x\in\left(a,b\right]\)</span> מתקיים <span class="inset Formula">\(g\left(x\right)=h\left(x\right)\)</span> אז <span class="inset Formula">\(h\in R\left[a,b\right]\)</span> ומתקיים <span class="inset Formula">\(\intop_{a}^{b}h\left(x\right)dx=\intop_{a}^{b}g\left(x\right)dx\)</span>,<br class="inset Newline newline"/>כמו כן אם <span class="inset Formula">\(f\in R\left[a,b\right]\)</span> ולכל <span class="inset Formula">\(\left[a,b\right)\)</span> מתקיים <span class="inset Formula">\(f\left(x\right)=g\left(x\right)\)</span> אז <span class="inset Formula">\(g\in R\left[a,b\right]\)</span> ומתקיים <span class="inset Formula">\(\intop_{a}^{b}g\left(x\right)dx=\intop_{a}^{b}f\left(x\right)dx\)</span>.</div>
        <div class="layout Corollary"><span class="label">מסקנה 4.10. </span><span id="corollary 3.8" class="inset CommandInset label"/>תהיינה <span class="inset Formula">\(g,h:\left[a,b\right]\rightarrow\MKreal\)</span>, אם <span class="inset Formula">\(g\in R\left[a,b\right]\)</span> וגם קיימת נקודה יחידה <span class="inset Formula">\(c\in\left[a,b\right]\)</span> כך ש-<span class="inset Formula">\(g\left(c\right)\neq f\left(c\right)\)</span><span class="inset Foot"><span class="label">35</span><span class="layout Plain Layout">כלומר לכל <span class="inset Formula">\(x\in\left[a,b\right]\setminus\left\{ c\right\} \)</span> מתקיים <span class="inset Formula">\(g\left(x\right)=h\left(x\right)\)</span>.</span></span><br class="inset Newline newline"/>אז <span class="inset Formula">\(h\in R\left[a,b\right]\)</span> ומתקיים <span class="inset Formula">\(\intop_{a}^{b}h\left(x\right)dx=\intop_{a}^{b}g\left(x\right)dx\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Corollary"><span class="label">מסקנה 4.11. </span>תהיינה <span class="inset Formula">\(h,g:\left[a,b\right]\rightarrow\MKreal\)</span>, אם <span class="inset Formula">\(g\in R\left[a,b\right]\)</span> וגם לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> מתקיים <span class="inset Formula">\(g\left(x\right)=h\left(x\right)\)</span> פרט למספר סופי של נקודות אז <span class="inset Formula">\(h\in R\left[a,b\right]\)</span> ומתקיים <span class="inset Formula">\(\intop_{a}^{b}h\left(x\right)dx=\intop_{a}^{b}g\left(x\right)dx\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 4.12. </span><b class="series bold">הרחבה של הנוסחה היסודית</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(\phi:\left[a,b\right]\rightarrow\MKreal\)</span> פונקציה רציפה על <span class="inset Formula">\(\left[a,b\right]\)</span> וגזירה ב-<span class="inset Formula">\(\left(a,b\right)\)</span> כך שלכל <span class="inset Formula">\(x\in\left(a,b\right)\)</span> מתקיים <span class="inset Formula">\(\phi'\left(x\right)=f\left(x\right)\)</span> פרט למספר סופי של נקודות, מתקיים:<span class="inset Formula">\[
\intop_{a}^{b}f\left(x\right)dx=\phi\left(b\right)-\phi\left(a\right)=\left.\phi\left(x\right)\right|_{a}^{b}
\]</span></div>
        <div class="layout Proof"><span class="label">הוכחה. </span>תהא <span class="inset Formula">\(P:=\left\{ x_{0},x_{1},\ldots,x_{n}\right\} \)</span> חלוקה של <span class="inset Formula">\(\left[a,b\right]\)</span>, ממשפט הערך הממוצע של לגראנז' נובע שלכל <span class="inset Formula">\(n\geq i\in\MKnatural\)</span> קיימת <span class="inset Formula">\(c_{i}\in\left[x_{i-1},x_{i}\right]\)</span>:<span class="inset Formula">\[
\phi\left(x_{i}\right)-\phi\left(x_{i-1}\right)=\phi'\left(c_{i}\right)\cdot\left(x_{i}-x_{i-1}\right)
\]</span>יהיו <span class="inset Formula">\(c_{1},c_{2},\ldots,c_{n}\)</span> כנ"ל ומכאן שמתקיים:<span class="inset Formula">\[
\phi\left(b\right)-\phi\left(a\right)=\phi\left(x_{n}\right)-\phi\left(x_{0}\right)=\sum_{i=1}^{n}\phi'\left(c_{i}\right)\cdot\left(x_{i}-x_{i-1}\right)
\]</span>כלומר לכל חלוקה של <span class="inset Formula">\(\left[a,b\right]\)</span> קיימת בחירת נקודות כך שסכום רימן המתאים (של <span class="inset Formula">\(\phi'\)</span>) שווה ל-<span class="inset Formula">\(\phi\left(b\right)-\phi\left(a\right)\)</span>.<br class="inset Newline newline"/>מהגדרת האינטגרל המסוים ומהמסקנה האחרונה (<a href="#corollary 3.8" class="inset CommandInset ref">3.8</a>) נובע שמתקיים:<span class="inset Formula">\[
\intop_{a}^{b}f\left(x\right)dx=\intop_{a}^{b}\phi'\left(x\right)dx=\phi\left(b\right)-\phi\left(a\right)
\]</span></div>
        <div class="layout Claim"><span class="label">טענה 4.13. </span>תהא <span class="inset Formula">\(f\in B\left[a,b\right]\)</span>, אם <span class="inset Formula">\(f\)</span> רציפה ב-<span class="inset Formula">\(\left(a,b\right]\)</span> או ב-<span class="inset Formula">\(\left[a,b\right)\)</span> אז <span class="inset Formula">\(f\in R\left[a,b\right]\)</span>.</div>
        <div class="layout Corollary"><span class="label">מסקנה 4.14. </span>תהא <span class="inset Formula">\(f\in B\left[a,b\right]\)</span>, אם <span class="inset Formula">\(f\)</span> רציפה ב-<span class="inset Formula">\(\left[a,b\right]\)</span> פרט לנקודה אחת אז <span class="inset Formula">\(f\in R\left[a,b\right]\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Corollary"><span class="label">מסקנה 4.15. </span>תהא <span class="inset Formula">\(f\in B\left[a,b\right]\)</span>, אם <span class="inset Formula">\(f\)</span> רציפה ב-<span class="inset Formula">\(\left[a,b\right]\)</span> פרט למספר סופי של נקודות אז <span class="inset Formula">\(f\in R\left[a,b\right]\)</span>.</div>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_4.4"><span class="label">4.4 </span>שיטות אינטגרציה</h3>
        <div class="layout Theorem"><span class="label">משפט 4.16. </span><b class="series bold">אינטגרציה בחלקים</b><br class="inset Newline newline"/>תהיינה <span class="inset Formula">\(f,g\)</span> גזירות על <span class="inset Formula">\(\left[a,b\right]\)</span> כך ש-<span class="inset Formula">\(f',g'\in R\left[a,b\right]\)</span>, א"כ מתקיים:<span class="inset Formula">\[\begin{align*}
\intop_{a}^{b}f'\left(x\right)\cdot g\left(x\right)dx &amp; =\left.\left(f\cdot g\right)\right|_{a}^{b}-\intop_{a}^{b}f\left(x\right)\cdot g'\left(x\right)dx\\
 &amp; =f\left(b\right)\cdot g\left(b\right)-f\left(a\right)\cdot g\left(a\right)-\intop_{a}^{b}f\left(x\right)\cdot g'\left(x\right)dx
\end{align*}\]</span></div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Theorem"><span class="label">משפט 4.17. </span><b class="series bold">הצבה</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(f:I\rightarrow\MKreal\)</span> פונקציה רציפה<span class="inset Foot"><span class="label">36</span><span class="layout Plain Layout">ניתן להחליף את הרציפות בעמידה בתנאים של הרחבת הנוסחה היסודית, הערה זו תקפה גם במסקנה ובמשפט שלהלן.</span></span> על קטע סגור <span class="inset Formula">\(I\)</span> ותהא <span class="inset Formula">\(\varphi:\left[a,b\right]\rightarrow I\)</span> פונקציה גזירה כך ש-<span class="inset Formula">\(\varphi'\)</span> אינטגרבילית רימן על <span class="inset Formula">\(\left[a,b\right]\)</span>, מתקיים:<span class="inset Formula">\[
\intop_{a}^{b}f\left(\varphi\left(x\right)\right)\cdot\varphi'\left(x\right)dx=\intop_{\varphi\left(a\right)}^{\varphi\left(b\right)}f\left(t\right)dt
\]</span></div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> האינטואיציה דומה מאד לאינטואיציה של כלל השרשרת.<br class="inset Newline newline"/>כל פונקציה ליניארית <span class="inset Formula">\(ax+b\)</span> מעוותת את הישר הממשי בצורה הבאה: היא מותחת/מכווצת אותו פי <span class="inset Formula">\(a\)</span> ומזיזה אותו ב-<span class="inset Formula">\(b\)</span> יחידות ימינה, ההזזה ב-<span class="inset Formula">\(b\)</span> אינה משנה דבר לאינטגרל אבל ברור שאם ניקח גרף של פונקציה אינטגרבילית ונכווץ אותו פי <span class="inset Formula">\(a\)</span> (שזה שקול להרכבה על פונקציה ליניארית כנ"ל) נקבל פונקציה דומה מאד שהשטח שמחת לגרף שלה קטן/גדול פי <span class="inset Formula">\(a\)</span> מזה של הפונקציה המקורית ולכן עלינו לתקן זאת ע"י הכפלת האינטגרל ב-<span class="inset Formula">\(a\)</span>. פונקציות שאינן ליניאריות מעוותות גם הן את הישר הממשי ע"פ כלל ההתאמה שלהן אך מכיוון שקרוב מספיק לנקודה גזירה <span class="inset Formula">\(x\)</span> הן מתנהגות "כמעט" כמו פונקציות ליניאריות התיקון שוב יהיה הכפלה בנגזרת כשהפעם התיקון מתבצע בכל נקודה בקטע הסגור שבו נחשב את האינטגרל.</dd>
          </div>
        </dl>
        <div class="layout Proof"><span class="label">הוכחה. </span>תהא <span class="inset Formula">\(F\)</span> פונקציה קדומה של <span class="inset Formula">\(f\)</span>, מתקיים:<span class="inset Formula">\[
\intop_{a}^{b}f\left(\varphi\left(x\right)\right)\cdot\varphi'\left(x\right)dx=\left(F\circ\varphi\right)\left(b\right)-\left(F\circ\varphi\right)\left(a\right)=F\left(\varphi\left(b\right)\right)-F\left(\varphi\left(a\right)\right)=\intop_{\varphi\left(a\right)}^{\varphi\left(b\right)}f\left(t\right)dt
\]</span></div>
        <div class="layout Corollary"><span class="label">מסקנה 4.18. </span>תהא <span class="inset Formula">\(f:\left[a,b\right]\rightarrow\MKreal\)</span> פונקציה רציפה ותהיינה <span class="inset Formula">\(\varphi,\psi:\left[\alpha,\beta\right]\rightarrow\left[a,b\right]\)</span> פונקציות גזירות.<br class="inset Newline newline"/>תהא <span class="inset Formula">\(g:\left[\alpha,\beta\right]\rightarrow\MKreal\)</span> פונקציה המוגדרת ע"י (לכל <span class="inset Formula">\(x\in\left[\alpha,\beta\right]\)</span>):<span class="inset Formula">\[
g\left(x\right)=\intop_{\varphi\left(x\right)}^{\psi\left(x\right)}f\left(t\right)dt
\]</span><span class="inset Formula">\(g\)</span> גזירה ולכל <span class="inset Formula">\(x\in\left[\alpha,\beta\right]\)</span> מתקיים:<span class="inset Formula">\[
g'\left(x\right)=f\left(\psi\left(x\right)\right)\cdot\psi'\left(x\right)-f\left(\varphi\left(x\right)\right)\cdot\varphi'\left(x\right)
\]</span></div>
        <div class="layout Theorem"><span class="label">משפט 4.19. </span><b class="series bold">הצבה הפוכה</b><br class="inset Newline newline"/>תהיינה <span class="inset Formula">\(f:\left[a,b\right]\rightarrow\MKreal\)</span> פונקציה רציפה, ותהא <span class="inset Formula">\(\varphi:\left[\alpha,\beta\right]\rightarrow\left[a,b\right]\)</span> פונקציה הפיכה וגזירה כך ש-<span class="inset Formula">\(\varphi'\)</span> אינטגרבילית רימן על <span class="inset Formula">\(\left[\alpha,\beta\right]\)</span>, מהרציפות וההפיכות של <span class="inset Formula">\(\varphi\)</span> נובע שהיא מונוטונית ממש.<ol>
            <li class="layout Enumerate">אם <span class="inset Formula">\(\varphi\)</span> עולה ממש אז:<span class="inset Formula">\[
\intop_{a}^{b}f\left(t\right)dt=\intop_{\varphi^{-1}\left({\color{blue}a}\right)}^{\varphi^{-1}\left({\color{red}b}\right)}f\left(\varphi\left(x\right)\right)\cdot\varphi'\left(x\right)dx
\]</span></li>
            <li class="layout Enumerate">אם <span class="inset Formula">\(\varphi\)</span> יורדת ממש אז:<span class="inset Formula">\[
\intop_{a}^{b}f\left(t\right)dt=\intop_{\varphi^{-1}\left({\color{red}b}\right)}^{\varphi^{-1}\left({\color{blue}a}\right)}f\left(\varphi\left(x\right)\right)\cdot\varphi'\left(x\right)dx
\]</span></li>
          </ol>
        </div>
        <div class="layout Proof"><span class="label">הוכחה. </span>מהיות <span class="inset Formula">\(\varphi\)</span> הפיכה ורציפה נובע שתמונתה היא הקטע הסגור שבין <span class="inset Formula">\(\varphi\left(\alpha\right)\)</span> ו-<span class="inset Formula">\(\varphi\left(\beta\right)\)</span>.<ol>
            <li class="layout Enumerate">אם <span class="inset Formula">\(\varphi\)</span> עולה ממש אז <span class="inset Formula">\(\varphi\left(\alpha\right)=a\)</span> ו-<span class="inset Formula">\(\varphi\left(\beta\right)=b\)</span> ולכן ממשפט ההצבה נובע שמתקיים:<span class="inset Formula">\[
\intop_{a}^{b}f\left(t\right)dt=\intop_{\varphi\left(\alpha\right)}^{\varphi\left(\beta\right)}f\left(t\right)dt=\intop_{\alpha}^{\beta}f\left(\varphi\left(x\right)\right)\cdot\varphi'\left(x\right)dx=\intop_{\varphi^{-1}\left(a\right)}^{\varphi^{-1}\left(b\right)}f\left(\varphi\left(x\right)\right)\cdot\varphi'\left(x\right)dx
\]</span></li>
            <li class="layout Enumerate">אם <span class="inset Formula">\(\varphi\)</span> יורדת ממש ממש אז <span class="inset Formula">\(\varphi\left(\alpha\right)=b\)</span> ו-<span class="inset Formula">\(\varphi\left(\beta\right)=a\)</span> ולכן ממשפט ההצבה נובע שמתקיים:<span class="inset Formula">\[
\intop_{a}^{b}f\left(t\right)dt=\intop_{\varphi\left(\alpha\right)}^{\varphi\left(\beta\right)}f\left(t\right)dt=\intop_{\alpha}^{\beta}f\left(\varphi\left(x\right)\right)\cdot\varphi'\left(x\right)dx=\intop_{\varphi^{-1}\left(b\right)}^{\varphi^{-1}\left(a\right)}f\left(\varphi\left(x\right)\right)\cdot\varphi'\left(x\right)dx
\]</span></li>
          </ol>
        </div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
      </section>
    </section>
    <section class="layout Section">
      <h2 class="layout Section" id="Section_5"><span class="label">5 </span>אינטגרלים מסוימים לא אמיתיים</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_5.1"><span class="label">5.1 </span>הגדרות</h3>
        <div class="layout Definition"><span class="label">הגדרה 5.1. </span><b class="series bold">אינטגרביליות על קרן</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(f\)</span> פונקציה ויהי <span class="inset Formula">\(a\in\MKreal\)</span>.<ul>
            <li class="layout Itemize">נאמר ש-<span class="inset Formula">\(f\)</span><u class="bar under">אינטגרבילית על הקרן</u><span class="inset Formula">\(\left[a,\infty\right)\)</span> אם <span class="inset Formula">\(f\)</span> אינטגרבילית על כל תת-קטע סגור של <span class="inset Formula">\(\left[a,\infty\right)\)</span> ובנוסף קיים הגבול:<span class="inset Formula">\[
\lim_{b\rightarrow\infty}\intop_{a}^{b}f\left(x\right)dx
\]</span>במקרה כזה נסמן:<span class="inset Formula">\[
\intop_{a}^{\infty}f\left(x\right)dx:=\lim_{b\rightarrow\infty}\intop_{a}^{b}f\left(x\right)dx
\]</span></li>
            <li class="layout Itemize">נאמר ש-<span class="inset Formula">\(f\)</span><u class="bar under">אינטגרבילית על הקרן</u><span class="inset Formula">\(\left(-\infty,b\right]\)</span> אם <span class="inset Formula">\(f\)</span> אינטגרבילית על כל תת-קטע סגור של <span class="inset Formula">\(\left(-\infty,b\right]\)</span> ובנוסף קיים הגבול:<span class="inset Formula">\[
\lim_{a\rightarrow-\infty}\intop_{b}^{b}f\left(x\right)dx
\]</span>במקרה כזה נסמן:<span class="inset Formula">\[
\intop_{-\infty}^{a}f\left(x\right)dx:=\lim_{a\rightarrow-\infty}\intop_{a}^{b}f\left(x\right)dx
\]</span></li>
          </ul>
        </div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Lemma"><span class="label">למה 5.2. </span>תהא <span class="inset Formula">\(f\)</span> פונקציה. אם קיים <span class="inset Formula">\(a\in\MKreal\)</span> כך שקיימים האינטגרלים:<span class="inset Formula">\[
\intop_{a}^{\infty}f\left(x\right)dx,\ \intop_{-\infty}^{a}f\left(x\right)dx
\]</span>אז לכל <span class="inset Formula">\(c\in\MKreal\)</span> קיימים האינטגרלים:<span class="inset Formula">\[
\intop_{c}^{\infty}f\left(x\right)dx,\ \intop_{-\infty}^{c}f\left(x\right)dx
\]</span>ומתקיים:<span class="inset Formula">\[
\intop_{-\infty}^{a}f\left(x\right)dx+\intop_{a}^{\infty}f\left(x\right)dx=\intop_{-\infty}^{c}f\left(x\right)dx+\intop_{c}^{\infty}f\left(x\right)dx
\]</span></div>
        <div class="layout Definition"><span class="label">הגדרה 5.3. </span><b class="series bold">אינטגרביליות על כל הישר</b><br class="inset Newline newline"/>נאמר שפונקציה <span class="inset Formula">\(f\)</span> אינטגרבילית על כל הישר אם קיים <span class="inset Formula">\(a\in\MKreal\)</span> כך שקיימים האינטגרלים:<span class="inset Formula">\[
\intop_{-\infty}^{a}f\left(x\right)dx,\ \intop_{a}^{\infty}f\left(x\right)dx
\]</span>ובמקרה כזה נסמן:<span class="inset Formula">\[
\intop_{-\infty}^{\infty}f\left(x\right)dx:=\intop_{-\infty}^{a}f\left(x\right)dx+\intop_{a}^{\infty}f\left(x\right)dx
\]</span></div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">הערה:</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/> במקרה של אינטגרלים לא אמיתיים נאמר גם שהאינטגרל מתכנס/מתבדר אם הגבול המתאים קיים/לא קיים.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> כמובן שייתכן גם אינטגרל לא אמיתי המשלב בין הסוגים: הפונקציה לא חסומה ומוגדרת על קרן.</dd>
          </div>
        </dl>
        <div class="layout Lemma"><span class="label">למה 5.4. </span>תהא <span class="inset Formula">\(f\)</span> פונקציה, יהי <span class="inset Formula">\(a\in\MKreal\)</span> ונניח ש-<span class="inset Formula">\(f\)</span> מקיימת <span class="inset Formula">\(f\in R\left[a,b\right]\)</span> לכל <span class="inset Formula">\(b\in\MKreal\)</span>;<br class="inset Newline newline"/>אם האינטגרל <span class="inset Formula">\(\intop_{a}^{\infty}\left|f\left(x\right)\right|dx\)</span><span class="inset Foot"><span class="label">37</span><span class="layout Plain Layout">ראינו ש-<span class="inset Formula">\(\left|f\right|\)</span> אינטגרבילית רימן על כל קטע סגור ש-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן עליו.</span></span> מתכנס אז גם האינטגרל <span class="inset Formula">\(\intop_{a}^{\infty}f\left(x\right)dx\)</span> מתכנס,<br class="inset Newline newline"/>ואם האינטגרל <span class="inset Formula">\(\intop_{-\infty}^{a}\left|f\left(x\right)\right|dx\)</span> מתכנס אז גם האינטגרל <span class="inset Formula">\(\intop_{-\infty}^{a}f\left(x\right)dx\)</span>.</div>
        <div class="layout Definition"><span class="label">הגדרה 5.5. </span><b class="series bold">התכנסות בהחלט</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(f\)</span> פונקציה ויהי <span class="inset Formula">\(a\in\MKreal\)</span>.<ol>
            <li class="layout Enumerate">נאמר שהאינטגרל <span class="inset Formula">\(\intop_{a}^{\infty}f\left(x\right)dx\)</span><u class="bar under">מתכנס בהחלט</u> אם האינטגרל <span class="inset Formula">\(\intop_{a}^{\infty}\left|f\left(x\right)\right|dx\)</span> מתכנס, כמו כן נאמר שהאינטגרל <span class="inset Formula">\(\intop_{-\infty}^{a}f\left(x\right)dx\)</span><u class="bar under">מתכנס בהחלט</u> אם האינטגרל <span class="inset Formula">\(\intop_{-\infty}^{a}\left|f\left(x\right)\right|dx\)</span> מתכנס.</li>
            <li class="layout Enumerate">אם <span class="inset Formula">\(\intop_{a}^{\infty}f\left(x\right)dx\)</span> מתכנס אך אינו מתכנס בהחלט נאמר שהוא <u class="bar under">מתכנס בתנאי</u>, כמו כן אם האינטגרל <span class="inset Formula">\(\intop_{-\infty}^{a}f\left(x\right)dx\)</span> מתכנס אך אינו מתכנס בהחלט נאמר שהוא <u class="bar under">מתכנס בתנאי</u>.</li>
          </ol>
        </div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Standard">יהיו <span class="inset Formula">\(a,b\in\MKreal\)</span> כך ש-<span class="inset Formula">\(a&lt;b\)</span> ותהא <span class="inset Formula">\(f:\left[a,b\right]\rightarrow\MKreal\)</span>.</div>
        <div class="layout Definition"><span class="label">הגדרה 5.6. </span><b class="series bold">קבוצת נקודות מיוחדות</b><br class="inset Newline newline"/>נאמר שקבוצה <span class="inset Formula">\(\left\{ c_{1},c_{2},\ldots,c_{n}\right\} \subseteq\left[a,b\right]\)</span> היא <u class="bar under">קבוצת נקודות מיוחדות</u> של <span class="inset Formula">\(f\)</span> אם <span class="inset Formula">\(f\)</span> אינטגרבילית רימן בכל תת-קטע סגור של <span class="inset Formula">\(\left[a,b\right]\)</span> שאינו מכיל אף אחד מאיברי הקבוצה ובנוסף <span class="inset Formula">\(f\)</span> אינה חסומה בכל סביבה של <span class="inset Formula">\(c_{i}\)</span> (לכל <span class="inset Formula">\(n\geq\in\MKnatural\)</span>).</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 5.7. </span><b class="series bold">אינטגרל של פונקציה לא חסומה</b><br class="inset Newline newline"/>נניח ש-<span class="inset Formula">\(a\)</span> היא נקודה מיוחדת יחידה של <span class="inset Formula">\(f\)</span>, נאמר שהאינטגרל (הלא אמיתי) <span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\)</span> מתכנס אם הגבול<br class="inset Newline newline"/><span class="inset Formula">\(\lim_{\delta\rightarrow0^{+}}\intop_{a+\delta}^{b}f\left(x\right)dx\)</span> קיים ונסמן:<span class="inset Formula">\[
\intop_{a}^{b}f\left(x\right)dx:=\lim_{\delta\rightarrow0^{+}}\intop_{a+\delta}^{b}f\left(x\right)dx
\]</span>כמו כן אם <span class="inset Formula">\(b\)</span> היא נקודה מיוחדת יחידה של <span class="inset Formula">\(f\)</span> נאמר שהאינטגרל <span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\)</span> מתכנס אם הגבול <span class="inset Formula">\(\lim_{\delta\rightarrow0^{+}}\intop_{a}^{b-\delta}f\left(x\right)dx\)</span> קיים ונסמן:<span class="inset Formula">\[
\intop_{a}^{b}f\left(x\right)dx:=\lim_{\delta\rightarrow0^{+}}\intop_{a}^{b-\delta}f\left(x\right)dx
\]</span>אם <span class="inset Formula">\(a\)</span> ו-<span class="inset Formula">\(b\)</span> הן הנקודות המיוחדות היחידות של <span class="inset Formula">\(f\)</span> אז נאמר ש-<span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\)</span>מתכנס אם קיים <span class="inset Formula">\(d\in\left(a,b\right)\)</span> כך שהאינטגרלים <span class="inset Formula">\(\intop_{d}^{b}f\left(x\right)dx\)</span> ו-<span class="inset Formula">\(\intop_{a}^{d}f\left(x\right)dx\)</span> מתכנסים<span class="inset Foot"><span class="label">38</span><span class="layout Plain Layout">אם קיים <span class="inset Formula">\(d\)</span> אחד כזה אז כל<span class="inset Formula">\(d\in\left(a,b\right)\)</span> מקיים זאת.</span></span> ונסמן:<span class="inset Formula">\[
\intop_{a}^{b}f\left(x\right)dx:=\intop_{a}^{d}f\left(x\right)dx+\intop_{d}^{b}f\left(x\right)dx
\]</span>אם <span class="inset Formula">\(\left\{ c_{1},c_{2},\ldots,c_{n}\right\} \)</span> היא קבוצת נקודות מיוחדות של <span class="inset Formula">\(f\)</span> המסודרת בסדר עולה והאינטגרלים <span class="inset Formula">\(\intop_{a}^{c_{1}}f\left(x\right)dx\)</span>, <span class="inset Formula">\(\intop_{c_{i}}^{c_{i}+1}f\left(x\right)dx\)</span> ו-<span class="inset Formula">\(\intop_{c_{n}}^{b}f\left(x\right)dx\)</span> מתכנסים לכל <span class="inset Formula">\(n-1\geq i\in\MKnatural\)</span> אז נאמר שהאינטגרל (הלא אמיתי) <span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\)</span> מתכנס ונסמן:<span class="inset Formula">\[
\intop_{a}^{b}f\left(x\right)dx:=\intop_{a}^{c_{1}}f\left(x\right)dx+\sum_{i=1}^{n-1}\intop_{c_{i}}^{c_{i}+1}f\left(x\right)dx+\intop_{c_{n}}^{b}f\left(x\right)dx
\]</span></div>
        <div class="layout Lemma"><span class="label">למה 5.8. </span>נניח של-<span class="inset Formula">\(f\)</span> יש מספר סופי של נקודות מיוחדות ב-<span class="inset Formula">\(\left[a,b\right]\)</span>, אם האינטגרל <span class="inset Formula">\(\intop_{a}^{b}\left|f\left(x\right)\right|dx\)</span><span class="inset Foot"><span class="label">39</span><span class="layout Plain Layout">ראינו ש-<span class="inset Formula">\(\left|f\right|\)</span> אינטגרבילית רימן על כל קטע סגור ש-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן עליו.</span></span> מתכנס אז גם האינטגרל <span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\)</span> מתכנס.</div>
        <div class="layout Definition"><span class="label">הגדרה 5.9. </span><b class="series bold">התכנסות בהחלט</b><br class="inset Newline newline"/>נניח של-<span class="inset Formula">\(f\)</span> יש מספר סופי של נקודות מיוחדות ב-<span class="inset Formula">\(\left[a,b\right]\)</span>.<ol>
            <li class="layout Enumerate">נאמר שהאינטגרל <span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\)</span><u class="bar under">מתכנס בהחלט</u> אם האינטגרל <span class="inset Formula">\(\intop_{a}^{b}\left|f\left(x\right)\right|dx\)</span> מתכנס.</li>
            <li class="layout Enumerate">אם <span class="inset Formula">\(\intop_{a}^{b}f\left(x\right)dx\)</span> מתכנס אך אינו מתכנס בהחלט נאמר שהוא <u class="bar under">מתכנס בתנאי</u>.</li>
          </ol>
        </div>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_5.2"><span class="label">5.2 </span>אינטגרל על קבוצה לא חסומה</h3>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> לאורך הפרק נשים לב לדמיון בין התכנסות של אינטגרל על קרן להתכנסות של טור; ישנם גם הבדלים בין התכנסות של טורים לזו של אינטגרלים על קרן, ההבדל המרכזי הוא שהאיבר הכללי של טור מוכרח להתכנס ל-<span class="inset Formula">\(0\)</span> אם הטור מתכנס אך לא כן עבור אינטגרלים, הפונקציה אפילו לא חייבת להיות חסומה כדי שהאינטגרל יתכנס.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> כאן היה השלב שבו נמאס להוכיח את תנאי קושי פעם אחר פעם וכתבתי את הקובץ "<a href="https://drive.google.com/file/d/1U4EIUhknFXcQ89SEEHx8crvH2xU2gli9/view?usp=drive_link" class="inset CommandInset href">גבול לקיום כללי קושי תנאי</a>".</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> ניתן להסתכל על כל סדרה <span class="inset Formula">\(\left(a_{n}\right)_{n=1}^{\infty}\)</span> כפונקציית מדרגות המוגדרת ע"י <span class="inset Formula">\(g\left(x\right):=a_{n}\)</span> לכל <span class="inset Formula">\(n\in\MKnatural\)</span> ולכל <span class="inset Formula">\(x\in\left[n-1,n\right]\)</span>, כך סדרה חשבונית דומה מאד לפונקציה ליניארית וסדרה הנדסית דומה מאד לפונקציה מעריכית; מנקודת מבט זו הטור <span class="inset Formula">\(\sum_{n=1}^{\infty}a_{n}\)</span> בעצם סוכם את השטחים שמתחת למדרגות בגרף של <span class="inset Formula">\(g\)</span>, כלומר ישנה אנלוגיה בין סדרה והטור שלה לבין פונקציה והאינטגרל שלה. במשפט אנחנו רואים את הכיוון ההפוך: לקחנו פונקציה ובנינו ממנה סדרה, הבעיה היא שבתהליך הזה ישנה שרירותיות מסוימת בבחירה של הנקודות בגרף של <span class="inset Formula">\(f\)</span> שיהיו איברי הסדרה; כלומר מסדרה אפשר ליצור פונקציה אחת בדיוק שתהיה מקבילה לה אך קיימות פונקציות רבות שהסדרה המקבילה להן זהה. העובדה הזו בעצם מאפשרת לפונקציה "להשתולל" בין הנקודות הטבעיות ולהיות "יפה" רק בהן ואז הטור והאינטגרל לא בהכרח יתכנסו ויתבדרו ביחד, זו הסיבה לכך שהמשפט דורש את המונוטוניות של <span class="inset Formula">\(f\)</span>: המונוטוניות של <span class="inset Formula">\(f\)</span> לא תאפשר לה "להשתולל" ויתר על כן ניתן יהיה "לכלוא" את השטח שמתחת לגרף שלה בין הטור <span class="inset Formula">\(\sum_{n=0}^{\infty}f\left(a+n\right)\)</span> לטור <span class="inset Formula">\(\sum_{n=0}^{\infty}f\left(a+n+1\right)\)</span>, הוכחת המשפט תפרמל בדיוק את הטיעון הזה.</dd>
          </div>
        </dl>
        <div class="layout Standard">תהיינה <span class="inset Formula">\(f,g:\MKreal\rightarrow\MKreal\)</span> ויהי <span class="inset Formula">\(a\in\MKreal\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 5.10. </span><b class="series bold">אריתמטיקה של אינטגרלים לא אמיתיים</b><ol>
            <li class="layout Enumerate">אם <span class="inset Formula">\(f\)</span> אינטגרבילית על <span class="inset Formula">\(\left[a,\infty\right)\)</span> אז לכל <span class="inset Formula">\(c\in\MKreal\)</span> מתקיים:<span class="inset Formula">\[
\intop_{a}^{\infty}c\cdot f\left(x\right)dx=c\cdot\intop_{a}^{\infty}f\left(x\right)dx
\]</span>ואם <span class="inset Formula">\(f\)</span> אינטגרבילית על <span class="inset Formula">\(\left(-\infty,a\right]\)</span> אז לכל <span class="inset Formula">\(c\in\MKreal\)</span> מתקיים:<span class="inset Formula">\[
\intop_{-\infty}^{a}c\cdot f\left(x\right)dx=c\cdot\intop_{-\infty}^{a}f\left(x\right)dx
\]</span></li>
            <li class="layout Enumerate">אם <span class="inset Formula">\(f\)</span> ו-<span class="inset Formula">\(g\)</span> אינטגרביליות על <span class="inset Formula">\(\left[a,\infty\right)\)</span> אז:<span class="inset Formula">\[
\intop_{a}^{\infty}f\left(x\right)\pm g\left(x\right)dx=\intop_{a}^{\infty}f\left(x\right)dx\pm\intop_{a}^{\infty}g\left(x\right)dx
\]</span>ואם <span class="inset Formula">\(f\)</span> ו-<span class="inset Formula">\(g\)</span> אינטגרביליות על <span class="inset Formula">\(\left(-\infty,a\right]\)</span> אז:<span class="inset Formula">\[
\intop_{-\infty}^{a}f\left(x\right)\pm g\left(x\right)dx=\intop_{-\infty}^{a}f\left(x\right)dx\pm\intop_{-\infty}^{a}g\left(x\right)dx
\]</span></li>
            <li class="layout Enumerate">אם <span class="inset Formula">\(f\)</span> אינטגרבילית על <span class="inset Formula">\(\left[a,\infty\right)\)</span> אז <span class="inset Formula">\(f\)</span> אינטגרבילית על <span class="inset Formula">\(\left[c,\infty\right)\)</span> לכל <span class="inset Formula">\(c\in\left[a,\infty\right)\)</span> ובנוסף מתקיים:<span class="inset Formula">\[
\intop_{a}^{\infty}f\left(x\right)dx=\intop_{a}^{c}f\left(x\right)dx+\intop_{c}^{\infty}f\left(x\right)dx
\]</span>ואם <span class="inset Formula">\(f\)</span> אינטגרבילית על <span class="inset Formula">\(\left(-\infty,a\right]\)</span> אז <span class="inset Formula">\(f\)</span> אינטגרבילית על <span class="inset Formula">\(\left(-\infty,c\right]\)</span> לכל <span class="inset Formula">\(c\in\left(-\infty,a\right]\)</span> ובנוסף מתקיים:<span class="inset Formula">\[
\intop_{-\infty}^{a}f\left(x\right)dx=\intop_{-\infty}^{c}f\left(x\right)dx+\intop_{c}^{a}f\left(x\right)dx
\]</span></li>
          </ol>
        </div>

        <div class="layout Theorem"><span class="label">משפט 5.11. </span><span id="theorem 4.2" class="inset CommandInset label"/><b class="series bold">תנאי קושי להתכנסות של אינטגרל לא אמיתי על קרן</b><ul>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left[a,\infty\right)\)</span>.<br class="inset Newline newline"/>תנאי הכרחי ומספיק לכך ש-<span class="inset Formula">\(f\)</span> אינטגרבילית על <span class="inset Formula">\(\left[a,\infty\right)\)</span> הוא שלכל <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span> קיים <span class="inset Formula">\(M\in\MKreal\)</span> כך שלכל <span class="inset Formula">\(M&lt;b_{1},b_{2}\in\MKreal\)</span> מתקיים:<span class="inset Formula">\[
\left|\intop_{b_{1}}^{b_{2}}f\left(x\right)dx\right|&lt;\varepsilon
\]</span></li>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(f\)</span> אינטגרבילית רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left(-\infty,a\right]\)</span>.<br class="inset Newline newline"/>תנאי הכרחי ומספיק לכך ש-<span class="inset Formula">\(f\)</span> אינטגרבילית על <span class="inset Formula">\(\left(-\infty,a\right]\)</span> הוא שלכל <span class="inset Formula">\(0&lt;\varepsilon\in\MKreal\)</span> קיים <span class="inset Formula">\(m\in\MKreal\)</span> כך שלכל <span class="inset Formula">\(m&gt;b_{1},b_{2}\in\MKreal\)</span> מתקיים:<span class="inset Formula">\[
\left|\intop_{b_{1}}^{b_{2}}f\left(x\right)dx\right|&lt;\varepsilon
\]</span></li>
          </ul>

        <div class="layout Theorem"><span class="label">משפט 5.12. </span><span id="theorem 4.3" class="inset CommandInset label"/><b class="series bold">מבחן ההשוואה</b><ul>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(f\)</span> ו-<span class="inset Formula">\(g\)</span> אינטגרביליות רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left[a,\infty\right)\)</span> ושקיימים <span class="inset Formula">\(0&lt;c\in\MKreal\)</span> ו-<span class="inset Formula">\(b\in\left[a,\infty\right)\)</span> כך שלכל <span class="inset Formula">\(x\in\left[b,\infty\right)\)</span> מתקיים <span class="inset Formula">\(0\leq f\left(x\right)\leq c\cdot g\left(x\right)\)</span>, מתקיים:<ol>
                <li class="layout Enumerate">אם <span class="inset Formula">\(\intop_{a}^{\infty}g\left(x\right)dx\)</span> מתכנס אז גם <span class="inset Formula">\(\intop_{a}^{\infty}f\left(x\right)dx\)</span> מתכנס.</li>
                <li class="layout Enumerate">אם <span class="inset Formula">\(\intop_{a}^{\infty}f\left(x\right)dx\)</span> מתבדר אז גם <span class="inset Formula">\(\intop_{a}^{\infty}g\left(x\right)dx\)</span> מתבדר.</li>
              </ol>
            </li>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(f\)</span> ו-<span class="inset Formula">\(g\)</span> אינטגרביליות רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left(-\infty,a\right]\)</span> ושקיימים <span class="inset Formula">\(0&lt;c\in\MKreal\)</span> ו-<span class="inset Formula">\(b\in\left(-\infty,a\right]\)</span> כך שלכל <span class="inset Formula">\(x\in\left(-\infty,b\right]\)</span> מתקיים <span class="inset Formula">\(0\leq f\left(x\right)\leq c\cdot g\left(x\right)\)</span>, מתקיים:<ol>
                <li class="layout Enumerate">אם <span class="inset Formula">\(\intop_{-\infty}^{a}g\left(x\right)dx\)</span> מתכנס אז גם <span class="inset Formula">\(\intop_{-\infty}^{a}f\left(x\right)dx\)</span> מתכנס.</li>
                <li class="layout Enumerate">אם <span class="inset Formula">\(\intop_{-\infty}^{a}f\left(x\right)dx\)</span> מתבדר אז גם <span class="inset Formula">\(\intop_{-\infty}^{a}g\left(x\right)dx\)</span> מתבדר.</li>

            </li>
          </ul>

        <div class="layout Theorem"><span class="label">משפט 5.13. </span><span id="theorem 4.4" class="inset CommandInset label"/><b class="series bold">מבחן ההשוואה הגבולי</b><ul>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(f\)</span> ו-<span class="inset Formula">\(g\)</span> אינטגרביליות רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left[a,\infty\right)\)</span> ושקיים <span class="inset Formula">\(b\in\left[a,\infty\right)\)</span> כך שלכל <span class="inset Formula">\(x\in\left[b,\infty\right)\)</span> מתקיים <span class="inset Formula">\(0&lt;g\left(x\right)\)</span> ו-<span class="inset Formula">\(0\leq f\left(x\right)\)</span>.<br class="inset Newline newline"/>אם הגבול <span class="inset Formula">\(\lim_{x\rightarrow\infty}\frac{f\left(x\right)}{g\left(x\right)}\)</span> קיים וחיובי אז האינטגרלים <span class="inset Formula">\(\intop_{a}^{\infty}f\left(x\right)dx\)</span> ו-<span class="inset Formula">\(\intop_{a}^{\infty}g\left(x\right)dx\)</span> מתכנסים ומתבדרים ביחד.</li>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(f\)</span> ו-<span class="inset Formula">\(g\)</span> אינטגרביליות רימן על כל תת-קטע סגור של <span class="inset Formula">\(\left(-\infty,a\right]\)</span> ושקיים <span class="inset Formula">\(b\in\left(-\infty,a\right]\)</span> כך שלכל <span class="inset Formula">\(x\in\left(-\infty,b\right]\)</span> מתקיים <span class="inset Formula">\(0&lt;g\left(x\right)\)</span> ו-<span class="inset Formula">\(0\leq f\left(x\right)\)</span>.<br class="inset Newline newline"/>אם הגבול <span class="inset Formula">\(\lim_{x\rightarrow-\infty}\frac{f\left(x\right)}{g\left(x\right)}\)</span> קיים וחיובי אז האינטגרלים <span class="inset Formula">\(\intop_{-\infty}^{a}f\left(x\right)dx\)</span> ו-<span class="inset Formula">\(\intop_{-\infty}^{a}g\left(x\right)dx\)</span> מתכנסים ומתבדרים ביחד.</li>
          </ul>
