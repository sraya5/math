<div class="layout Standard"><span class="inset CommandInset include" data-filename="C:\Users\sraya\AppData\Roaming\LyX2.4\macros\MKmacros.lyx">
        <div class="include body">
          <div class="layout Standard"><span class="inset Note Note"><span class="layout Plain Layout">\(\:\)</span><span class="layout Plain Layout"><b class="series bold"><span class="size larger">עקרונות מנחים לכתיבת פקודות<span class="family roman"><span class="shape up"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span><span class="lang english">Macros</span><span class="lang hebrew"> </span></span></b></span><span class="layout Plain Layout"><span class="inset CommandInset line">LatexCommand ruleoffset "0.5ex"width "100col%"height "1pt"</span></span><ol>
                <li class="layout Enumerate">כל פקודה תתחיל ב-<b class="series bold"><span class="color red"><span class="lang english">MK<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"><span class="lang hebrew"> </span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></b>גדולות ע<span class="inset Quotes erd"/>ש מיכאל קלי (<b class="series bold"><span class="color red"><span class="lang english">M</span></span></b>ichael <b class="series bold"><span class="color red">K</span></b>ali<span class="lang hebrew">), וזאת משתי סיבות:</span><ol>
                    <li class="layout Enumerate">כדי שבטבלת הקיצורים שבתוך \SpecialChar LyX תופענה כל הפקודות זו לצד זו.</li>
                    <li class="layout Enumerate">הבחירה דווקא באותיות גדולות נועדה לוודא שהפקודות אינן מתנגשות עם פקודות \SpecialChar LaTeX מקוריות.</li>
                  </ol>

    <section class="layout Section">
      <h2 class="layout Section" id="Section_1"><span class="label">1 </span>אינטגרביליות על מלבן</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_1.1"><span class="label">1.1 </span>הגדרות</h3>
        <div class="layout Definition"><span class="label">הגדרה 1.1. </span><b class="series bold">מלבן:</b><div class="layout Standard"><u class="bar under">מלבן</u> ב-<span class="inset Formula">\(\MKreal^{2}\)</span> הוא קבוצה מהצורה <span class="inset Formula">\(\left[a,b\right]\times\left[c,d\right]\)</span> כאשר <span class="inset Formula">\(a,b,c,d\in\MKreal\)</span>; הצגה ברורה יותר של הקבוצה היא:<span class="inset Formula">\[
R:=\left[a,b\right]\times\left[c,d\right]=\left\{ \begin{array}{c|c}
\begin{pmatrix}x\\
y
\end{pmatrix}\in\MKreal^{2} &amp; a\leq x\leq b,\ c\leq y\leq d\end{array}\right\} 
\]</span>את השטח של המלבן (שהוא <span class="inset Formula">\(\left(b-a\right)\left(c-d\right)\)</span>) נסמן ב-<span class="inset Formula">\(A\left(R\right)\)</span>.</div>
        </div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 1.2. </span><b class="series bold">שריג</b><br class="inset Newline newline"/>יהי <span class="inset Formula">\(R\subseteq\MKreal^{2}\)</span> מלבן, <u class="bar under">שריג</u> על <span class="inset Formula">\(R\)</span> הוא זוג סדור <span class="inset Formula">\(P:=\left(P_{1},P_{2}\right)\)</span> כאשר <span class="inset Formula">\(P_{1}\)</span> היא חלוקה של <span class="inset Formula">\(\left[a,b\right]\)</span> ו-<span class="inset Formula">\(P_{2}\)</span> היא חלוקה של <span class="inset Formula">\(\left[c,d\right]\)</span>.</div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> שריג הוא המושג המקביל של חלוקה מאינפי'<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="numeric on">2</span>.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> למת החתכים נותנת תנאים שקולים לקיום השוויון.</dd>
          </div>
        </dl>
        <div class="layout Definition"><span class="label">הגדרה 1.3. </span><b class="series bold">עידון של שריג</b><br class="inset Newline newline"/>יהי <span class="inset Formula">\(R\)</span> מלבן, עידון של <u class="bar under">שריג</u><span class="inset Formula">\(P:=\left(P_{1},P_{2}\right)\)</span> הוא כל שריג <span class="inset Formula">\(Q:=\left(Q_{1},Q_{2}\right)\)</span> על <span class="inset Formula">\(R\)</span> המקיים <span class="inset Formula">\(Q_{1}\subseteq P_{1}\)</span> ו-<span class="inset Formula">\(Q_{2}\subseteq P_{2}\)</span>.</div>
        <div class="layout Standard">יהי <span class="inset Formula">\(R\subseteq\MKreal^{2}\)</span> מלבן, יהי <span class="inset Formula">\(P\)</span> שריג על <span class="inset Formula">\(R\)</span>, יהיו <span class="inset Formula">\(R_{1},R_{2},\ldots,R_{n}\subseteq R\)</span> כל תתי המלבנים שמגדירה <span class="inset Formula">\(P\)</span> ותהא <span class="inset Formula">\(f:R\rightarrow\MKreal\)</span> פונקציה חסומה.</div>
        <div class="layout Definition"><span class="label">הגדרה 1.4. </span><b class="series bold">סכומי דארבו</b><span class="inset Foot"><span class="label">1</span><span class="layout Plain Layout">ערך בוויקיפדיה: <a href="https://he.wikipedia.org/wiki/%D7%96%27%D7%90%D7%9F_%D7%92%D7%A1%D7%98%D7%95%D7%9F_%D7%93%D7%90%D7%A8%D7%91%D7%95" class="inset CommandInset href">גסטון ז'אן דארבו</a>.</span></span><br class="inset Newline newline"/>נסמן (לכל <span class="inset Formula">\(n\geq i\in\MKnatural\)</span>):<span class="inset Formula">\[
M_{i}:=\sup\left\{ f\left(x\right)\mid x\in R_{i}\right\} ,\ m_{i}:=\inf\left\{ f\left(x\right)\mid x\in R_{i}\right\} 
\]</span>ונגדיר:<span class="inset Formula">\[
U\left(f,P\right):=\sum_{i=1}^{n}M_{i}\cdot A\left(R_{i}\right),\ L\left(f,P\right):=\sum_{i=1}^{n}m_{i}\cdot A\left(R_{i}\right)
\]</span>ל-<span class="inset Formula">\(U\left(f,P\right)\)</span> נקרא <u class="bar under">סכום דארבו העליון</u> של <span class="inset Formula">\(f\)</span> עבור <span class="inset Formula">\(P\)</span> ול-<span class="inset Formula">\(L\left(f,P\right)\)</span> נקרא <u class="bar under">סכום דארבו התחתון</u> של <span class="inset Formula">\(f\)</span> עבור <span class="inset Formula">\(P\)</span>.</div>
        <div class="layout Claim"><span class="label">טענה 1.5. </span>יהי <span class="inset Formula">\(Q\)</span> עידון של <span class="inset Formula">\(P\)</span>, מתקיים:<span class="inset Formula">\[
L\left(f,P\right)\leq L\left(f,Q\right)\leq U\left(f,Q\right)\leq U\left(f,P\right)
\]</span></div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 1.6. </span>יהיו <span class="inset Formula">\(m,M\in\MKreal\)</span> כך שלכל <span class="inset Formula">\(y\in\MKim f\)</span> מתקיים <span class="inset Formula">\(m\leq y\leq M\)</span>, לכל שני שריגים <span class="inset Formula">\(Q\)</span> ו-<span class="inset Formula">\(\tilde{Q}\)</span> על <span class="inset Formula">\(R\)</span> מתקיים:<span class="inset Formula">\[
m\cdot A\left(R\right)\leq L\left(f,Q\right)\leq U\left(f,\tilde{Q}\right)\leq M\cdot A\left(R\right)
\]</span></div>
        <div class="layout Standard">נסמן ב-<span class="inset Formula">\(\mathcal{L}\)</span> את קבוצת סכומי דרבו התחתונים של <span class="inset Formula">\(f\)</span> עבור כל השריגים על <span class="inset Formula">\(R\)</span> וב-<span class="inset Formula">\(\mathcal{U}\)</span> את קבוצת סכומי דרבו העליונים של <span class="inset Formula">\(f\)</span> עבור כל השריגים על <span class="inset Formula">\(R\)</span>, כפי שראינו לעיל אלו קבוצות חסומות.</div>
        <div class="layout Definition"><span class="label">הגדרה 1.7. </span><b class="series bold">אינטגרל עליון ואינטגרל תחתון</b><ul>
            <li class="layout Itemize"><u class="bar under">האינטגרל העליון</u> של <span class="inset Formula">\(f\)</span> ב-<span class="inset Formula">\(R\)</span> הוא:<span class="inset Formula">\[
\overline{\iintop_{R}}f\ dA:=\inf\left(\mathcal{U}\right)
\]</span></li>
            <li class="layout Itemize"><u class="bar under">האינטגרל התחתון</u> של <span class="inset Formula">\(f\)</span> ב-<span class="inset Formula">\(R\)</span> הוא:<span class="inset Formula">\[
\underline{\iintop_{R}}f\ dA:=\sup\left(\mathcal{L}\right)
\]</span></li>
          </ul>
        </div>
        <div class="layout Corollary"><span class="label">מסקנה 1.8. </span>מתקיים:<span class="inset Formula">\[
\underline{\iintop_{R}}f\ dA\leq\overline{\iintop_{R}}f\ dA
\]</span></div>
        <div class="layout Definition"><span class="label">הגדרה 1.9. </span><b class="series bold">אינטגרביליות</b><br class="inset Newline newline"/>נאמר ש-<span class="inset Formula">\(f\)</span><u class="bar under">אינטגרבילית</u> ב-<span class="inset Formula">\(R\)</span> אם מתקיים:<span class="inset Formula">\[
\underline{\iintop_{R}}f\ dA=\overline{\iintop_{R}}f\ dA
\]</span>ואז נסמן את הערך המשותף ב-<span class="inset Formula">\(\begin{alignedat}{1}\iintop_{R}f\ dA\end{alignedat}
\)</span>ונקרא לו <u class="bar under">האינטגרל</u> של <span class="inset Formula">\(f\)</span> ב-<span class="inset Formula">\(R\)</span>.</div>
        <div class="layout Definition"><span class="label">הגדרה 1.10. </span><b class="series bold">נפח</b><br class="inset Newline newline"/>אם <span class="inset Formula">\(f\)</span> אי-שלילית נאמר ש-<span class="inset Formula">\(\begin{alignedat}{1}\iintop_{R}f\ dA\end{alignedat}
\)</span> הוא <u class="bar under">הנפח</u> של הקבוצה:<span class="inset Formula">\[
\left\{ \begin{array}{c|c}
\begin{pmatrix}x\\
y\\
z
\end{pmatrix}\in\MKreal^{3} &amp; \begin{pmatrix}x\\
y
\end{pmatrix}\in R,\ 0\leq z\leq f\begin{pmatrix}x\\
y
\end{pmatrix}\end{array}\right\} 
\]</span></div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_1.2"><span class="label">1.2 </span><span id="subsection 1.1" class="inset CommandInset label"/>תכונות בסיסיות של אינטגרביליות</h3>
        <div class="layout Standard">יהי <span class="inset Formula">\(R:=\left[a,b\right]\times\left[c,d\right]\subseteq\MKreal^{2}\)</span> מלבן ותהיינה <span class="inset Formula">\(f,g:R\rightarrow\MKreal\)</span> שתי פונקציות אינטגרביליות ב-<span class="inset Formula">\(R\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 1.11. </span><b class="series bold">תכונות בסיסיות של אינטגרביליות</b><ol>
            <li class="layout Enumerate">אם <span class="inset Formula">\(f\)</span> אי-שלילית אז גם <span class="inset Formula">\(\begin{alignedat}{1}0\leq\iintop_{R}f\ dA\end{alignedat}
\)</span>.</li>
            <li class="layout Enumerate">אם <span class="inset Formula">\(f\left(x\right)\geq g\left(x\right)\)</span> לכל <span class="inset Formula">\(x\in R\)</span> אז גם <span class="inset Formula">\(\begin{alignedat}{1}\iintop_{R}f\ dA\geq\iintop_{R}g\ dA\end{alignedat}
\)</span>.</li>
            <li class="layout Enumerate">הפונקציות <span class="inset Formula">\(f\pm g\)</span> אינטגרביליות ב-<span class="inset Formula">\(R\)</span> ומתקיים:<span class="inset Formula">\[
\iintop_{R}f\pm g\ dA=\iintop_{R}f\ dA\pm\iintop_{R}g\ dA
\]</span></li>
            <li class="layout Enumerate">לכל <span class="inset Formula">\(\lambda\in\MKreal\)</span> הפונקציה <span class="inset Formula">\(\lambda\cdot f\)</span> אינטגרבילית ב-<span class="inset Formula">\(R\)</span> ומתקיים:<span class="inset Formula">\[
\iintop_{R}\lambda\cdot f\ dA=\lambda\cdot\iintop_{R}f\ dA
\]</span></li>
          </ol>
        </div>
        <div class="layout Theorem"><span class="label">משפט 1.12. </span>הפונקציה <span class="inset Formula">\(f\cdot g\)</span> אינטגרבילית ב-<span class="inset Formula">\(R\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 1.13. </span>אם קיים <span class="inset Formula">\(0&lt;m\in\MKreal\)</span> כך ש-<span class="inset Formula">\(m\leq\left|g\left(x\right)\right|\)</span> לכל <span class="inset Formula">\(x\in R\)</span> אז הפונקציה <span class="inset Formula">\(\frac{1}{g}\)</span> אינטגרבילית ב-<span class="inset Formula">\(R\)</span>.</div>
        <div class="layout Corollary"><span class="label">מסקנה 1.14. </span>אם קיים <span class="inset Formula">\(0&lt;m\in\MKreal\)</span> כך ש-<span class="inset Formula">\(m\leq\left|g\left(x\right)\right|\)</span> לכל <span class="inset Formula">\(x\in R\)</span> אז הפונקציה <span class="inset Formula">\(\frac{f}{g}\)</span> אינטגרבילית ב-<span class="inset Formula">\(R\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 1.15. </span>אם <span class="inset Formula">\(f\left(x\right)\equiv1\)</span> אז <span class="inset Formula">\(\begin{alignedat}{1}\iintop_{R}f\ dA=A\left(R\right)\end{alignedat}
\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 1.16. </span>הפונקציה <span class="inset Formula">\(\left|f\right|\)</span> אינטגרבילית ב-<span class="inset Formula">\(R\)</span> ומתקיים:<span class="inset Formula">\[
\left|\iintop_{R}f\ dA\right|\leq\iintop_{R}\left|f\right|dA
\]</span></div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> נשים לב לדמיון לא“ש המשולש, גם כאן הערך המוחלט של ה“סכום“ קטן או שווה לסכום של הערכים המוחלטים ומבחינה אינטואיטיבית זה קורה מאותה סיבה.</dd>
          </div>
        </dl>
        <div class="layout Claim"><span class="label">טענה 1.17. </span>יהי <span class="inset Formula">\(R'\subseteq R\)</span> מלבן, <span class="inset Formula">\(f\)</span> אינטגרבילית ב-<span class="inset Formula">\(R'\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 1.18. </span><span id="claim 1.7" class="inset CommandInset label"/>יהי <span class="inset Formula">\(\gamma\in\left(a,b\right)\)</span>, נסמן <span class="inset Formula">\(R_{1}:=\left[a,\gamma\right]\times\left[c,d\right]\)</span> ו-<span class="inset Formula">\(R_{2}:=\left[\gamma,b\right]\times\left[c,d\right]\)</span> ותהא <span class="inset Formula">\(h\)</span> פונקציה אינטגרבילית על <span class="inset Formula">\(R_{1}\)</span> ועל <span class="inset Formula">\(R_{2}\)</span>, <span class="inset Formula">\(h\)</span> אינטגרבילית על <span class="inset Formula">\(R=R_{1}\cup R_{2}\)</span> ומתקיים:<span class="inset Formula">\[
\iintop_{R}h\ dA=\iintop_{R_{1}}h\ dA+\iintop_{R_{2}}h\ dA
\]</span></div>
      </section>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_1.3"><span class="label">1.3 </span>משפט פוביני ופונקציות רציפות</h3>
        <div class="layout Standard">יהי <span class="inset Formula">\(R:=\left[a,b\right]\times\left[c,d\right]\subseteq\MKreal^{2}\)</span> מלבן ותהא <span class="inset Formula">\(f:R\rightarrow\MKreal\)</span>.</div>
        <div class="layout Theorem"><span class="label">משפט 1.19. </span>אם <span class="inset Formula">\(f\)</span> רציפה אז <span class="inset Formula">\(f\)</span> אינטגרבילית ב-<span class="inset Formula">\(R\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Theorem"><span class="label">משפט 1.20. </span><b class="series bold">משפט פוביני</b><span class="inset Foot"><span class="label">2</span><span class="layout Plain Layout">ערך בוויקיפדיה: <a href="https://he.wikipedia.org/wiki/%D7%92%D7%95%D7%95%D7%99%D7%93%D7%95_%D7%A4%D7%95%D7%91%D7%99%D7%A0%D7%99" class="inset CommandInset href">גווידו פוביני</a>.</span></span><ul>
            <li class="layout Itemize">אם <span class="inset Formula">\(f\)</span> אינטגרבילית ב-<span class="inset Formula">\(R\)</span> ולכל <span class="inset Formula">\(y\in\left[c,d\right]\)</span> קיים האינטגרל <span class="inset Formula">\(\intop_{a}^{b}f\left(x,y\right)dx\)</span> אז קיים האינטגרל הנשנה <span class="inset Formula">\(\intop_{c}^{d}\left(\intop_{a}^{b}f\left(x,y\right)dx\right)dy\)</span> ומתקיים:<span class="inset Formula">\[
\intop_{c}^{d}\left(\intop_{a}^{b}f\begin{pmatrix}x\\
y
\end{pmatrix}dx\right)dy=\iintop_{R}fdA
\]</span></li>
            <li class="layout Itemize">אם <span class="inset Formula">\(f\)</span> אינטגרבילית ב-<span class="inset Formula">\(R\)</span> ואם לכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> קיים האינטגרל <span class="inset Formula">\(\intop_{c}^{d}f\left(x,y\right)dx\)</span> אז קיים האינטגרל הנשנה <span class="inset Formula">\(\intop_{a}^{b}\left(\intop_{c}^{d}f\left(x,y\right)dx\right)dy\)</span> ומתקיים:<span class="inset Formula">\[
\intop_{a}^{b}\left(\intop_{c}^{d}f\left(x,y\right)dx\right)dy=\iintop_{R}fdA
\]</span></li>
          </ul>
        </div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> הרעיון הוא שאנחנו "פורסים" את הנפח המבוקש לפרוסות דקות וסוכמים אותן.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/><b class="series bold"><span class="color red">לכתוב על הקשר בין משפט פוביני למשפט שוורץ (הנוסחה היסודית).</span></b></dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> זה דומה מאד לעובדה שמתקיים<span class="inset Foot"><span class="label">3</span><span class="layout Plain Layout">שהרי לא משנה באיזה סדר סוכמים איברים בטבלה.</span></span>:<span class="inset Formula">\[
\sum_{i=1}^{n}\sum_{j=1}^{m}x_{i,j}=\sum_{j=1}^{m}\sum_{i=1}^{n}x_{i,j}
\]</span>רק שכאן הסכימה רציפה ולא בדידה.</dd>
          </div>
        </dl>
        <div class="layout Corollary"><span class="label">מסקנה 1.21. </span>אם <span class="inset Formula">\(f\)</span> אינטגרבילית ב-<span class="inset Formula">\(R\)</span> ובנוסף לכל <span class="inset Formula">\(y\in\left[c,d\right]\)</span> קיים האינטגרל <span class="inset Formula">\(\intop_{a}^{b}f\left(x,y\right)dx\)</span> ולכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> קיים האינטגרל <span class="inset Formula">\(\intop_{c}^{d}f\left(x,y\right)dx\)</span> אז מתקיים:<span class="inset Formula">\[
\intop_{c}^{d}\left(\intop_{a}^{b}f\begin{pmatrix}x\\
y
\end{pmatrix}dx\right)dy=\iintop_{R}fdA=\intop_{a}^{b}\left(\intop_{c}^{d}f\left(x,y\right)dx\right)dy
\]</span></div>
        <div class="layout Claim"><span class="label">טענה 1.22. </span>אם <span class="inset Formula">\(f\)</span> רציפה אז לכל <span class="inset Formula">\(y\)</span> הפונקציה <span class="inset Formula">\(g:\left[a,b\right]\rightarrow\MKreal\)</span> המוגדרת ע"י <span class="inset Formula">\(g\left(x\right):=f{x \choose y}\)</span> רציפה וכמו כן גם הפונקציה <span class="inset Formula">\(h:\left[a,b\right]\rightarrow\MKreal\)</span> המוגדרת ע"י <span class="inset Formula">\(h\left(x\right):=f{x \choose y}\)</span> רציפה.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Corollary"><span class="label">מסקנה 1.23. </span>אם <span class="inset Formula">\(f\)</span> רציפה אז מתקיים:<span class="inset Formula">\[
\intop_{c}^{d}\left(\intop_{a}^{b}f\begin{pmatrix}x\\
y
\end{pmatrix}dx\right)dy=\iintop_{R}fdA=\intop_{a}^{b}\left(\intop_{c}^{d}f\left(x,y\right)dx\right)dy
\]</span></div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
      </section>
    </section>
    <section class="layout Section">
      <h2 class="layout Section" id="Section_2"><span class="label">2 </span>אינטגרביליות על קבוצה כללית</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_2.1"><span class="label">2.1 </span>הגדרות</h3>
        <div class="layout Definition"><span class="label">הגדרה 2.1. </span><b class="series bold">אינטגרביליות על קבוצה שאינה מלבן</b><br class="inset Newline newline"/>תהיינה <span class="inset Formula">\(D\subseteq\MKreal^{2}\)</span> קבוצה חסומה ו-<span class="inset Formula">\(f:D\rightarrow\MKreal\)</span> פונקציה חסומה ויהי <span class="inset Formula">\(R\subseteq\MKreal^{2}\)</span> מלבן כך ש-<span class="inset Formula">\(D\subseteq R\)</span>, נאמר ש-<span class="inset Formula">\(f\)</span><u class="bar under">אינטגרבילית</u> על <span class="inset Formula">\(D\)</span> אם הפונקציה המוגדרת ע"י (לכל <span class="inset Formula">\(\left(x,y\right)\in R\)</span>):<span class="inset Formula">\[
g\begin{pmatrix}x\\
y
\end{pmatrix}:=\begin{cases}
f\left(x,y\right) &amp; \left(x,y\right)\in D\\
0 &amp; \left(x,y\right)\notin D
\end{cases}
\]</span>אינטגרבילית ב-<span class="inset Formula">\(R\)</span> ובמקרה כזה נאמר שהאינטגרל של <span class="inset Formula">\(f\)</span> ב-<span class="inset Formula">\(D\)</span> הוא:<span class="inset Formula">\[
\iintop_{D}f\ dA=\iintop_{R}g\ dA
\]</span></div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> נשים לב שלכל מלבן המקיים <span class="inset Formula">\(D\subseteq R\)</span> נקבל את אותו אינטגרל ולכן האינטגרל מוגדר היטב.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> הרעיון מאחורי ההגדרה של קבוצה נורמלית הוא שקבוצות נורמליות הן "כמעט" מלבנים<span class="inset Foot"><span class="label">4</span><span class="layout Plain Layout">בהצגה קוטבית המלבנים הם קבוצות מהצורה <span class="inset Formula">\(\left\{ \left(r\cos\theta,r\sin\theta\right)\in\MKreal^{2}\mid a\leq r\leq b,\ c\leq\theta\leq d\right\} \)</span>.</span></span>.</dd>
          </div>
        </dl>
        <div class="layout Definition"><span class="label">הגדרה 2.2. </span><b class="series bold">קבוצה בעלת שטח</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(D\subseteq\MKreal^{2}\)</span> קבוצה חסומה, נאמר ש-<span class="inset Formula">\(D\)</span><u class="bar under">בעלת שטח</u> אם <span class="inset Formula">\(\chi_{D}\)</span> (הפונקציה המציינת של <span class="inset Formula">\(D\)</span>) אינטגרבילית ב-<span class="inset Formula">\(D\)</span> ואז נגדיר את ה<u class="bar under">שטח</u> של <span class="inset Formula">\(D\)</span> ע"י:<span class="inset Formula">\[
A\left(D\right):=\iintop_{D}\chi_{D}dA
\]</span></div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Definition"><span class="label">הגדרה 2.3. </span><b class="series bold">קבוצה נורמלית</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(D\subseteq\MKreal^{2}\)</span> קבוצה.<ul>
            <li class="layout Itemize">נאמר ש-<span class="inset Formula">\(D\)</span><u class="bar under">נורמלית ביחס לציר ה-<span class="inset Formula">\(x\)</span></u> אם קיים קטע סגור <span class="inset Formula">\(I\subseteq\MKreal\)</span> וקיימות שתי פונקציות <span class="inset Formula">\(g_{1},g_{2}:I\rightarrow\MKreal\)</span> כך שמתקיים<span class="inset Formula">\[
D=\left\{ \left(x,y\right)\in\MKreal^{2}\mid x\in I,\ g_{1}\left(x\right)\leq y\leq g_{2}\left(x\right)\right\} 
\]</span></li>
            <li class="layout Itemize">נאמר ש-<span class="inset Formula">\(D\)</span><u class="bar under">נורמלית ביחס לציר ה-<span class="inset Formula">\(y\)</span></u> אם קיים קטע סגור <span class="inset Formula">\(I\subseteq\MKreal\)</span> וקיימות שתי פונקציות <span class="inset Formula">\(g_{1},g_{2}:I\rightarrow\MKreal\)</span> כך שמתקיים<span class="inset Formula">\[
D=\left\{ \left(x,y\right)\in\MKreal^{2}\mid y\in I,\ g_{1}\left(x\right)\leq x\leq g_{2}\left(x\right)\right\} 
\]</span></li>
            <li class="layout Itemize">נאמר ש-<span class="inset Formula">\(D\)</span><u class="bar under">נורמלית בהצגה קוטבית</u> אם קיים קטע סגור <span class="inset Formula">\(I\subseteq\left[0,2\pi\right]\)</span> וקיימות שתי פונקציות <span class="inset Formula">\(g_{1},g_{2}:I\rightarrow\MKreal\)</span> כך שמתקיים<span class="inset Formula">\[
D=\left\{ \left(r\cos\theta,r\sin\theta\right)\in\MKreal^{2}\mid\theta\in I,\ 0\leq g_{1}\left(x\right)\leq r\leq g_{2}\left(x\right)\right\} 
\]</span></li>
          </ul>
        </div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 2.4. </span>כל קבוצה נורמלית היא קבוצה בעלת שטח.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Claim"><span class="label">טענה 2.5. </span>כל הטענות והמשפטים שראינו בסעיף <span class="color blue">
            <a href="#subsection 1.1" class="inset CommandInset ref">1.1</a>
          </span> לגבי אינטגרביליות על מלבן נכונות גם עבור קבוצות בעלות שטח<span class="inset Foot"><span class="label">5</span><span class="layout Plain Layout">כלומר בכל אחת מהטענות הללו ניתן להחליף את המלבן <span class="inset Formula">\(R\)</span> בקבוצה בעלת שטח <span class="inset Formula">\(D\)</span> והטענה תישאר נכונה.</span></span> מלבד טענה <span class="numeric on">
            <a href="#claim 1.7" class="inset CommandInset ref">1.7</a><span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"/>
                  </span></span></span></span></span><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span>שדורשת ניסוח שונה מעט:<br class="inset Newline newline"/>תהיינה <span class="inset Formula">\(D_{1},D_{2}\subseteq\MKreal^{2}\)</span> קבוצות בעלות שטח כך ש-<span class="inset Formula">\(D_{1}\cap D_{2}\)</span><u class="bar under">בעלת שטח <span class="inset Formula">\(0\)</span></u>, נסמן <span class="inset Formula">\(D:=D_{1}\cup D_{2}\)</span> ותהא <span class="inset Formula">\(f:D\rightarrow\MKreal\)</span> פונקציה אינטגרבילית על <span class="inset Formula">\(D_{1}\)</span> ועל <span class="inset Formula">\(D_{2}\)</span>; <span class="inset Formula">\(f\)</span> אינטגרבילית על <span class="inset Formula">\(D\)</span> ומתקיים:<span class="inset Formula">\[
\iintop_{D}f\ dA=\iintop_{D_{1}}f\ dA+\iintop_{D_{2}}f\ dA
\]</span></div>
        <div class="layout Theorem"><span class="label">משפט 2.6. </span>קבוצה חסומה <span class="inset Formula">\(D\subseteq\MKreal^{2}\)</span> היא בעלת שטח אם"ם <span class="inset Formula">\(\partial D\)</span> (קבוצת נקודות השפה של <span class="inset Formula">\(D\)</span>) היא בעלת שטח <span class="inset Formula">\(0\)</span>.</div>
        <div class="layout Standard"><span class="inset Separator plain"/>
        </div>
        <div class="layout Theorem"><span class="label">משפט 2.7. </span>תהא <span class="inset Formula">\(D\subseteq\MKreal^{2}\)</span> ותהא <span class="inset Formula">\(f:D\rightarrow\MKreal\)</span> פונקציה רציפה<span class="inset Foot"><span class="label">6</span><span class="layout Plain Layout"><b class="series bold"><span class="color red">האם לא מספיק שלכל <span class="inset Formula">\(x\in\left[a,b\right]\)</span> קיים האינטגרל<span class="inset Formula">\[
\intop_{g_{1}\left(x\right)}^{g_{2}\left(x\right)}f\begin{pmatrix}x\\
y
\end{pmatrix}dy
\]</span>???</span></b></span></span> ב-<span class="inset Formula">\(D\)</span>.<ul>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(D\)</span> קבוצה נורמלית לפי <span class="inset Formula">\(x\)</span>, יהי <span class="inset Formula">\(\left[a,b\right]\subseteq\MKreal\)</span> קטע סגור ותהיינה <span class="inset Formula">\(g_{1},g_{2}:\left[a,b\right]\rightarrow\MKreal\)</span> שתי פונקציות כך שמתקיים<span class="inset Formula">\[
D=\left\{ \left(x,y\right)\in\MKreal^{2}\mid x\in\left[a,b\right],\ g_{1}\left(x\right)\leq y\leq g_{2}\left(x\right)\right\} 
\]</span>מתקיים גם:<span class="inset Formula">\[
\iintop_{D}f\ dA=\intop_{a}^{b}\left(\intop_{g_{1}\left(x\right)}^{g_{2}\left(x\right)}f\begin{pmatrix}x\\
y
\end{pmatrix}dy\right)dx
\]</span></li>
            <li class="layout Itemize">נניח ש-<span class="inset Formula">\(D\)</span> קבוצה נורמלית לפי <span class="inset Formula">\(y\)</span>, יהי <span class="inset Formula">\(\left[c,d\right]\subseteq\MKreal\)</span> קטע סגור ותהיינה <span class="inset Formula">\(h_{1},h_{2}:\left[c,d\right]\rightarrow\MKreal\)</span> שתי פונקציות כך שמתקיים<span class="inset Formula">\[
D=\left\{ \left(x,y\right)\in\MKreal^{2}\mid y\in\left[c,d\right],\ h_{1}\left(x\right)\leq y\leq h_{2}\left(x\right)\right\} 
\]</span>מתקיים גם:<span class="inset Formula">\[
\iintop_{D}f\ dA=\intop_{c}^{d}\left(\intop_{h_{1}\left(y\right)}^{h_{2}\left(y\right)}f\begin{pmatrix}x\\
y
\end{pmatrix}dx\right)dy
\]</span></li>
          </ul>
        </div>
        <div class="layout Standard"><span class="inset Newpage newpage"/>
        </div>
      </section>
    </section>
    <section class="layout Section">
      <h2 class="layout Section" id="Section_3"><span class="label">3 </span>החלפת משתנים</h2>
      <section class="layout Subsection">
        <h3 class="layout Subsection" id="Subsection_3.1"><span class="label">3.1 </span>הגדרות</h3>
        <div class="layout Standard"><b class="series bold"><span class="color red">להוסיף כאן אינטואיציה להצבה במשתנה אחד - העיוות של הישר הממשי/המרחב ע"י הפונקציה והתיקון הנדרש.</span></b></div>
        <div class="layout Standard">תהא <span class="inset Formula">\(D\subseteq\MKreal^{2}\)</span> קבוצה חסומה, תהיינה <span class="inset Formula">\(x,y:D\rightarrow\MKreal\)</span> ותהא <span class="inset Formula">\(f:D\rightarrow\MKreal^{2}\)</span> המוגדרת ע"י (לכל <span class="inset Formula">\(\left(s,t\right)\in D\)</span>):<span class="inset Formula">\[
f\begin{pmatrix}s\\
t
\end{pmatrix}:=\begin{bmatrix}x\left(s,t\right)\\
y\left(s,t\right)
\end{bmatrix}
\]</span></div>
        <dl>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/><u class="bar under">מטריצת יעקובי</u> של <span class="inset Formula">\(f\)</span> בנקודה פנימית <span class="inset Formula">\(P\in D\)</span> היא המטריצה הבאה:<span class="inset Formula">\[
J_{f}\left(P\right):=\left[\begin{array}{cc}
x_{s}'\left(P\right) &amp; x_{t}'\left(P\right)\\
y_{s}'\left(P\right) &amp; y_{t}'\left(P\right)
\end{array}\right]
\]</span>אם כל הנגזרות החלקיות המופיעות במטריצה רציפות ב-<span class="inset Formula">\(P\)</span> אז כפי שלמדנו הדבר גורר ש-<span class="inset Formula">\(f\)</span> דיפרנציאבילית ב-<span class="inset Formula">\(P\)</span> ויתרה מזאת מטריצת יעקובי היא המטריצה המייצגת (בבסיס הסטנרדטי) של ההעתקה הליניארית המהווה את הדיפרנציאל של <span class="inset Formula">\(f\)</span> ב-<span class="inset Formula">\(P\)</span>, הדטרמיננטה של מטריצה יעקובי בנקודה <span class="inset Formula">\(P\)</span> נקראת <u class="bar under">היעקוביאן</u> של <span class="inset Formula">\(f\)</span> ב-<span class="inset Formula">\(P\)</span>.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> הרעיון הוא בדיוק כמו במשפט ההצבה של האינטגרל המסוים באינפי'<span class="family roman"><span class="series medium"><span class="shape up"><span class="size normal"><span class="emph off"><span class="bar no"><span class="strikeout off"><span class="xout off"><span class="uuline off"><span class="uwave off"><span class="noun off"><span class="color none"> </span></span></span></span></span></span></span></span></span></span></span></span><span class="numeric on">2</span>: אנחנו מציבים בתוך הפונקציה שעליה מתבצעת האינטגרציה פונקציה פנימית אבל מכיוון שהאחרונה מעוותת את המרחב עלינו לבצע תיקון, וזה מתבצע ע"י כפל בדטרמיננטה של ההעתקה הליניארית המהווה את הדיפרנציאל של הפונקציה הפנימית בכל נקודה<span class="inset Foot"><span class="label">7</span><span class="layout Plain Layout">כלומר <span class="inset Formula">\(\left|J_{f}\right|\)</span> היא בעצמה פונקציה המוגדרת ע"י הדטרמיננטה של <span class="inset Formula">\(J_{f}\)</span> בנקודה.</span></span>.</dd>
          </div>
          <div class="layout Labeling item">
            <dt class="layout Labeling">\(\clubsuit\)</dt>
            <dd class="layout Labeling"><span class="labelwidthstring 00.00.0000"/><span class="inset Formula"/> לא הבאנו כאן את התנאים למשפט מפני שלא למדנו אותם בכיתה, בספר שנועה המליצה עליו (היא קראה לו "הספר של אנטון") נכתב שהתנאים הם ש-<span class="inset Formula">\(f\)</span> חח"ע, <span class="inset Formula">\(g\)</span> רציפה, הנגזרות החלקיות של <span class="inset Formula">\(x\)</span> ו-<span class="inset Formula">\(y\)</span> בכל נקודה ב-<span class="inset Formula">\(D\)</span> רציפות בנקודה זו (כלומר <span class="inset Formula">\(f\)</span> דיפרנציאבילית ב-<span class="inset Formula">\(D\)</span>) ו-"התחומים <span class="inset Formula">\(R\)</span> ו-<span class="inset Formula">\(D\)</span> אינם מסובכים מדי".</dd>
          </div>
        </dl>
        <div class="layout Theorem"><span class="label">משפט 3.1. </span><b class="series bold">הצבה</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(g:R\rightarrow\MKreal\)</span> (<span class="inset Formula">\(R\subseteq\MKreal^{2}\)</span> קבוצה חסומה שאינה בהכרח מלבן), תהא <span class="inset Formula">\(D\subseteq\MKreal^{2}\)</span> קבוצה חסומה, תהיינה <span class="inset Formula">\(x,y:D\rightarrow\MKreal\)</span> ותהא <span class="inset Formula">\(f:D\rightarrow\MKreal^{2}\)</span> המוגדרת ע"י (לכל <span class="inset Formula">\(\left(s,t\right)\in D\)</span>):<span class="inset Formula">\[
f\begin{pmatrix}s\\
t
\end{pmatrix}:=\begin{bmatrix}x\left(s,t\right)\\
y\left(s,t\right)
\end{bmatrix}
\]</span> כך ש-<span class="inset Formula">\(\MKim\left(f\right)=R\)</span>. מתקיים:<span class="inset Formula">\[
\iintop_{R}g\ dA=\iintop_{D}\left(g\circ f\right)\cdot\left|J_{f}\right|\ dA
\]</span></div>
        <div class="layout Standard">תהא <span class="inset Formula">\(h:\left[0,\infty\right)\times\left[0,2\pi\right)\rightarrow\MKreal^{2}\)</span> הפונקציה המעבירה מהצגה קוטבית להצגה קרטזית<span class="inset Foot"><span class="label">8</span><span class="layout Plain Layout">למעשה יש להגביל את התחום ל-<span class="inset Formula">\(\left(0,\infty\right)\times\left[0,2\pi\right)\)</span> איחוד עם <span class="inset Formula">\(\left\{ \left(0,0\right)\right\} \)</span> כדי ש-<span class="inset Formula">\(h\)</span> תהיה חח"ע.</span></span>, כלומר לכל <span class="inset Formula">\(\left(r,\theta\right)\in\left[0,\infty\right)\times\left[0,2\pi\right)\)</span> מתקיים:<span class="inset Formula">\[
h\begin{pmatrix}r\\
\theta
\end{pmatrix}=\begin{bmatrix}r\cos\theta\\
r\sin\theta
\end{bmatrix}
\]</span>מהגדרה לכל <span class="inset Formula">\(\left(r,\theta\right)\in\left[0,\infty\right)\times\left[0,2\pi\right)\)</span> מתקיים:<span class="inset Formula">\[
J_{h}\begin{pmatrix}r\\
\theta
\end{pmatrix}=\left[\begin{array}{cc}
\cos\theta &amp; -r\sin\theta\\
\sin\theta &amp; r\cos\theta
\end{array}\right]
\]</span>ולכן גם:<span class="inset Formula">\[
\left|J_{h}\left(r,\theta\right)\right|=r\cos^{2}\theta-\left(-r\sin^{2}\theta\right)=r\cdot\left(\cos^{2}\theta+\sin^{2}\theta\right)=r
\]</span></div>
        <div class="layout Corollary"><span class="label">מסקנה 3.2. </span><b class="series bold">מעבר להצגה קוטבית</b><br class="inset Newline newline"/>תהא <span class="inset Formula">\(D\subseteq\MKreal^{2}\)</span> קבוצה נורמלית בהצגה קוטבית, יהי <span class="inset Formula">\(\left[\theta_{1},\theta_{2}\right]\subseteq\left[0,2\pi\right]\)</span> קטע סגור ותהיינה <span class="inset Formula">\(s_{1},s_{2}:\left[\theta_{1},\theta_{2}\right]\rightarrow\MKreal\)</span> שתי פונקציות כך שמתקיים:<span class="inset Formula">\[
D=\left\{ \left(r\cos\theta,r\sin\theta\right)\in\MKreal^{2}\mid\theta\in\left[\theta_{1},\theta_{2}\right],\ 0\leq s_{1}\left(\theta\right)\leq r\leq s_{2}\left(\theta\right)\right\} 
\]</span>תהא <span class="inset Formula">\(f:D\rightarrow\MKreal\)</span> פונקציה רציפה, מתקיים:<span class="inset Formula">\[
\iintop_{D}f\ dA=\intop_{\theta_{1}}^{\theta_{2}}\left(\intop_{s_{1}\left(\theta\right)}^{s_{2}\left(\theta\right)}f\begin{pmatrix}r\cos\theta\\
r\sin\theta
\end{pmatrix}\cdot r\ dr\right)d\theta
\]</span></div>
      </section>
