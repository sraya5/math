<html xmlns="http://www.w3.org/1999/xhtml" lang="he-IL">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
    <style>
        span.inset.Foot span.label {
            display: inline;
            vertical-align: super;
            font-size: 0.7em;
            cursor: pointer;
        }
        span.inset.Foot span.layout.Plain.Layout {display: none;}
        span.inset.Foot:hover span.layout.Plain.Layout  {
            display: inline;
            width: fit-content;
            font-size: small;
            position: absolute;
            background-color: light-dark(lightgray, rgb(50, 50, 50));
            padding: 0.3em;
            padding-left: 0.5em;
            padding-right: 0.5em;
            z-index: 1;
        }
    </style>
    <span class="inset Foot">
        <span class="label">foot number</span>
        <span class="layout Plain Layout">foot content</span>
    </span>
</body>
</html>
