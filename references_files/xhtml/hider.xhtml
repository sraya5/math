<html xmlns="http://www.w3.org/1999/xhtml" lang="he-IL">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta src="https://www.w3schools.com/html/tryit.asp?filename=tryhtml_input_checkbox2" />
</head>
<body>
  <style>
    label {
      font-family: Heebo, Arial, sans-serif;
      font-weight: bold;
    }
  </style>
  <p style="font-size: small;">סמנו ב-✔, או בטלו את הסימון, כדי להחביא/לראות את האובייקטים השונים:</p>
  <form class="container">
    <input type="checkbox" checked="checked" onclick="toggleMultipleClasses(['Definition'], this.checked)" />
    <label for="definitions_checkbox">הגדרות</label>
    <input type="checkbox" checked="checked" onclick="toggleMultipleClasses(['Lemma', 'Claim', 'Proposition', 'Theorem', 'Corollary', 'Proof'], this.checked)" />
    <label for="theorems_checkbox">משפטים</label>
    <input type="checkbox" checked="checked" onclick="toggleMultipleClasses(['Proof'], this.checked)" />
    <label for="proofs_checkbox">הוכחות</label>
    <input type="checkbox" checked="checked"  onclick="toggleMultipleClasses(['Example'], this.checked)" />
    <label for="examples_checkbox">דוגמאות</label>
  </form>
</body>
</html>
