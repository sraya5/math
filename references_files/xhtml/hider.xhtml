<html xmlns="http://www.w3.org/1999/xhtml" lang="he-IL">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta src="https://www.w3schools.com/html/tryit.asp?filename=tryhtml_input_checkbox2" />
</head>
<body>
  <style>
    label {
      font-family: Heebo, Arial, sans-serif;
      font-weight: bold;
      font-size: small;
    }
  </style>
  <div class="container">
    <input type="checkbox" id="definitions_checkbox" checked="checked" />
    <label for="definitions_checkbox">הגדרות</label>
    <br />
    <input type="checkbox" id="theorems_checkbox" checked="checked" />
    <label for="theorems_checkbox">משפטים</label>
    <br />
    <input type="checkbox" id="proofs_checkbox" checked="checked" />
    <label for="proofs_checkbox">הוכחות</label>
    <br />
    <input type="checkbox" id="examples_checkbox" checked="checked" />
    <label for="examples_checkbox">דוגמאות</label>
  </div>
</body>
</html>
